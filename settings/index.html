<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paramètres - BlocPlay</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.ico">

<style>
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
}

.modal.show {
    display: flex;
}

.modal-box {
    background: #111827;
    padding: 20px;
    border-radius: 12px;
    color: white;
}
</style>

</head>

<body>

<header>
  <div class="header-content">
    <a href="/" class="logo">
      <img src="/icon.png">
    </a>
  </div>
</header>

<div class="container">

  <div class="card">

    <h1>Paramètres</h1>

    <button class="btn btn-dark" onclick="openAction('username')">
      Modifier le pseudo
    </button>

    <br><br>

    <button class="btn btn-dark" onclick="openAction('email')">
      Modifier l'email
    </button>

    <br><br>

    <button class="btn btn-dark" onclick="openAction('password')">
      Modifier le mot de passe
    </button>

    <br><br>

    <button class="btn btn-dark" onclick="openProfileModal()">
      Modifier le profil
    </button>

    <br><br>

    <button class="btn btn-dark" onclick="window.location.href='/rizoplay'">
      RizoPlay
    </button>

  </div>

</div>

<!-- MODAL -->
<div id="profileModal" class="modal">
  <div class="modal-box">

    <h2>Modifier la photo</h2>

    <input type="file" id="fileInput" accept="image/*">

    <br><br>

    <button onclick="savePhoto()">Enregistrer</button>
    <button onclick="closeProfileModal()">Annuler</button>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  updateProfile,
  updateEmail,
  updatePassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🔥 MODIF TEXT */
window.openAction = async (type) => {

    const value = prompt("Nouvelle valeur :");
    if (!value) return;

    const user = auth.currentUser;
    if (!user) return alert("Non connecté");

    try {

        if (type === "username") {
            await updateProfile(user, { displayName: value });
        }

        if (type === "email") {
            await updateEmail(user, value);
        }

        if (type === "password") {
            await updatePassword(user, value);
        }

        await setDoc(doc(db, "users", user.uid), {
            displayName: user.displayName,
            email: user.email
        }, { merge: true });

        alert("Mis à jour");

    } catch (e) {
        alert(e.message);
    }
};

/* 🔥 MODAL */
window.openProfileModal = () => {
    document.getElementById("profileModal").classList.add("show");
};

window.closeProfileModal = () => {
    document.getElementById("profileModal").classList.remove("show");
};

/* 🔥 PHOTO */
window.savePhoto = async () => {

    const file = document.getElementById("fileInput").files[0];
    if (!file) return;

    const user = auth.currentUser;
    if (!user) return;

    const reader = new FileReader();

    reader.onload = async () => {

        const img = new Image();
        img.src = reader.result;

        img.onload = async () => {

            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            canvas.width = 300;
            canvas.height = 300;

            ctx.fillStyle = "#000";
            ctx.fillRect(0,0,300,300);

            ctx.drawImage(img, 0, 0, 300, 300);

            const base64 = canvas.toDataURL("image/jpeg", 0.8);

            try {

                await updateProfile(user, {
                    photoURL: "custom"
                });

                await setDoc(doc(db, "users", user.uid), {
                    photoURL: base64
                }, { merge: true });

                alert("Photo mise à jour");
                closeProfileModal();

            } catch (e) {
                alert(e.message);
            }
        };
    };

    reader.readAsDataURL(file);
};
</script>

</body>
</html>
