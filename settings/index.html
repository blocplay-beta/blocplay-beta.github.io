<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paramètres - BlocPlay</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.ico">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0f1a">

<style>
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
}

.modal.show {
    display: flex;
}

.modal-box {
    background: #111827;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}
</style>

</head>

<body>

<header>
  <div class="header-content">

    <a href="/" class="logo">
      <img src="/icon.png">
    </a>

    <div class="profile-menu">
      <img src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
           class="avatar" id="avatar">

      <div class="dropdown" id="dropdown"></div>
    </div>

  </div>
</header>

<div class="container">

  <div class="card">

    <h1>Paramètres</h1>

    <!-- 🔥 NOUVEAU -->
    <button class="btn btn-dark" onclick="openProfileModal()">
      Modifier le profil
    </button>

    <br><br>

    <button class="btn btn-dark" onclick="openModal('username')">
      Modifier le pseudo
    </button>

    <br><br>

    <button class="btn btn-dark" onclick="openModal('email')">
      Modifier l'email
    </button>

    <br><br>

    <button class="btn btn-dark" onclick="openModal('password')">
      Modifier le mot de passe
    </button>

    <br><br>

    <button id="discordBtn" class="btn btn-dark">
      Lier Discord
    </button>

    <br><br>

    <button class="btn btn-dark" onclick="window.location.href='/rizoplay'">
      RizoPlay
    </button>

  </div>

</div>

<!-- 🔥 MODAL PROFIL -->
<div id="profileModal" class="modal">
  <div class="modal-box">
    <h2>Modifier la photo</h2>

    <input type="file" id="fileInput" accept="image/*">

    <br><br>

    <button class="btn" onclick="saveProfilePic()">Enregistrer</button>
    <button class="btn btn-dark" onclick="closeProfileModal()">Annuler</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, updateProfile } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* MENU */
const avatar = document.getElementById("avatar");
const dropdown = document.getElementById("dropdown");

function renderMenu(user) {
    if (user) {
        dropdown.innerHTML = `
            <a href="/profile">Profil</a>
            <a href="/settings">Paramètres</a>
            <a href="#" id="logout">Se déconnecter</a>
        `;
    }
}

onAuthStateChanged(auth, (user) => {
    renderMenu(user);
});

/* MENU UI */
avatar.addEventListener("click", (e) => {
    e.stopPropagation();
    dropdown.classList.toggle("show");
});

document.addEventListener("click", () => {
    dropdown.classList.remove("show");
});

/* LOGOUT */
document.addEventListener("click", async (e) => {
    if (e.target.id === "logout") {
        await signOut(auth);
    }
});

/* 🔥 MODAL */
window.openProfileModal = () => {
    document.getElementById("profileModal").classList.add("show");
};

window.closeProfileModal = () => {
    document.getElementById("profileModal").classList.remove("show");
};

/* 🔥 UPLOAD PHOTO */
window.saveProfilePic = async () => {

    const file = document.getElementById("fileInput").files[0];
    if (!file) return alert("Choisis une image");

    const user = auth.currentUser;
    if (!user) return;

    // ⚠️ version simple (base64)
    const reader = new FileReader();

    reader.onload = async function () {
        const base64 = reader.result;

        await updateProfile(user, {
            photoURL: base64
        });

        alert("Photo mise à jour !");
        closeProfileModal();
        location.reload();
    };

    reader.readAsDataURL(file);
};
</script>

</body>
</html>
