<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paramètres - BlocPlay</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.ico">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0f1a">

<style>

/* MODAL */
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
}

.modal.show {
    display: flex;
}

.modal-content {
    background: #111827;
    padding: 25px;
    border-radius: 15px;
    width: 300px;
}

.modal input {
    width: 100%;
    margin: 8px 0;
    padding: 10px;
    border-radius: 8px;
    border: none;
}

</style>

</head>

<body>

<header>
  <div class="header-content">

    <a href="/" class="logo">
      <img src="/icon.png">
    </a>

    <div class="profile-menu">
      <img src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
           class="avatar" id="avatar">

      <div class="dropdown" id="dropdown"></div>
    </div>

  </div>
</header>

<div class="container">

  <div class="card">

    <h1>Paramètres</h1>

    <button class="btn btn-dark" onclick="openModal('username')">
      Modifier le pseudo
    </button>

    <br><br>

    <button class="btn btn-dark" onclick="openModal('email')">
      Modifier l'email
    </button>

    <br><br>

    <button class="btn btn-dark" onclick="openModal('password')">
      Modifier le mot de passe
    </button>

    <br><br>

    <button class="btn btn-dark" onclick="window.location.href='https://discord.com/api/oauth2/authorize?client_id=1471824801088802879&response_type=token&redirect_uri=https%3A%2F%2Fblocplay-beta.github.io%2Fsettings&scope=identify'">
      Lier Discord
    </button>

  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3 id="modalTitle"></h3>

    <input type="text" id="inputField" placeholder="">
    <input type="password" id="currentPassword" placeholder="Mot de passe actuel">

    <button class="btn btn-gradient" onclick="confirmAction()">Valider</button>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth, 
  onAuthStateChanged, 
  updateProfile, 
  updateEmail, 
  updatePassword,
  EmailAuthProvider,
  reauthenticateWithCredential,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* CONFIG FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
  storageBucket: "blocplay-a9417.firebasestorage.app",
  messagingSenderId: "540161549188",
  appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let currentUser;
let currentAction = "";

/* MENU PROFIL */
const avatar = document.getElementById("avatar");
const dropdown = document.getElementById("dropdown");

function renderMenu(user) {
    if (user) {
        dropdown.innerHTML = `
            <a href="/profile">Profil</a>
            <a href="/settings">Paramètres</a>
            <a href="#" id="logout">Se déconnecter</a>
        `;
    } else {
        dropdown.innerHTML = `
            <a href="/login">Se connecter</a>
            <a href="/signup">Créer un compte</a>
        `;
    }
}

/* AUTH */
onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "/login";
        return;
    }

    currentUser = user;
    renderMenu(user);
});

/* MENU OUVERTURE */
avatar.addEventListener("click", (e) => {
    e.stopPropagation();
    dropdown.classList.toggle("show");
});

/* MENU FERMETURE */
document.addEventListener("click", () => {
    dropdown.classList.remove("show");
});

/* LOGOUT */
document.addEventListener("click", async (e) => {
    if (e.target.id === "logout") {
        await signOut(auth);
    }
});

/* MODAL */
window.openModal = function(action) {
    currentAction = action;

    const modal = document.getElementById("modal");
    const title = document.getElementById("modalTitle");
    const input = document.getElementById("inputField");

    modal.classList.add("show");

    if (action === "username") {
        title.textContent = "Changer le pseudo";
        input.type = "text";
        input.placeholder = "Nouveau pseudo";
    }

    if (action === "email") {
        title.textContent = "Changer l'email";
        input.type = "email";
        input.placeholder = "Nouvel email";
    }

    if (action === "password") {
        title.textContent = "Changer le mot de passe";
        input.type = "password";
        input.placeholder = "Nouveau mot de passe";
    }
};

/* FERMER MODAL */
document.getElementById("modal").addEventListener("click", () => {
    document.getElementById("modal").classList.remove("show");
});

/* REAUTH */
async function reAuth(password) {
    const credential = EmailAuthProvider.credential(
        currentUser.email,
        password
    );

    await reauthenticateWithCredential(currentUser, credential);
}

/* CONFIRM ACTION */
window.confirmAction = async function() {
    const value = document.getElementById("inputField").value;
    const password = document.getElementById("currentPassword").value;

    try {
        await reAuth(password);

        if (currentAction === "username") {
            await updateProfile(currentUser, { displayName: value });
            alert("Pseudo modifié !");
        }

        if (currentAction === "email") {
            await updateEmail(currentUser, value);
            alert("Email modifié !");
        }

        if (currentAction === "password") {
            await updatePassword(currentUser, value);
            alert("Mot de passe modifié !");
        }

        document.getElementById("modal").classList.remove("show");

    } catch (err) {
        alert(err.message);
    }
};
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js");
}
</script>

<script>
const hash = window.location.hash.substring(1);

const params = new URLSearchParams(hash);

const token = params.get("access_token");

console.log("Token :", token);

if (token) {
  fetch("https://discord.com/api/users/@me", {
    headers: {
      Authorization: `Bearer ${token}`
    }
  })
  .then(res => res.json())
  .then(user => {

    console.log("User :", user);

    localStorage.setItem("discordUser", JSON.stringify({
      id: user.id,
      username: user.username,
      avatar: `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
    }));

    alert("Discord lié !");
    window.location.href = "/profile";
  })
  .catch(err => {
    console.error(err);
    alert("Erreur API Discord");
  });

} else {
  console.log("Aucun token trouvé dans le hash");
}
</script>

</body>
</html>
