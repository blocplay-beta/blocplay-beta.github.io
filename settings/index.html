<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paramètres - BlocPlay</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.ico">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0f1a">

<style>

.profile-btn {
    position: fixed;
    top: 15px;
    right: 15px;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #222;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 18px;
    z-index: 1000;
}

.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
}

.modal.show {
    display: flex;
}

.modal-content {
    background: #111827;
    padding: 25px;
    border-radius: 15px;
    width: 300px;
}

.modal input {
    width: 100%;
    margin: 8px 0;
    padding: 10px;
    border-radius: 8px;
    border: none;
}

</style>

</head>

<body>

<!-- 👤 PROFIL (CORRIGÉ) -->
<button class="profile-btn" id="profileBtn">👤</button>

<header>
  <div class="header-content">
    <a href="/" class="logo">
      <img src="/icon.png">
    </a>
  </div>
</header>

<div class="container">

  <div class="card">

    <h1>Paramètres</h1>

    <button class="btn btn-dark" onclick="openModal('username')">
      Modifier le pseudo
    </button>

    <br><br>

    <button class="btn btn-dark" onclick="openModal('email')">
      Modifier l'email
    </button>

    <br><br>

    <button class="btn btn-dark" onclick="openModal('password')">
      Modifier le mot de passe
    </button>

    <br><br>

    <button id="discordBtn" class="btn btn-dark">
      Lier Discord
    </button>

    <br><br>

    <!-- 🟠 RIZOPLAY (REMIS) -->
    <button class="btn btn-dark" onclick="window.location.href='/rizoplay'">
      RizoPlay
    </button>

  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3 id="modalTitle"></h3>

    <input type="text" id="inputField">
    <input type="password" id="currentPassword" placeholder="Mot de passe actuel">

    <button class="btn btn-gradient" onclick="confirmAction()">Valider</button>

  </div>
</div>

<script>
/* PROFIL */
document.getElementById("profileBtn").addEventListener("click", () => {
  alert("Menu profil (à personnaliser)");
});

/* MODAL */
let currentAction = "";

window.openModal = function(action) {
    currentAction = action;
    document.getElementById("modal").classList.add("show");
};

document.getElementById("modal").onclick = () => {
    document.getElementById("modal").classList.remove("show");
};

window.confirmAction = async function() {
    alert("Action exécutée");
};
</script>

</body>
</html>
