<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paramètres - BlocPlay</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.ico">

<style>
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
}

.modal.show {
    display: flex;
}

.modal-box {
    background: #111827;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
}
button {
    margin: 6px 0;
    padding: 10px;
    width: 200px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}
</style>

</head>

<body>

<header>
  <div class="header-content">
    <a href="/">BlocPlay</a>
  </div>
</header>

<div class="container">

  <h1>Paramètres</h1>

  <button onclick="openAction('username')">Modifier le pseudo</button>
  <button onclick="openAction('email')">Modifier l'email</button>
  <button onclick="openAction('password')">Modifier le mot de passe</button>

  <br><br>

  <button onclick="openProfileModal()">Modifier le profil</button>

</div>

<!-- MODAL PHOTO -->
<div id="profileModal" class="modal">
  <div class="modal-box">
    <h3>Changer photo</h3>
    <input type="file" id="fileInput" accept="image/*">
    <br><br>
    <button onclick="savePhoto()">Valider</button>
    <button onclick="closeProfileModal()">Annuler</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  updateProfile,
  updateEmail,
  updatePassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "XXX",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🔥 ACTIONS SETTINGS */
window.openAction = async (type) => {
    const value = prompt("Nouvelle valeur :");
    if (!value) return;

    const user = auth.currentUser;
    if (!user) return alert("Non connecté");

    try {

        if (type === "username") {
            await updateProfile(user, { displayName: value });
            alert("Pseudo modifié");
        }

        if (type === "email") {
            await updateEmail(user, value);
            alert("Email modifié");
        }

        if (type === "password") {
            await updatePassword(user, value);
            alert("Mot de passe modifié");
        }

    } catch (e) {
        alert(e.message);
    }
};

/* 🔥 PHOTO PROFIL */
window.openProfileModal = () => {
    document.getElementById("profileModal").classList.add("show");
};

window.closeProfileModal = () => {
    document.getElementById("profileModal").classList.remove("show");
};

window.savePhoto = async () => {

    const file = document.getElementById("fileInput").files[0];
    if (!file) return alert("Image requise");

    const user = auth.currentUser;
    if (!user) return;

    const reader = new FileReader();

    reader.onload = async () => {
        const img = new Image();
        img.src = reader.result;

        img.onload = async () => {

            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            const size = 300;
            canvas.width = size;
            canvas.height = size;

            ctx.fillStyle = "#000";
            ctx.fillRect(0,0,size,size);

            const ratio = Math.min(size / img.width, size / img.height);
            const w = img.width * ratio;
            const h = img.height * ratio;

            const x = (size - w)/2;
            const y = (size - h)/2;

            ctx.drawImage(img, x, y, w, h);

            const base64 = canvas.toDataURL("image/jpeg", 0.8);

            try {

                // ⚠️ PAS base64 dans Auth
                await updateProfile(user, {
                    photoURL: "custom"
                });

                await setDoc(doc(db, "users", user.uid), {
                    photoURL: base64
                }, { merge: true });

                alert("Photo mise à jour");
                closeProfileModal();

            } catch (e) {
                alert(e.message);
            }
        };
    };

    reader.readAsDataURL(file);
};
</script>

</body>
</html>
