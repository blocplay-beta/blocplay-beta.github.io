<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paramètres - BlocPlay</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.ico">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0f1a">

<style>
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
}

.modal.show {
    display: flex;
}
</style>

</head>

<body>

<header>
  <div class="header-content">

    <a href="/" class="logo">
      <img src="/icon.png">
    </a>

    <div class="profile-menu">
      <img src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
           class="avatar" id="avatar">

      <div class="dropdown" id="dropdown"></div>
    </div>

  </div>
</header>

<div class="container">

  <div class="card">

    <h1>Paramètres</h1>

    <button class="btn btn-dark" onclick="openModal('username')">
      Modifier le pseudo
    </button>

    <br><br>

    <button class="btn btn-dark" onclick="openModal('email')">
      Modifier l'email
    </button>

    <br><br>

    <button class="btn btn-dark" onclick="openModal('password')">
      Modifier le mot de passe
    </button>

    <br><br>

    <!-- 🔥 AJOUT -->
    <button class="btn btn-dark" onclick="openProfileModal()">
      Modifier le profil
    </button>

    <br><br>

    <button id="discordBtn" class="btn btn-dark">
      Lier Discord  
    </button>

    <br><br>

    <button class="btn btn-dark" onclick="window.location.href='/rizoplay'">
      RizoPlay
    </button>

  </div>

</div>

<!-- 🔥 AJOUT MODAL PROFIL -->
<div id="profileModal" class="modal">
  <div class="modal-box" style="background:#111;padding:20px;border-radius:10px;color:white;">
    <h2>Modifier la photo</h2>

    <input type="file" id="fileInput" accept="image/*">

    <br><br>

    <button onclick="saveProfilePic()">Enregistrer</button>
    <button onclick="closeProfileModal()">Annuler</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, updateProfile } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
  storageBucket: "blocplay-a9417.firebasestorage.app",
  messagingSenderId: "540161549188",
  appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* MENU */
const avatar = document.getElementById("avatar");
const dropdown = document.getElementById("dropdown");

function renderMenu(user) {
    if (user) {
        dropdown.innerHTML = `
            <a href="/profile">Profil</a>
            <a href="/settings">Paramètres</a>
            <a href="#" id="logout">Se déconnecter</a>
        `;
    } else {
        dropdown.innerHTML = `
            <a href="/login">Se connecter</a>
            <a href="/signup">Créer un compte</a>
        `;
    }
}

onAuthStateChanged(auth, (user) => {
    renderMenu(user);
});

/* MENU CLICK */
avatar.addEventListener("click", (e) => {
    e.stopPropagation();
    dropdown.classList.toggle("show");
});

document.addEventListener("click", () => {
    dropdown.classList.remove("show");
});

/* LOGOUT */
document.addEventListener("click", async (e) => {
    if (e.target.id === "logout") {
        await signOut(auth);
    }
});

/* ====== 🔥 AJOUT PROFIL ====== */

window.openProfileModal = () => {
    document.getElementById("profileModal").classList.add("show");
};

window.closeProfileModal = () => {
    document.getElementById("profileModal").classList.remove("show");
};

window.saveProfilePic = async () => {

    const file = document.getElementById("fileInput").files[0];
    if (!file) return alert("Aucune image");

    const user = auth.currentUser;
    if (!user) return;

    const reader = new FileReader();

    reader.onload = async () => {

        const img = new Image();
        img.src = reader.result;

        img.onload = async () => {

            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            canvas.width = 300;
            canvas.height = 300;

            ctx.drawImage(img, 0, 0, 300, 300);

            const base64 = canvas.toDataURL("image/jpeg", 0.8);

            await updateProfile(user, {
                photoURL: "custom"
            });

            await setDoc(doc(db, "users", user.uid), {
                photoURL: base64
            }, { merge: true });

            alert("Photo mise à jour");
            closeProfileModal();
        };
    };

    reader.readAsDataURL(file);
};
</script>

</body>
</html>
