<!DOCTYPE html>
<html lang="fr">
<head>

<script>
  // Récupère la langue du navigateur (gère la compatibilité)
  const userLang = navigator.language || navigator.userLanguage;
  
  // Extrait les deux premiers caractères (ex: "fr-FR" devient "fr")
  const shortLang = userLang.substring(0, 2).toLowerCase();

  // Redirection selon la langue
  if (shortLang === 'fr') {
    window.location.href = 'https://discord.gg/QfreSq3t7E';
  } else {
    // Redirige vers /en par défaut pour toutes les autres langues
    window.location.href = 'https://discord.gg/QfreSq3t7E';
  }
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discord - BlocPlay</title>

<link rel="icon" type="image/png" href="/img/icon.png">

</head>
