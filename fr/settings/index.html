<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paramètres</title>
  
  <!-- CSS DES POPUPS -->
  <style>
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.78);
      align-items: center;
      justify-content: center;
      z-index: 2000;
      box-sizing: border-box;
    }

    .modal.show {
      display: flex !important;
    }

    .modal-box {
      background: #122a4a;
      padding: 25px;
      border-radius: 12px;
      width: min(400px, calc(100% - 40px));
      box-shadow: 0 10px 35px rgba(0,0,0,0.45);
      color: white;
      box-sizing: border-box;
    }

    .modal-box h2 {
      margin-top: 0;
      color: white;
    }

    .modal-box input {
      width: 100%;
      padding: 10px;
      background: #0b1b3a;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: white;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- BOUTONS -->
  <button class="btn btn-settings" onclick="openProfileModal()">Modifier le profil</button>
  <br><br>
  <button class="btn btn-settings" onclick="openUsernameModal()">Modifier le pseudo</button>
  <br><br>
  <button class="btn btn-settings" onclick="openEmailModal()">Modifier l'email</button>
  <br><br>
  <button class="btn btn-settings" onclick="openPasswordModal()">Modifier le mot de passe</button>

  <!-- MODALE PROFIL -->
  <div id="profileModal" class="modal">
    <div class="modal-box">
      <h2>Modifier la photo</h2>
      <input type="file" id="fileInput" accept="image/*">
      <br><br>
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button class="btn btn-dark" onclick="closeProfileModal()">Annuler</button>
        <button class="btn btn-gradient" onclick="saveProfilePic()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- MODALE PSEUDO -->
  <div id="usernameModal" class="modal">
    <div class="modal-box">
      <h2>Modifier le pseudo</h2>
      <input type="text" id="newUsername" placeholder="Nouveau pseudo">
      <br><br>
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button class="btn btn-dark" onclick="closeUsernameModal()">Annuler</button>
        <button class="btn btn-gradient" onclick="saveUsername()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- MODALE EMAIL -->
  <div id="emailModal" class="modal">
    <div class="modal-box">
      <h2>Modifier l'email</h2>
      <input type="email" id="newEmail" placeholder="Nouvel email">
      <br><br>
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button class="btn btn-dark" onclick="closeEmailModal()">Annuler</button>
        <button class="btn btn-gradient" onclick="saveEmail()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- MODALE MOT DE PASSE -->
  <div id="passwordModal" class="modal">
    <div class="modal-box">
      <h2>Modifier le mot de passe</h2>
      <input type="password" id="newPassword" placeholder="Nouveau mot de passe">
      <br><br>
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button class="btn btn-dark" onclick="closePasswordModal()">Annuler</button>
        <button class="btn btn-gradient" onclick="savePassword()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    function openProfileModal() { document.getElementById('profileModal').classList.add('show'); }
    function closeProfileModal() { document.getElementById('profileModal').classList.remove('show'); }

    function openUsernameModal() { document.getElementById('usernameModal').classList.add('show'); }
    function closeUsernameModal() { document.getElementById('usernameModal').classList.remove('show'); }

    function openEmailModal() { document.getElementById('emailModal').classList.add('show'); }
    function closeEmailModal() { document.getElementById('emailModal').classList.remove('show'); }

    function openPasswordModal() { document.getElementById('passwordModal').classList.add('show'); }
    function closePasswordModal() { document.getElementById('passwordModal').classList.remove('show'); }
  </script>

</body>
</html>
