<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Créer un compte - BlocPlay</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.ico">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0f1a">


<style>

/* ========================= */
/* PAGE INSCRIPTION */
/* ========================= */

.signup-container {

    min-height: calc(100vh - 160px);

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 30px 15px;

    box-sizing: border-box;

}


/* ========================= */
/* CARTE */
/* ========================= */

.signup-card {

    width: 100%;

    max-width: 430px;

    box-sizing: border-box;

    overflow: hidden;

    text-align: center;

    padding: 30px;

    border-radius: 16px;

    background: rgba(255,255,255,0.04);

    border: 1px solid rgba(255,255,255,0.08);

    box-shadow:
        0 15px 40px rgba(0,0,0,0.25);

}


/* ========================= */
/* LOGO */
/* ========================= */

.signup-logo {

    width: 90px;

    height: 90px;

    object-fit: contain;

    margin-bottom: 15px;

}


/* ========================= */
/* TITRE */
/* ========================= */

.signup-card h1 {

    margin: 0 0 10px 0;

}


.signup-description {

    margin: 0 0 25px 0;

    opacity: 0.7;

    font-size: 14px;

}


/* ========================= */
/* CHAMPS */
/* ========================= */

.signup-field {

    width: 100%;

    max-width: 100%;

    box-sizing: border-box;

    margin-bottom: 16px;

    text-align: left;

}


.signup-field label {

    display: block;

    margin-bottom: 7px;

    font-size: 14px;

    font-weight: 600;

}


.signup-field input {

    display: block;

    width: 100%;

    max-width: 100%;

    min-width: 0;

    box-sizing: border-box;

    padding: 12px 14px;

    border-radius: 9px;

    border: 1px solid rgba(255,255,255,0.12);

    outline: none;

    background: #111827;

    color: white;

    font-size: 15px;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;

}


.signup-field input:focus {

    border-color: #5865f2;

    box-shadow:
        0 0 0 3px rgba(88,101,242,0.15);

    transform: scale(1.015);

}


.signup-field input::placeholder {

    color: #7f8ca1;

}


/* ========================= */
/* BOUTON */
/* ========================= */

.signup-button {

    width: 100%;

    box-sizing: border-box;

    border: none;

    border-radius: 9px;

    padding: 13px 18px;

    margin-top: 5px;

    background: linear-gradient(
        135deg,
        #5865f2,
        #7289da
    );

    color: white;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition:
        opacity 0.2s ease,
        transform 0.2s ease;

}


.signup-button:hover {

    opacity: 0.9;

}


.signup-button:active {

    transform: scale(0.98);

}


.signup-button:disabled {

    opacity: 0.6;

    cursor: default;

    transform: none;

}


/* ========================= */
/* STATUT */
/* ========================= */

#status {

    min-height: 20px;

    margin-top: 15px;

    font-size: 14px;

}


#status-txt {

    opacity: 0.75;

    font-size: 13px;

    min-height: 18px;

}


#color-status {

    display: none;

}


/* ========================= */
/* CONNEXION */
/* ========================= */

.signup-login {

    margin-top: 22px;

    font-size: 14px;

    opacity: 0.8;

}


.signup-login a {

    color: #7289da;

    text-decoration: none;

    font-weight: 600;

}


.signup-login a:hover {

    text-decoration: underline;

}


/* ========================= */
/* FOOTER */
/* ========================= */

.signup-footer {

    text-align: center;

    padding: 20px;

    color: #7f8ca1;

    font-size: 13px;

}

</style>

</head>


<body>


<!-- ========================= -->
<!-- HEADER -->
<!-- ========================= -->

<header>

    <div class="header-content">

        <a href="/" class="logo">

            <img
                src="/icon.png"
                alt="BlocPlay"
            >

        </a>


        <div class="header-actions">

            <button
                id="searchBtn"
                class="header-button"
                aria-label="Rechercher"
            >
                🔍
            </button>


            <div class="profile-menu">

                <img
                    src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
                    class="avatar"
                    id="avatar"
                    alt="Profil"
                >


                <div
                    class="dropdown"
                    id="dropdown"
                ></div>

            </div>

        </div>

    </div>

</header>


<!-- ========================= -->
<!-- RECHERCHE -->
<!-- ========================= -->

<div
    id="searchOverlay"
    class="search-overlay"
>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Rechercher sur BlocPlay..."
            autocomplete="off"
        >


        <button
            id="closeSearch"
            class="search-close"
        >
            ✕
        </button>

    </div>


    <div
        id="searchResults"
        class="search-results"
    ></div>

</div>


<!-- ========================= -->
<!-- INSCRIPTION -->
<!-- ========================= -->

<main class="signup-container">

    <div class="signup-card">

        <img
            src="/icon.png"
            class="signup-logo"
            alt="BlocPlay"
        >


        <h1>
            Créer un compte
        </h1>


        <p class="signup-description">
            Rejoins BlocPlay et profite de la plateforme.
        </p>


        <!-- ========================= -->
        <!-- NOM D'UTILISATEUR -->
        <!-- ========================= -->

        <div class="signup-field">

            <label for="username">
                Nom d'utilisateur
            </label>

            <input
                type="text"
                id="username"
                placeholder="Ton nom d'utilisateur"
                autocomplete="username"
                maxlength="30"
            >

        </div>


        <!-- ========================= -->
        <!-- EMAIL -->
        <!-- ========================= -->

        <div class="signup-field">

            <label for="email">
                Adresse e-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="ton@email.com"
                autocomplete="email"
            >

        </div>


        <!-- ========================= -->
        <!-- MOT DE PASSE -->
        <!-- ========================= -->

        <div class="signup-field">

            <label for="password">
                Mot de passe
            </label>

            <input
                type="password"
                id="password"
                placeholder="Ton mot de passe"
                autocomplete="new-password"
            >

        </div>


        <!-- ========================= -->
        <!-- CONFIRMATION -->
        <!-- ========================= -->

        <div class="signup-field">

            <label for="passwordConfirm">
                Confirmer le mot de passe
            </label>

            <input
                type="password"
                id="passwordConfirm"
                placeholder="Confirme ton mot de passe"
                autocomplete="new-password"
            >

        </div>


        <!-- ========================= -->
        <!-- BOUTON -->
        <!-- ========================= -->

        <button
            id="signupButton"
            class="signup-button"
            type="button"
        >
            Créer mon compte
        </button>


        <!-- ========================= -->
        <!-- STATUT -->
        <!-- ========================= -->

        <div id="status"></div>

        <div id="status-txt"></div>

        <div id="color-status"></div>


        <!-- ========================= -->
        <!-- CONNEXION -->
        <!-- ========================= -->

        <div class="signup-login">

            Déjà un compte ?

            <a href="/login">
                Se connecter
            </a>

        </div>

    </div>

</main>


<!-- ========================= -->
<!-- FOOTER -->
<!-- ========================= -->

<footer class="signup-footer">

    © BlocPlay Studios™

</footer>


<!-- ========================= -->
<!-- FIREBASE -->
<!-- ========================= -->

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut,
    createUserWithEmailAndPassword,
    updateProfile
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ========================= */
/* FIREBASE */
/* ========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwEtMmEtUkn04",

    authDomain:
        "blocplay-a9417.firebaseapp.com",

    projectId:
        "blocplay-a9417"

};


const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(
        app
    );


const db =
    getFirestore(
        app
    );


/* ========================= */
/* ELEMENTS */
/* ========================= */

const avatar =
    document.getElementById(
        "avatar"
    );


const dropdown =
    document.getElementById(
        "dropdown"
    );


const usernameInput =
    document.getElementById(
        "username"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const passwordConfirmInput =
    document.getElementById(
        "passwordConfirm"
    );


const signupButton =
    document.getElementById(
        "signupButton"
    );


const status =
    document.getElementById(
        "status"
    );


const statusTxt =
    document.getElementById(
        "status-txt"
    );


/* ========================= */
/* MENU PROFIL */
/* ========================= */

async function renderMenu(
    user
) {

    if (user) {

        dropdown.innerHTML = `

            <a href="/profile">
                Profil
            </a>

            <a href="/settings">
                Paramètres
            </a>

            <a href="/rizoplay">
                RizoPlay
            </a>

            <a href="#" id="logout">
                Se déconnecter
            </a>

        `;


        const name =
            user.displayName ||
            user.email?.split("@")[0] ||
            "User";


        let photoURL = "";


        try {

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if (
                userSnap.exists()
            ) {

                const data =
                    userSnap.data();


                photoURL =
                    data.photoURL ||
                    data.avatar ||
                    "";

            }

        } catch (error) {

            console.error(
                "Erreur chargement photo Firestore :",
                error
            );

        }


        if (!photoURL) {

            photoURL =
                user.photoURL ||
                "";

        }


        if (photoURL) {

            avatar.src =
                photoURL;

        } else {

            avatar.src =
                "https://ui-avatars.com/api/?name=" +
                encodeURIComponent(name) +
                "&background=111&color=fff&rounded=true&size=64";

        }

    } else {

        dropdown.innerHTML = `

            <a href="/login">
                Se connecter
            </a>

            <a href="/signup">
                Créer un compte
            </a>

        `;


        avatar.src =
            "https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64";

    }

}


/* ========================= */
/* AUTH DU MENU */
/* ========================= */

onAuthStateChanged(
    auth,
    (user) => {

        renderMenu(
            user
        );

    }
);


/* ========================= */
/* OUVERTURE MENU */
/* ========================= */

avatar.addEventListener(
    "click",
    (event) => {

        event.stopPropagation();

        dropdown.classList.toggle(
            "show"
        );

    }
);


/* ========================= */
/* FERMETURE MENU */
/* ========================= */

document.addEventListener(
    "click",
    () => {

        dropdown.classList.remove(
            "show"
        );

    }
);


/* ========================= */
/* DÉCONNEXION */
/* ========================= */

document.addEventListener(
    "click",
    async (event) => {

        if (
            event.target.id ===
            "logout"
        ) {

            event.preventDefault();

            await signOut(
                auth
            );

            window.location.reload();

        }

    }
);


/* ========================= */
/* INSCRIPTION */
/* ========================= */

signupButton.addEventListener(
    "click",
    async () => {

        const username =
            usernameInput.value.trim();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        const passwordConfirm =
            passwordConfirmInput.value;


        /* ========================= */
        /* RESET STATUT */
        /* ========================= */

        status.textContent =
            "";


        statusTxt.textContent =
            "";


        /* ========================= */
        /* VALIDATION NOM */
        /* ========================= */

        if (!username) {

            status.textContent =
                "Veuillez entrer un nom d'utilisateur.";

            return;

        }


        if (username.length < 3) {

            status.textContent =
                "Le nom d'utilisateur doit contenir au moins 3 caractères.";

            return;

        }


        /* ========================= */
        /* VALIDATION EMAIL */
        /* ========================= */

        if (!email) {

            status.textContent =
                "Veuillez entrer une adresse e-mail.";

            return;

        }


        /* ========================= */
        /* VALIDATION MOT DE PASSE */
        /* ========================= */

        if (!password) {

            status.textContent =
                "Veuillez entrer un mot de passe.";

            return;

        }


        if (password.length < 6) {

            status.textContent =
                "Le mot de passe doit contenir au moins 6 caractères.";

            return;

        }


        if (
            password !==
            passwordConfirm
        ) {

            status.textContent =
                "Les mots de passe ne correspondent pas.";

            return;

        }


        /* ========================= */
        /* CHARGEMENT */
        /* ========================= */

        signupButton.disabled =
            true;


        signupButton.textContent =
            "Création du compte...";


        status.textContent =
            "";


        statusTxt.textContent =
            "Veuillez patienter...";


        try {

            /* ========================= */
            /* CRÉER LE COMPTE FIREBASE */
            /* ========================= */

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;


            /* ========================= */
            /* NOM FIREBASE AUTH */
            /* ========================= */

            await updateProfile(
                user,
                {
                    displayName:
                        username
                }
            );


            /* ========================= */
            /* PROFIL FIRESTORE */
            /* ========================= */

            await setDoc(
                doc(
                    db,
                    "users",
                    user.uid
                ),
                {

                    id:
                        Math.floor(
                            Math.random() *
                            100000000
                        ),

                    displayName:
                        username,

                    username:
                        username,

                    email:
                        email,

                    photoURL:
                        "",

                    rizoplay:
                        false,

                    friendsCount:
                        0,

                    role:
                        "user",

                    banned:
                        false,

                    createdAt:
                        serverTimestamp()

                }
            );


            /* ========================= */
            /* SUCCÈS */
            /* ========================= */

            status.textContent =
                "Compte créé avec succès !";


            statusTxt.textContent =
                "Redirection vers votre profil...";


            signupButton.textContent =
                "Compte créé";


            setTimeout(
                () => {

                    window.location.href =
                        "/profile";

                },
                800
            );

        } catch (error) {

            console.error(
                "Erreur inscription Firebase :",
                error
            );


            /* ========================= */
            /* MESSAGES FIREBASE */
            /* ========================= */

            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                status.textContent =
                    "Cette adresse e-mail est déjà utilisée.";

            } else if (
                error.code ===
                "auth/invalid-email"
            ) {

                status.textContent =
                    "Cette adresse e-mail n'est pas valide.";

            } else if (
                error.code ===
                "auth/weak-password"
            ) {

                status.textContent =
                    "Le mot de passe est trop faible.";

            } else if (
                error.code ===
                "auth/operation-not-allowed"
            ) {

                status.textContent =
                    "La création de comptes par e-mail n'est pas activée dans Firebase.";

            } else if (
                error.code ===
                "auth/api-key-not-valid"
            ) {

                status.textContent =
                    "Erreur de configuration Firebase : clé API invalide.";

            } else {

                status.textContent =
                    "Impossible de créer le compte.";

            }


            statusTxt.textContent =
                "";


            signupButton.disabled =
                false;


            signupButton.textContent =
                "Créer mon compte";

        }

    }
);

</script>


<!-- ========================= -->
<!-- RECHERCHE -->
<!-- ========================= -->

<script>

const searchBtn =
    document.getElementById(
        "searchBtn"
    );


const searchOverlay =
    document.getElementById(
        "searchOverlay"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const searchResults =
    document.getElementById(
        "searchResults"
    );


const closeSearch =
    document.getElementById(
        "closeSearch"
    );


searchBtn.addEventListener(
    "click",
    () => {

        searchOverlay.classList.add(
            "show"
        );

        searchInput.focus();

    }
);


closeSearch.addEventListener(
    "click",
    () => {

        searchOverlay.classList.remove(
            "show"
        );

        searchInput.value = "";

        searchResults.innerHTML = "";

    }
);


searchInput.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key !==
            "Enter"
        ) {

            return;

        }


        const query =
            searchInput.value.trim();


        if (!query) {

            return;

        }


        searchResults.innerHTML = `

            <div class="search-result">

                <h3>
                    Résultats de recherche
                </h3>

                <p>
                    Recherche pour :
                    <strong>
                        ${escapeHTML(query)}
                    </strong>
                </p>

            </div>

        `;

    }
);


function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


searchOverlay.addEventListener(
    "click",
    (event) => {

        if (
            event.target ===
            searchOverlay
        ) {

            searchOverlay.classList.remove(
                "show"
            );

            searchInput.value = "";

            searchResults.innerHTML = "";

        }

    }
);

</script>


<!-- ========================= -->
<!-- SERVICE WORKER -->
<!-- ========================= -->

<script>

if (
    "serviceWorker" in
    navigator
) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker.register(
                "/service-worker.js"
            );

        }
    );

}

</script>


</body>
</html>
