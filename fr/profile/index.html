<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil - BlocPlay</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.ico">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0f1a">


<style>

/* ========================= */
/* PROFIL */
/* ========================= */

.profile-container {
    position: relative;
    display: inline-block;
}


/* ========================= */
/* PHOTO PROFIL */
/* ========================= */

.profile-pic {
    width: 110px;
    height: 110px;

    border-radius: 50%;

    object-fit: cover;

    display: block;

    background: #111;

    border: 3px solid rgba(255,255,255,0.08);
}


/* ========================= */
/* BADGE RIZOPLAY */
/* ========================= */

.rizo-badge {
    position: absolute;

    top: 4px;
    right: 4px;

    width: 22px;
    height: 22px;

    border-radius: 50%;

    box-shadow:
        0 0 7px rgba(255,120,0,0.7);
}


/* ========================= */
/* PROFIL CARD */
/* ========================= */

.profile-card {
    text-align: center;
}


.profile-card h1 {
    margin-bottom: 25px;
}


.profile-card h2 {
    margin-top: 15px;
    margin-bottom: 5px;
}


.profile-card p {
    margin-top: 0;

    opacity: 0.7;
}


/* ========================= */
/* ID BLOCPLAY */
/* ========================= */

.profile-id {
    margin-top: 10px;

    color: #7f8ca1;

    font-size: 13px;
}


/* ========================= */
/* DATE DE CRÉATION */
/* ========================= */

.profile-created {
    margin-top: 5px;

    color: #7f8ca1;

    font-size: 13px;
}


/* ========================= */
/* DEMANDE D'AMI */
/* ========================= */

.friend-request-container {
    margin-top: 20px;

    display: flex;

    justify-content: center;
}


.friend-request-button {
    border: none;

    border-radius: 8px;

    padding: 10px 18px;

    background: #5865f2;

    color: white;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    transition:
        opacity 0.2s ease,
        transform 0.2s ease;
}


.friend-request-button:hover {
    opacity: 0.9;
}


.friend-request-button:active {
    transform: scale(0.97);
}


.friend-request-button.cancel {
    background: #333b4d;
}


.friend-request-button:disabled {
    opacity: 0.6;

    cursor: default;

    transform: none;
}


/* ========================= */
/* ERREUR */
/* ========================= */

.profile-error {
    text-align: center;

    padding: 25px;
}


.profile-error h1 {
    margin-bottom: 10px;
}


.profile-error p {
    opacity: 0.7;
}

</style>

</head>


<body>


<!-- ========================= -->
<!-- HEADER -->
<!-- ========================= -->

<header>

  <div class="header-content">

    <a href="/" class="logo">

      <img
        src="/icon.png"
        alt="BlocPlay"
      >

    </a>


    <div class="header-actions">

      <button
        id="searchBtn"
        class="header-button"
        aria-label="Rechercher"
      >
        🔍
      </button>


      <div class="profile-menu">

        <img
          src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
          class="avatar"
          id="avatar"
          alt="Profil"
        >


        <div
          class="dropdown"
          id="dropdown"
        ></div>

      </div>

    </div>

  </div>

</header>


<!-- ========================= -->
<!-- RECHERCHE -->
<!-- ========================= -->

<div
  id="searchOverlay"
  class="search-overlay"
>

  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="Rechercher sur BlocPlay..."
      autocomplete="off"
    >


    <button
      id="closeSearch"
      class="search-close"
    >
      ✕
    </button>

  </div>


  <div
    id="searchResults"
    class="search-results"
  ></div>

</div>


<!-- ========================= -->
<!-- CONTENU -->
<!-- ========================= -->

<div class="container">


  <div
    class="card profile-card"
    id="profileCard"
  >

    <h1 id="profileTitle">
      Mon profil
    </h1>


    <div class="profile-container">

      <img
        id="profilePic"
        class="profile-pic"
        src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=256"
        alt="Photo de profil"
      >


      <img
        src="/rizo-play.png"
        id="rizoBadge"
        class="rizo-badge"
        style="display:none;"
        alt="RizoPlay"
      >

    </div>


    <h2 id="username">
      Chargement...
    </h2>


    <p id="email"></p>


    <div
      id="profileId"
      class="profile-id"
    ></div>


    <div
      id="profileCreated"
      class="profile-created"
    ></div>


    <!-- ========================= -->
    <!-- BOUTON DEMANDE D'AMI -->
    <!-- ========================= -->

    <div
      id="friendRequestContainer"
      class="friend-request-container"
      style="display:none;"
    >

      <button
        id="friendRequestButton"
        class="friend-request-button"
        type="button"
      >
        Faire une demande d'ami
      </button>

    </div>

  </div>

</div>


<!-- ========================= -->
<!-- FIREBASE -->
<!-- ========================= -->

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    deleteDoc,
    collection,
    query,
    where,
    getDocs,
    limit,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ========================= */
/* FIREBASE */
/* ========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",

    authDomain:
        "blocplay-a9417.firebaseapp.com",

    projectId:
        "blocplay-a9417"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* ========================= */
/* ELEMENTS */
/* ========================= */

const avatar =
    document.getElementById(
        "avatar"
    );


const dropdown =
    document.getElementById(
        "dropdown"
    );


const profileTitle =
    document.getElementById(
        "profileTitle"
    );


const profilePic =
    document.getElementById(
        "profilePic"
    );


const username =
    document.getElementById(
        "username"
    );


const email =
    document.getElementById(
        "email"
    );


const profileId =
    document.getElementById(
        "profileId"
    );


const profileCreated =
    document.getElementById(
        "profileCreated"
    );


const rizoBadge =
    document.getElementById(
        "rizoBadge"
    );


const profileCard =
    document.getElementById(
        "profileCard"
    );


const friendRequestContainer =
    document.getElementById(
        "friendRequestContainer"
    );


const friendRequestButton =
    document.getElementById(
        "friendRequestButton"
    );


/* ========================= */
/* PROFIL ACTUEL */
/* ========================= */

let currentUser = null;

let viewedProfileUID = null;

let friendRequestState =
    "none";


/* ========================= */
/* MENU PROFIL */
/* ========================= */

async function renderMenu(user) {

    if (user) {

        dropdown.innerHTML = `

            <a href="/profile">
                Profil
            </a>

            <a href="/settings">
                Paramètres
            </a>

            <a href="/rizoplay">
                RizoPlay
            </a>

            <a href="#" id="logout">
                Se déconnecter
            </a>

        `;


        const name =
            user.displayName ||
            user.email?.split("@")[0] ||
            "User";


        let photoURL = "";


        try {

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if (
                userSnap.exists()
            ) {

                const data =
                    userSnap.data();


                photoURL =
                    data.photoURL ||
                    data.avatar ||
                    "";

            }

        } catch (error) {

            console.error(
                "Erreur chargement photo :",
                error
            );

        }


        if (!photoURL) {

            photoURL =
                user.photoURL ||
                "";

        }


        if (photoURL) {

            avatar.src =
                photoURL;

        } else {

            avatar.src =
                "https://ui-avatars.com/api/?name=" +
                encodeURIComponent(name) +
                "&background=111&color=fff&rounded=true&size=64";

        }

    } else {

        dropdown.innerHTML = `

            <a href="/login">
                Se connecter
            </a>

            <a href="/signup">
                Créer un compte
            </a>

        `;


        avatar.src =
            "https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64";

    }

}


/* ========================= */
/* OUVERTURE MENU */
/* ========================= */

avatar.addEventListener(
    "click",
    (event) => {

        event.stopPropagation();

        dropdown.classList.toggle(
            "show"
        );

    }
);


/* ========================= */
/* FERMETURE MENU */
/* ========================= */

document.addEventListener(
    "click",
    () => {

        dropdown.classList.remove(
            "show"
        );

    }
);


/* ========================= */
/* DÉCONNEXION */
/* ========================= */

document.addEventListener(
    "click",
    async (event) => {

        if (
            event.target.id ===
            "logout"
        ) {

            event.preventDefault();

            await signOut(auth);

            window.location.href =
                "/login";

        }

    }
);


/* ========================= */
/* PROFIL INTROUVABLE */
/* ========================= */

function showNotFound() {

    profileCard.innerHTML = `

        <div class="profile-error">

            <h1>
                Utilisateur introuvable
            </h1>

            <p>
                Aucun profil ne correspond à cet ID BlocPlay.
            </p>

        </div>

    `;

}


/* ========================= */
/* FORMAT DATE */
/* ========================= */

function formatCreationDate(
    createdAt
) {

    if (!createdAt) {
        return "";
    }


    let date;


    if (
        typeof createdAt.toDate ===
        "function"
    ) {

        date =
            createdAt.toDate();

    } else if (
        createdAt instanceof Date
    ) {

        date =
            createdAt;

    } else if (
        typeof createdAt ===
        "number"
    ) {

        date =
            new Date(createdAt);

    } else {

        return "";

    }


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleDateString(
        "fr-FR",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


/* ========================= */
/* VÉRIFIER AMITIÉ */
/* ========================= */

async function areFriends(
    userUID,
    otherUID
) {

    const friendRef =
        doc(
            db,
            "users",
            userUID,
            "friends",
            otherUID
        );


    const friendSnap =
        await getDoc(
            friendRef
        );


    return friendSnap.exists();

}


/* ========================= */
/* VÉRIFIER DEMANDE */
/* ========================= */

async function hasFriendRequest(
    senderUID,
    recipientUID
) {

    const requestRef =
        doc(
            db,
            "users",
            recipientUID,
            "friendRequests",
            senderUID
        );


    const requestSnap =
        await getDoc(
            requestRef
        );


    return requestSnap.exists();

}


/* ========================= */
/* METTRE À JOUR BOUTON AMI */
/* ========================= */

async function updateFriendButton() {

    if (
        !currentUser ||
        !viewedProfileUID ||
        currentUser.uid === viewedProfileUID
    ) {

        friendRequestContainer.style.display =
            "none";

        return;

    }


    friendRequestContainer.style.display =
        "flex";


    friendRequestButton.disabled =
        true;


    friendRequestButton.textContent =
        "Chargement...";


    try {

        const alreadyFriends =
            await areFriends(
                currentUser.uid,
                viewedProfileUID
            );


        if (alreadyFriends) {

            friendRequestContainer.style.display =
                "none";

            return;

        }


        const requestExists =
            await hasFriendRequest(
                currentUser.uid,
                viewedProfileUID
            );


        if (requestExists) {

            friendRequestState =
                "sent";

            friendRequestButton.textContent =
                "Annuler la demande d'ami";

            friendRequestButton.classList.add(
                "cancel"
            );

        } else {

            friendRequestState =
                "none";

            friendRequestButton.textContent =
                "Faire une demande d'ami";

            friendRequestButton.classList.remove(
                "cancel"
            );

        }


        friendRequestButton.disabled =
            false;

    } catch (error) {

        console.error(
            "Erreur vérification ami :",
            error
        );


        friendRequestContainer.style.display =
            "none";

    }

}


/* ========================= */
/* ENVOYER / ANNULER */
/* ========================= */

friendRequestButton.addEventListener(
    "click",
    async () => {

        if (
            !currentUser ||
            !viewedProfileUID ||
            currentUser.uid === viewedProfileUID
        ) {

            return;

        }


        friendRequestButton.disabled =
            true;


        try {

            /* ========================= */
            /* ANNULATION */
            /* ========================= */

            if (
                friendRequestState ===
                "sent"
            ) {

                const requestRef =
                    doc(
                        db,
                        "users",
                        viewedProfileUID,
                        "friendRequests",
                        currentUser.uid
                    );


                await deleteDoc(
                    requestRef
                );


                friendRequestState =
                    "none";


                friendRequestButton.textContent =
                    "Faire une demande d'ami";


                friendRequestButton.classList.remove(
                    "cancel"
                );


                friendRequestButton.disabled =
                    false;


                return;

            }


            /* ========================= */
            /* NOUVELLE DEMANDE */
            /* ========================= */

            const requestRef =
                doc(
                    db,
                    "users",
                    viewedProfileUID,
                    "friendRequests",
                    currentUser.uid
                );


            await setDoc(
                requestRef,
                {

                    senderUid:
                        currentUser.uid,

                    recipientUid:
                        viewedProfileUID,

                    status:
                        "pending",

                    createdAt:
                        serverTimestamp()

                }
            );


            friendRequestState =
                "sent";


            friendRequestButton.textContent =
                "Annuler la demande d'ami";


            friendRequestButton.classList.add(
                "cancel"
            );


            friendRequestButton.disabled =
                false;

        } catch (error) {

            console.error(
                "Erreur demande d'ami :",
                error
            );


            alert(
                "Impossible de modifier la demande d'ami."
            );


            friendRequestButton.disabled =
                false;

        }

    }
);


/* ========================= */
/* AFFICHER PROFIL */
/* ========================= */

async function displayProfile(
    data,
    isOwnProfile
) {

    const displayName =
        data.displayName ||
        data.username ||
        "Utilisateur";


    const photoURL =
        data.photoURL ||
        data.avatar ||
        (
            "https://ui-avatars.com/api/?name=" +
            encodeURIComponent(displayName) +
            "&background=111&color=fff&rounded=true&size=256"
        );


    /* ========================= */
    /* TITRE */
    /* ========================= */

    if (isOwnProfile) {

        profileTitle.textContent =
            "Mon profil";

    } else {

        profileTitle.textContent =
            "Profil";

    }


    /* ========================= */
    /* INFOS */
/* ========================= */

    username.textContent =
        displayName;


    profilePic.src =
        photoURL;


    profilePic.alt =
        "Photo de profil de " +
        displayName;


    /* ========================= */
    /* EMAIL */
/* ========================= */

    if (isOwnProfile) {

        email.textContent =
            data.email || "";

    } else {

        email.textContent =
            "";

    }


    /* ========================= */
    /* ID */
/* ========================= */

    if (
        data.id !== undefined &&
        data.id !== null
    ) {

        profileId.textContent =
            "ID BlocPlay : " +
            data.id;

    } else {

        profileId.textContent =
            "";

    }


    /* ========================= */
    /* DATE DE CRÉATION */
/* ========================= */

    const creationDate =
        formatCreationDate(
            data.createdAt
        );


    if (creationDate) {

        profileCreated.textContent =
            "Compte créé le " +
            creationDate;

    } else {

        profileCreated.textContent =
            "";

    }


    /* ========================= */
    /* RIZOPLAY */
/* ========================= */

    const isAdmin =
        data.email ===
            "blocplaystudios@gmail.com" &&
        data.displayName ===
            "BlocPlay Studios";


    const hasRizoPlay =
        data.rizoplay === true ||
        isAdmin;


    if (hasRizoPlay) {

        rizoBadge.style.display =
            "block";

    } else {

        rizoBadge.style.display =
            "none";

    }


    /* ========================= */
    /* DEMANDE D'AMI */
/* ========================= */

    viewedProfileUID =
        data.uid || null;


    if (isOwnProfile) {

        friendRequestContainer.style.display =
            "none";

    } else {

        await updateFriendButton();

    }

}


/* ========================= */
/* RÉCUPÉRER PAR UID */
/* ========================= */

async function getProfileByUID(
    uid
) {

    const profileRef =
        doc(
            db,
            "users",
            uid
        );


    const profileSnap =
        await getDoc(
            profileRef
        );


    if (
        !profileSnap.exists()
    ) {

        return null;

    }


    return {

        uid:
            uid,

        ...profileSnap.data()

    };

}


/* ========================= */
/* RÉCUPÉRER PAR ID */
/* ========================= */

async function getProfileByCustomID(
    customID
) {

    const usersRef =
        collection(
            db,
            "users"
        );


    const numericID =
        Number(customID);


    if (
        Number.isNaN(numericID)
    ) {

        return null;

    }


    const q =
        query(
            usersRef,
            where(
                "id",
                "==",
                numericID
            ),
            limit(1)
        );


    const snapshot =
        await getDocs(q);


    if (
        snapshot.empty
    ) {

        return null;

    }


    const userDoc =
        snapshot.docs[0];


    return {

        uid:
            userDoc.id,

        ...userDoc.data()

    };

}


/* ========================= */
/* CHARGEMENT DU PROFIL */
/* ========================= */

async function loadProfile(
    user
) {

    const hash =
        window.location.hash;


    const customID =
        hash
            .substring(1)
            .trim();


    let profileData =
        null;


    let isOwnProfile =
        false;


    /* ========================= */
    /* PROFIL PERSONNEL */
/* ========================= */

    if (!customID) {

        profileData =
            await getProfileByUID(
                user.uid
            );

        isOwnProfile =
            true;

    }


    /* ========================= */
    /* PROFIL PAR ID */
/* ========================= */

    else {

        profileData =
            await getProfileByCustomID(
                customID
            );


        if (
            profileData &&
            profileData.uid ===
                user.uid
        ) {

            isOwnProfile =
                true;

        }

    }


    /* ========================= */
    /* PROFIL INTROUVABLE */
/* ========================= */

    if (!profileData) {

        showNotFound();

        return;

    }


    await displayProfile(
        profileData,
        isOwnProfile
    );

}


/* ========================= */
/* AUTH */
/* ========================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if (!user) {

            window.location.href =
                "/login";

            return;

        }


        currentUser =
            user;


        await renderMenu(
            user
        );


        try {

            await loadProfile(
                user
            );

        } catch (error) {

            console.error(
                "Erreur chargement profil :",
                error
            );


            showNotFound();

        }

    }
);


/* ========================= */
/* HASH CHANGE */
/* ========================= */

window.addEventListener(
    "hashchange",
    () => {

        window.location.reload();

    }
);

</script>


<!-- ========================= -->
<!-- RECHERCHE -->
<!-- ========================= -->

<script>

const searchBtn =
    document.getElementById(
        "searchBtn"
    );


const searchOverlay =
    document.getElementById(
        "searchOverlay"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const searchResults =
    document.getElementById(
        "searchResults"
    );


const closeSearch =
    document.getElementById(
        "closeSearch"
    );


searchBtn.addEventListener(
    "click",
    () => {

        searchOverlay.classList.add(
            "show"
        );

        searchInput.focus();

    }
);


closeSearch.addEventListener(
    "click",
    () => {

        searchOverlay.classList.remove(
            "show"
        );

        searchInput.value = "";

        searchResults.innerHTML = "";

    }
);


searchInput.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key !==
            "Enter"
        ) {

            return;

        }


        const query =
            searchInput.value.trim();


        if (!query) {
            return;
        }


        searchResults.innerHTML = `

            <div class="search-result">

                <h3>
                    Résultats de recherche
                </h3>

                <p>
                    Recherche pour :
                    <strong>
                        ${escapeHTML(query)}
                    </strong>
                </p>

            </div>

        `;

    }
);


function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


searchOverlay.addEventListener(
    "click",
    (event) => {

        if (
            event.target ===
            searchOverlay
        ) {

            searchOverlay.classList.remove(
                "show"
            );

            searchInput.value = "";

            searchResults.innerHTML = "";

        }

    }
);

</script>


<!-- ========================= -->
<!-- SERVICE WORKER -->
<!-- ========================= -->

<script>

if (
    "serviceWorker" in
    navigator
) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker.register(
                "/service-worker.js"
            );

        }
    );

}

</script>


</body>
