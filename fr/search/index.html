    <!-- STYLE RECHERCHE -->
    <!-- ================================= -->

    <style>

        .search-page-card {
            margin-bottom: 20px;
        }


        .search-page-form {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }


        .search-page-input {
            flex: 1;
            min-width: 0;
            padding: 14px 16px;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.07);
            color: white;
            outline: none;
            font-size: 16px;
            box-sizing: border-box;
        }


        .search-page-input::placeholder {
            color: rgba(255,255,255,0.5);
        }


        .search-page-input:focus {
            background: rgba(255,255,255,0.1);
        }


        .search-page-button {
            border: none;
            border-radius: 12px;
            padding: 0 20px;
            cursor: pointer;
            font-size: 18px;
            background: #5865f2;
            color: white;
            transition: transform 0.15s ease,
                        opacity 0.15s ease;
        }


        .search-page-button:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }


        .search-query {
            opacity: 0.7;
        }


        .search-group {
            margin-bottom: 20px;
        }


        .search-group:last-child {
            margin-bottom: 0;
        }


        .search-group-title {
            margin-bottom: 12px;
        }


        .search-result-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }


        .search-result {
            display: flex;
            align-items: center;
            gap: 14px;

            padding: 13px;

            border-radius: 14px;

            background: rgba(255,255,255,0.045);

            color: inherit;
            text-decoration: none;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }


        .search-result:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-1px);
        }


        .search-result-image,
        .search-result-icon {
            width: 52px;
            height: 52px;

            min-width: 52px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            object-fit: cover;

            background: rgba(255,255,255,0.08);
        }


        .search-result-icon {
            font-size: 25px;
        }


        .search-result-content {
            flex: 1;
            min-width: 0;
        }


        .search-result-content h3 {
            margin: 0 0 4px 0;

            font-size: 16px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        .search-result-content p {
            margin: 0;

            opacity: 0.6;

            font-size: 13px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        .search-result-type {
            display: inline-block;

            margin-top: 5px;

            font-size: 11px;

            opacity: 0.5;
        }


        .search-result-arrow {
            opacity: 0.45;
            font-size: 20px;
        }


        .search-empty {
            text-align: center;
            padding: 25px 10px;
        }


        .search-empty-icon {
            font-size: 38px;
            margin-bottom: 10px;
        }


        .search-loading {
            text-align: center;
            opacity: 0.65;
            padding: 20px;
        }


        @media (max-width: 600px) {

            .search-page-form {
                gap: 8px;
            }

            .search-page-button {
                padding: 0 15px;
            }

            .search-result {
                padding: 11px;
            }

            .search-result-image,
            .search-result-icon {
                width: 46px;
                height: 46px;
                min-width: 46px;
            }

            .search-result-arrow {
                display: none;
            }

        }

    </style>

</head>

<!-- ================================= -->

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================================= */
/* FIREBASE CONFIG */
/* ================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwEtMmEtUkn04",

    authDomain:
        "blocplay-a9417.firebaseapp.com",

    projectId:
        "blocplay-a9417",

    storageBucket:
        "blocplay-a9417.firebasestorage.app",

    messagingSenderId:
        "540161549188",

    appId:
        "1:540161549188:web:e0ec0350bd044de2f333d1"

};


const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* ================================= */
/* ELEMENTS */
/* ================================= */

const avatar =
    document.getElementById(
        "avatar"
    );


const dropdown =
    document.getElementById(
        "dropdown"
    );


const resultsContainer =
    document.getElementById(
        "resultsContainer"
    );


const searchInfo =
    document.getElementById(
        "searchInfo"
    );


const pageSearchInput =
    document.getElementById(
        "pageSearchInput"
    );


const searchForm =
    document.getElementById(
        "searchForm"
    );


/* ================================= */
/* MENU PROFIL */
/* ================================= */

async function renderMenu(user) {

    if (user) {

        dropdown.innerHTML = `

            <a href="/fr/profile">
                Profil
            </a>

            <a href="/fr/settings">
                Paramètres
            </a>

            <a href="/fr/rizoplay">
                RizoPlay
            </a>

            <a href="#" id="logout">
                Se déconnecter
            </a>

        `;


        const name =
            user.displayName ||
            user.email?.split("@")[0] ||
            "User";


        let photoURL = "";


        try {

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if (
                userSnap.exists()
            ) {

                const data =
                    userSnap.data();


                photoURL =
                    data.photoURL ||
                    data.avatar ||
                    "";

            }

        } catch (error) {

            console.error(
                "Erreur photo Firestore :",
                error
            );

        }


        if (!photoURL) {

            photoURL =
                user.photoURL ||
                "";

        }


        if (photoURL) {

            avatar.src =
                photoURL;

        } else {

            avatar.src =
                "https://ui-avatars.com/api/?name=" +
                encodeURIComponent(name) +
                "&background=111&color=fff&rounded=true&size=64";

        }


    } else {

        dropdown.innerHTML = `

            <a href="/fr/login">
                Se connecter
            </a>

            <a href="/fr/signup">
                Créer un compte
            </a>

        `;


        avatar.src =
            "https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64";

    }

}


/* ================================= */
/* AUTH */
/* ================================= */

onAuthStateChanged(
    auth,
    renderMenu
);


/* ================================= */
/* MENU PROFIL */
/* ================================= */

avatar.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        dropdown.classList.toggle(
            "show"
        );

    }
);


document.addEventListener(
    "click",
    () => {

        dropdown.classList.remove(
            "show"
        );

    }
);


document.addEventListener(
    "click",
    async event => {

        if (
            event.target.id ===
            "logout"
        ) {

            event.preventDefault();

            await signOut(
                auth
            );

            window.location.reload();

        }

    }
);


/* ================================= */
/* OUTILS */
/* ================================= */

function normalizeText(
    value
) {

    return String(
        value || ""
    )
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .toLowerCase()
    .trim();

}


function escapeHTML(
    value
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value || "";

    return div.innerHTML;

}


function getImage(
    data
) {

    return (
        data?.photoURL ||
        data?.imageURL ||
        data?.imageUrl ||
        data?.thumbnail ||
        data?.iconURL ||
        data?.icon ||
        ""
    );

}


function getName(
    data,
    fallback
) {

    return (
        data?.displayName ||
        data?.username ||
        data?.name ||
        data?.title ||
        fallback
    );

}


/* ================================= */
/* HASH */
/* ================================= */

function getSearchQuery() {

    const hash =
        window.location.hash;


    if (!hash) {

        return "";

    }


    try {

        return decodeURIComponent(
            hash.substring(1)
        );

    } catch {

        return hash.substring(1);

    }

}


/* ================================= */
/* CRÉER UN RÉSULTAT */
/* ================================= */

function createResult(
    type,
    icon,
    title,
    description,
    url,
    image
) {

    const result =
        document.createElement(
            "a"
        );


    result.href =
        url;


    result.className =
        "search-result";


    const safeTitle =
        escapeHTML(
            title
        );


    const safeDescription =
        escapeHTML(
            description
        );


    if (image) {

        const imageElement =
            document.createElement(
                "img"
            );


        imageElement.className =
            "search-result-image";


        imageElement.src =
            image;


        imageElement.alt =
            "";


        imageElement.onerror =
            () => {

                imageElement.replaceWith(
                    createIcon(
                        icon
                    )
                );

            };


        result.appendChild(
            imageElement
        );

    } else {

        result.appendChild(
            createIcon(
                icon
            )
        );

    }


    const content =
        document.createElement(
            "div"
        );


    content.className =
        "search-result-content";


    content.innerHTML = `

        <h3>
            ${safeTitle}
        </h3>

        <p>
            ${safeDescription}
        </p>

        <span class="search-result-type">
            ${escapeHTML(type)}
        </span>

    `;


    result.appendChild(
        content
    );


    const arrow =
        document.createElement(
            "span"
        );


    arrow.className =
        "search-result-arrow";


    arrow.textContent =
        "→";


    result.appendChild(
        arrow
    );


    return result;

}


/* ================================= */
/* ICÔNE RÉSULTAT */
/* ================================= */

function createIcon(
    icon
) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "search-result-icon";


    element.textContent =
        icon;


    return element;

}


/* ================================= */
/* GROUPE */
/* ================================= */

function createGroup(
    title,
    results
) {

    if (
        !results.length
    ) {

        return null;

    }


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card search-group";


    const heading =
        document.createElement(
            "h2"
        );


    heading.className =
        "search-group-title";


    heading.textContent =
        title;


    card.appendChild(
        heading
    );


    const list =
        document.createElement(
            "div"
        );


    list.className =
        "search-result-list";


    results.forEach(
        result => {

            list.appendChild(
                createResult(
                    result.type,
                    result.icon,
                    result.title,
                    result.description,
                    result.url,
                    result.image
                )
            );

        }
    );


    card.appendChild(
        list
    );


    return card;

}


/* ================================= */
/* UTILISATEURS */
/* ================================= */

async function searchUsers(
    query
) {

    const snapshot =
        await getDocs(
            collection(
                db,
                "users"
            )
        );


    const normalized =
        normalizeText(
            query
        );


    const results = [];


    snapshot.forEach(
        documentSnapshot => {

            const data =
                documentSnapshot.data();


            const displayName =
                normalizeText(
                    data.displayName
                );


            const username =
                normalizeText(
                    data.username
                );


            if (
                displayName.includes(
                    normalized
                )
                ||
                username.includes(
                    normalized
                )
            ) {

                const customID =
                    data.id;


                const profileID =
                    customID !== undefined &&
                    customID !== null
                        ? customID
                        : documentSnapshot.id;


                results.push({

                    type:
                        "Utilisateur",

                    icon:
                        "👤",

                    title:
                        getName(
                            data,
                            "Utilisateur"
                        ),

                    description:
                        data.username
                            ? "@" + data.username
                            : "Utilisateur BlocPlay",

                    url:
                        "/fr/profile#" +
                        encodeURIComponent(
                            profileID
                        ),

                    image:
                        getImage(
                            data
                        )

                });

            }

        }
    );


    return results.slice(
        0,
        20
    );

}


/* ================================= */
/* JEUX */
/* ================================= */

                    image:

/* ================================= */
/* EFFECTUER LA RECHERCHE */
/* ================================= */

async function performSearch() {

    const query =
        getSearchQuery();


    pageSearchInput.value =
        query;


    if (!query) {

        searchInfo.innerHTML = `

            <p>
                Entrez une recherche ci-dessus
                pour trouver des utilisateurs,
                jeux, tribus ou articles.
            </p>

        `;


        resultsContainer.innerHTML =
            "";

        return;

    }


    searchInfo.innerHTML = `

        <p>
            Résultats pour :
            <strong class="search-query">
                ${escapeHTML(query)}
            </strong>
        </p>

    `;


    resultsContainer.innerHTML = `

        <div class="card">

            <div class="search-loading">
                Recherche en cours...
            </div>

        </div>

    `;


    try {

        const [
            users,
            games,
            tribes,
            articles
        ] = await Promise.all([

            searchUsers(
                query
            ),

            searchGames(
                query
            ),

            searchTribes(
                query
            ),

            searchArticles(
                query
            )

        ]);


        const total =
            users.length +
            games.length +
            tribes.length +
            articles.length;


        resultsContainer.innerHTML =
            "";


        if (
            total === 0
        ) {

            resultsContainer.innerHTML = `

                <div class="card">

                    <div class="search-empty">

                        <div class="search-empty-icon">
                            🔎
                        </div>

                        <h2>
                            Aucun résultat trouvé
                        </h2>

                        <p>
                            Aucun résultat ne correspond
                            à
                            <strong>
                                ${escapeHTML(query)}
                            </strong>.
                        </p>

                    </div>

                </div>

            `;

            return;

        }


        const groups = [

            createGroup(
                "👤 Utilisateurs",
                users
            ),

            createGroup(
                "🎮 Jeux",
                games
            ),

            createGroup(
                "🏠 Tribus",
                tribes
            ),

            createGroup(
                "📰 Articles",
                articles
            )

        ];


        groups.forEach(
            group => {

                if (group) {

                    resultsContainer.appendChild(
                        group
                    );

                }

            }
        );


    } catch (error) {

        console.error(
            "Erreur recherche :",
            error
        );


        resultsContainer.innerHTML = `

            <div class="card">

                <div class="search-empty">

                    <div class="search-empty-icon">
                        ⚠️
                    </div>

                    <h2>
                        Impossible de charger les résultats
                    </h2>

                    <p>
                        Une erreur est survenue
                        pendant la recherche.
                    </p>

                </div>

            </div>

        `;

    }

}


/* ================================= */
/* FORMULAIRE DE LA PAGE */
/* ================================= */

searchForm.addEventListener(
    "submit",
    event => {

        event.preventDefault();


        const query =
            pageSearchInput.value.trim();


        if (!query) {

            pageSearchInput.focus();

            return;

        }


        window.location.href =
            "/fr/search/#" +
            encodeURIComponent(
                query
            );

    }
);


/* ================================= */
/* HASH CHANGE */
/* ================================= */

window.addEventListener(
    "hashchange",
    performSearch
);


/* ================================= */
/* LANCEMENT */
/* ================================= */

performSearch();

</script>


<!-- ================================= -->
<!-- RECHERCHE DU HEADER -->
<!-- ================================= -->

<script>

const searchBtn =
    document.getElementById(
        "searchBtn"
    );


const searchOverlay =
    document.getElementById(
        "searchOverlay"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const searchResults =
    document.getElementById(
        "searchResults"
    );


const closeSearch =
    document.getElementById(
        "closeSearch"
    );


/* ================================= */
/* OUVRIR */
/* ================================= */

searchBtn.addEventListener(
    "click",
    () => {

        searchOverlay.classList.add(
            "show"
        );

        searchInput.value =
            getSearchQuery();


        searchInput.focus();

    }
);


/* ================================= */
/* FERMER */
/* ================================= */

closeSearch.addEventListener(
    "click",
    () => {

        searchOverlay.classList.remove(
            "show"
        );

        searchInput.value =
            "";

        searchResults.innerHTML =
            "";

    }
);


/* ================================= */
/* ENTRÉE */
/* ================================= */

searchInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key !==
            "Enter"
        ) {

            return;

        }


        event.preventDefault();


        const query =
            searchInput.value.trim();


        if (!query) {

            return;

        }


        window.location.href =
            "/fr/search/#" +
            encodeURIComponent(
                query
            );

    }
);


/* ================================= */
/* CLIC EN DEHORS */
/* ================================= */

searchOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            searchOverlay
        ) {

            searchOverlay.classList.remove(
                "show"
            );

            searchInput.value =
                "";

            searchResults.innerHTML =
                "";

        }

    }
);

</script>


<!-- ================================= -->
<!-- SERVICE WORKER -->
<!-- ================================= -->

<script>

if (
    "serviceWorker" in navigator
) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker.register(
                "/service-worker.js"
            );

        }
    );

}

</script>
