<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recherche - BlocPlay</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.ico">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0f1a">

</head>

<body>


<!-- ========================= -->
<!-- HEADER -->

<header>

    </a>

    <div class="header-actions">

      <!-- RECHERCHE -->
      <button

</header>


<!-- ========================= -->
<!-- RECHERCHE -->
<!-- ========================= -->

<div
  id="searchOverlay"

>

  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="Rechercher sur BlocPlay..."
      autocomplete="off"

    <button

      class="search-close"

      ✕
    </button>

  </div>

    class="search-results"

</div>


<!-- ========================= -->
<!-- CONTENU -->
<!-- ========================= -->

<main class="container">


  <div class="card">

    <h1>Recherche</h1>

    <p id="searchText">
      Recherche sur BlocPlay...

  </div>


  <!-- ========================= -->
  <!-- RÉSULTATS -->
  <!-- ========================= -->

  <div

  >

    <div class="card">

      <p>
        Chargement des résultats...

</main>


<!-- ========================= -->
<!-- FOOTER -->
<!-- ========================= -->

<footer class="site-footer">

  <div class="footer-content">

    <div class="footer-column">

      <h3>BlocPlay</h3>

      <p>
        La plateforme de jeux créée par et pour les gamers.
      </p>

    </div>


    <div class="footer-column">

      <h3>À propos</h3>

      <a href="/about">
        À propos de BlocPlay
      </a>

      <a href="/license">
        Licences
      </a>

    </div>


    <div class="footer-column">

      <h3>Nous contacter</h3>

      <a href="mailto:blocplaystudios@gmail.com">
        E-Mail
      </a>

      <a href="https://discord.gg/QfreSq3t7E">
        Discord
      </a>

    </div>

  </div>

  <div class="footer-bottom">
    © BlocPlay Studios™
  </div>

</footer>


<!-- ========================= -->
<!-- FIREBASE + PROFIL -->
<!-- ========================= -->

<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ========================= */
/* FIREBASE */
/* ========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",

  authDomain:
    "blocplay-a9417.firebaseapp.com",

  projectId:
    "blocplay-a9417",

  storageBucket:
    "blocplay-a9417.firebasestorage.app",

  messagingSenderId:
    "540161549188",

  appId:
    "1:540161549188:web:e0ec0350bd044de2f333d1"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* ========================= */
/* ELEMENTS */
/* ========================= */

const avatar =
  document.getElementById(
    "avatar"
  );


const dropdown =
  document.getElementById(
    "dropdown"
  );


const resultsContainer =
  document.getElementById(
    "resultsContainer"
  );


const searchText =
  document.getElementById(
    "searchText"
  );


/* ========================= */
/* MENU PROFIL */
/* ========================= */

async function renderMenu(user) {

  if (user) {

    dropdown.innerHTML = `

      <a href="/profile">
        Profil
      </a>

      <a href="/settings">
        Paramètres
      </a>

      <a href="/rizoplay">
        RizoPlay
      </a>

      <a href="#" id="logout">
        Se déconnecter
      </a>

    `;


    const name =
      user.displayName ||
      user.email?.split("@")[0] ||
      "User";


    let photoURL = "";


    /* ========================= */
    /* PHOTO FIRESTORE */
    /* ========================= */

    try {

      const userRef =
        doc(
          db,
          "users",
          user.uid
        );


      const userSnap =
        await getDoc(
          userRef
        );


      if (userSnap.exists()) {

        const data =
          userSnap.data();


        photoURL =
          data.photoURL ||
          data.avatar ||
          "";

      }

    } catch (error) {

      console.error(
        "Erreur chargement photo Firestore :",
        error
      );

    }


    /* ========================= */
    /* PHOTO FIREBASE AUTH */
    /* ========================= */

    if (!photoURL) {

      photoURL =
        user.photoURL ||
        "";

    }


    /* ========================= */
    /* AFFICHER LA PHOTO */
    /* ========================= */

    if (photoURL) {

      avatar.src =
        photoURL;

    } else {

      avatar.src =
        "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(name) +
        "&background=111&color=fff&rounded=true&size=64";

    }


  } else {

    dropdown.innerHTML = `

      <a href="/login">
        Se connecter
      </a>

      <a href="/signup">
        Créer un compte
      </a>

    `;


    avatar.src =
      "https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64";

  }

}


/* ========================= */
/* AUTH */
/* ========================= */

onAuthStateChanged(
  auth,
  (user) => {

    renderMenu(user);

  }
);


/* ========================= */
/* OUVERTURE DU MENU */
/* ========================= */

avatar.addEventListener(
  "click",
  (event) => {

    event.stopPropagation();

    dropdown.classList.toggle(
      "show"
    );

  }
);


/* ========================= */
/* FERMETURE DU MENU */
/* ========================= */

document.addEventListener(
  "click",
  () => {

    dropdown.classList.remove(
      "show"
    );

  }
);


/* ========================= */
/* DÉCONNEXION */
/* ========================= */

document.addEventListener(
  "click",
  async (event) => {

    if (
      event.target.id ===
      "logout"
    ) {

      event.preventDefault();

      await signOut(auth);

      window.location.reload();

    }

  }
);


/* ========================= */
/* OUTILS */
/* ========================= */

function normalizeText(
  value
) {

  return String(
    value || ""
  )
  .normalize("NFD")
  .replace(
    /[\u0300-\u036f]/g,
    ""
  )
  .toLowerCase()
  .trim();

}


function escapeHTML(
  value
) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value || "";

  return div.innerHTML;

}


function getImage(
  data
) {

  return (
    data?.photoURL ||
    data?.imageURL ||
    data?.imageUrl ||
    data?.thumbnail ||
    data?.iconURL ||
    data?.icon ||
    ""
  );

}


function getName(
  data,
  fallback
) {

  return (
    data?.displayName ||
    data?.username ||
    data?.name ||
    data?.title ||
    fallback
  );

}


/* ========================= */
/* RÉCUPÉRER LA RECHERCHE */
/* ========================= */

function getSearchQuery() {

  const hash =
    window.location.hash;


  if (!hash) {

    return "";

  }


  return decodeURIComponent(
    hash.substring(1)
  );

}


/* ========================= */
/* RÉSULTAT */
/* ========================= */

function createResult(
  icon,
  title,
  description,
  url,
  image
) {

  const result =
    document.createElement(
      "a"
    );


  result.href =
    url;


  result.className =
    "search-result";


  if (image) {

    result.innerHTML = `

      <img
        src="${escapeHTML(image)}"
        alt=""
        class="search-result-image"
      >

      <div class="search-result-content">

        <h3>
          ${escapeHTML(title)}
        </h3>

        <p>
          ${escapeHTML(description)}
        </p>

      </div>

      <span class="search-result-arrow">
        →
      </span>

    `;

  } else {

    result.innerHTML = `

      <div class="search-result-icon">
        ${icon}
      </div>

      <div class="search-result-content">

        <h3>
          ${escapeHTML(title)}
        </h3>

        <p>
          ${escapeHTML(description)}
        </p>

      </div>

      <span class="search-result-arrow">
        →
      </span>

    `;

  }


  return result;

}


/* ========================= */
/* GROUPE DE RÉSULTATS */
/* ========================= */

function createGroup(
  title,
  results
) {

  if (!results.length) {

    return null;

  }


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "card";


  const heading =
    document.createElement(
      "h2"
    );


  heading.textContent =
    title;


  card.appendChild(
    heading
  );


  const list =
    document.createElement(
      "div"
    );


  list.className =
    "search-result-list";


  results.forEach(
    result => {

      list.appendChild(
        createResult(
          result.icon,
          result.title,
          result.description,
          result.url,
          result.image
        )
      );

    }
  );


  card.appendChild(
    list
  );


  return card;

}


/* ========================= */
/* UTILISATEURS */
/* ========================= */

async function searchUsers(
  query
) {

  const snapshot =
    await getDocs(
      collection(
        db,
        "users"
      )
    );


  const normalized =
    normalizeText(
      query
    );


  const results = [];


  snapshot.forEach(
    documentSnapshot => {

      const data =
        documentSnapshot.data();


      const displayName =
        normalizeText(
          data.displayName
        );


      const username =
        normalizeText(
          data.username
        );


      if (
        displayName.includes(
          normalized
        )
        ||
        username.includes(
          normalized
        )
      ) {

        const customID =
          data.id;


        let url;


        if (
          customID !== undefined &&
          customID !== null
        ) {

          url =
            "/profile#" +
            encodeURIComponent(
              customID
            );

        } else {

          url =
            "/profile#" +
            encodeURIComponent(
              documentSnapshot.id
            );

        }


        results.push({

          icon: "👤",

          title:
            getName(
              data,
              "Utilisateur"
            ),

          description:
            "Utilisateur BlocPlay",

          url: url,

          image:
            getImage(
              data
            )

        });

      }

    }
  );


  return results.slice(
    0,
    20
  );

}


/* ========================= */
/* JEUX */
/* ========================= */

async function searchGames(
  query
) {

  const snapshot =
    await getDocs(
      collection(
        db,
        "games"
      )
    );


  const normalized =
    normalizeText(
      query
    );


  const results = [];


  snapshot.forEach(
    documentSnapshot => {

      const data =
        documentSnapshot.data();


      const name =
        normalizeText(
          data.name ||
          data.title ||
          data.displayName
        );


      const description =
        normalizeText(
          data.description
        );


      if (
        name.includes(
          normalized
        )
        ||
        description.includes(
          normalized
        )
      ) {

        results.push({

          icon: "🎮",

          title:
            getName(
              data,
              "Jeu"
            ),

          description:
            "Jeu BlocPlay",

          /*
           * À adapter si tes pages de jeux
           * utilisent une autre URL.
           */

          url:
            "/fr/game#" +
            encodeURIComponent(
              documentSnapshot.id
            ),

          image:
            getImage(
              data
            )

        });

      }

    }
  );


  return results.slice(
    0,
    20
  );

}


/* ========================= */
/* TRIBUS */
/* ========================= */

async function searchTribes(
  query
) {

  const snapshot =
    await getDocs(
      collection(
        db,
        "tribes"
      )
    );


  const normalized =
    normalizeText(
      query
    );


  const results = [];


  snapshot.forEach(
    documentSnapshot => {

      const data =
        documentSnapshot.data();


      const name =
        normalizeText(
          data.name ||
          data.title ||
          data.displayName
        );


      const description =
        normalizeText(
          data.description
        );


      if (
        name.includes(
          normalized
        )
        ||
        description.includes(
          normalized
        )
      ) {

        results.push({

          icon: "🏠",

          title:
            getName(
              data,
              "Tribu"
            ),

          description:
            "Tribu BlocPlay",

          /*
           * À adapter si tes pages de tribus
           * utilisent une autre URL.
           */

          url:
            "/fr/tribe#" +
            encodeURIComponent(
              documentSnapshot.id
            ),

          image:
            getImage(
              data
            )

        });

      }

    }
  );


  return results.slice(
    0,

  );

}


/* ========================= */
/* ARTICLES */
/* ========================= */

async function searchArticles(
  query
) {

  const snapshot =
    await getDocs(
      collection(
        db,
        "articles"
      )
    );


  const normalized =
    normalizeText(
      query
    );


  const results = [];


  snapshot.forEach(
    documentSnapshot => {

      const data =
        documentSnapshot.data();


      const title =
        normalizeText(
          data.title ||
          data.name
        );


      const description =
        normalizeText(
          data.description ||
          data.excerpt
        );


      if (
        title.includes(
          normalized
        )
        ||
        description.includes(
          normalized
        )
      ) {

        results.push({

          icon: "📰",

          title:
            getName(
              data,
              "Article"
            ),

          description:
            "Article BlocPlay",

          /*
           * À adapter si tes pages d'articles
           * utilisent une autre URL.
           */

          url:
            "/fr/article#" +
            encodeURIComponent(
              documentSnapshot.id
            ),

          image:
            getImage(
              data
            )

        });

      }

    }
  );


  return results.slice(
    0,
    20
  );

}


/* ========================= */
/* LANCER LA RECHERCHE */
/* ========================= */

async function performSearch() {

  const query =
    getSearchQuery();


  if (!query) {

    searchText.textContent =
      "Entrez une recherche dans la barre de recherche.";


    resultsContainer.innerHTML = `

      <div class="card">

        <h2>
          Rechercher sur BlocPlay
        </h2>

        <p>
          Vous pouvez rechercher un utilisateur,
          un jeu, une tribu ou un article.
        </p>

      </div>

    `;

    return;

  }


  searchText.innerHTML =
    "Résultats pour : <strong>" +
    escapeHTML(query) +
    "</strong>";


  resultsContainer.innerHTML = `

    <div class="card">

      <p>
        Recherche en cours...
      </p>

    </div>

  `;


  try {

    const [
      users,
      games,
      tribes,
      articles
    ] = await Promise.all([

      searchUsers(
        query
      ),

      searchGames(
        query
      ),

      searchTribes(
        query
      ),

      searchArticles(
        query
      )

    ]);


    const allResults =
      users.length +
      games.length +
      tribes.length +
      articles.length;


    resultsContainer.innerHTML =
      "";


    if (
      allResults ===
      0
    ) {

      resultsContainer.innerHTML = `

        <div class="card">

          <h2>
            Aucun résultat trouvé
          </h2>

          <p>
            Aucun utilisateur, jeu, tribu ou article
            ne correspond à
            <strong>
              ${escapeHTML(query)}
            </strong>.
          </p>

        </div>

      `;

      return;

    }


    const groups = [

      createGroup(
        "Utilisateurs",
        users
      ),

      createGroup(
        "Jeux",
        games
      ),

      createGroup(
        "Tribus",
        tribes
      ),

      createGroup(
        "Articles",
        articles
      )

    ];


    groups.forEach(
      group => {

        if (group) {

          resultsContainer.appendChild(
            group
          );

        }

      }
    );


  } catch (error) {

    console.error(
      "Erreur pendant la recherche :",
      error
    );


    resultsContainer.innerHTML = `

      <div class="card">

        <h2>
          Une erreur est survenue
        </h2>

        <p>
          Impossible de charger les résultats
          de recherche.
        </p>

      </div>

    `;

  }

}


/* ========================= */
/* HASH */
/* ========================= */

window.addEventListener(
  "hashchange",
  performSearch
);


/* ========================= */
/* LANCEMENT */
/* ========================= */

performSearch();

</script>


<!-- ========================= -->
<!-- RECHERCHE DU HEADER -->
<!-- ========================= -->

<script>

const searchBtn =
  document.getElementById(
    "searchBtn"
  );


const searchOverlay =
  document.getElementById(
    "searchOverlay"
  );


const searchInput =
  document.getElementById(
    "searchInput"
  );


const searchResults =
  document.getElementById(
    "searchResults"
  );


const closeSearch =
  document.getElementById(
    "closeSearch"
  );


/* ========================= */
/* OUVRIR */
/* ========================= */

searchBtn.addEventListener(
  "click",
  () => {

    searchOverlay.classList.add(
      "show"
    );

    searchInput.focus();

  }
);


/* ========================= */
/* FERMER */
/* ========================= */

closeSearch.addEventListener(
  "click",
  () => {

    searchOverlay.classList.remove(
      "show"
    );

    searchInput.value = "";

    searchResults.innerHTML = "";

  }
);


/* ========================= */
/* ENTRÉE */
/* ========================= */

searchInput.addEventListener(
  "keydown",
  (event) => {

    if (
      event.key !==
      "Enter"
    ) {

      return;

    }


    const query =
      searchInput.value.trim();


    if (!query) {

      return;

    }


    window.location.href =
      "/search/#" +
      encodeURIComponent(
        query
      );

  }
);


/* ========================= */
/* CLIQUER DEHORS */
/* ========================= */

searchOverlay.addEventListener(
  "click",
  (event) => {

    if (
      event.target ===
      searchOverlay
    ) {

      searchOverlay.classList.remove(
        "show"
      );

      searchInput.value = "";

      searchResults.innerHTML = "";

    }

  }
);

</script>


<!-- ========================= -->
<!-- SERVICE WORKER -->
<!-- ========================= -->

<script>

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker.register(
        "/service-worker.js"
      );

    }
  );

}

</script>


</body>

</html>
