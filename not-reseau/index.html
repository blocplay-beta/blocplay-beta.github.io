<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlocPlay</title>

<link rel="stylesheet" href="/style.css">
</head>

<body>

<header>
  <div class="header-content">

    <a href="/" class="logo">
      <img src="/logo.ico">
    </a>

    <div class="profile-menu">
      <img src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
           class="avatar" id="avatar">

      <div class="dropdown" id="dropdown"></div>
    </div>

  </div>
</header>

<div class="container">

  <div class="card">
      <h1>📡 Pas de connexion</h1>
      <p>Impossible de charger BlocPlay sans internet.</p>

      <button onclick="openWifi()">Activer le réseau</button>
  </div>

</div>

<script>
function openWifi() {
    Android.openSettings();
}
</script>

</body>
</html>
