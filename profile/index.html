<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BlocPlay</title>

<link rel="stylesheet" href="style.css">
<link rel="icon" href="/logo.ico">

</head>

<body>

<header>
  <div class="header-content">

    <a href="/" class="logo">
      <img src="/logo.ico">
    </a>

    <div class="profile-menu">
      <img src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
           class="avatar" id="avatar">

      <div class="dropdown" id="dropdown"></div>
    </div>

  </div>
</header>

<div class="container">

  <div class="card">
      <h1>La plateforme de jeux créée par et pour les gamers</h1>
      <p>BlocPlay est actuellement en bêta.</p>

      <div id="download-container"></div>
  </div>

  <div class="card">
      <h2>Voir le site BlocPlay</h2>

      <a href="https://sites.google.com/view/blocplay-beta/accueil" class="btn btn-dark">
        Voir le site BlocPlay
      </a>
  </div>

  <div class="card">
      <h2>Discord</h2>

      <a href="https://discord.gg/TcK65JDaaC" class="btn btn-discord">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg">
        Rejoindre
      </a>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* 🔥 CONFIG FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
  storageBucket: "blocplay-a9417.firebasestorage.app",
  messagingSenderId: "540161549188",
  appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* ===================== */
/* DOWNLOAD */
/* ===================== */

const container = document.getElementById("download-container");
const userAgent = navigator.userAgent.toLowerCase();

if (userAgent.includes("android")) {
    container.innerHTML = `
    <a href="/download-blocplayinstaller-android" class="btn btn-gradient">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/android.svg">
        Installer BlocPlay
    </a>`;
    
} else if (userAgent.includes("windows")) {
    container.innerHTML = `
    <a href="/download-blocplaysetupinstaller-windows" class="btn btn-gradient">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/windows.svg">
        Installer BlocPlay
    </a>`;

} else {
    container.innerHTML = `
    <a class="btn btn-gradient">
        ❌ Non disponible
    </a>`;
}

/* ===================== */
/* MENU PROFIL FIREBASE */
/* ===================== */

const avatar = document.getElementById("avatar");
const dropdown = document.getElementById("dropdown");

function renderMenu(user) {
    if (user) {
        dropdown.innerHTML = `
            <a href="/profile">Profil</a>
            <a href="#" id="logout">Se déconnecter</a>
        `;
    } else {
        dropdown.innerHTML = `
            <a href="/login">Se connecter</a>
            <a href="/signup">Créer un compte</a>
        `;
    }
}

/* 🔐 Détection connexion */
onAuthStateChanged(auth, (user) => {
    renderMenu(user);
});

/* ouvrir / fermer */
avatar.addEventListener("click", (e) => {
    e.stopPropagation();
    dropdown.classList.toggle("show");
});

/* fermer si clic extérieur */
document.addEventListener("click", () => {
    dropdown.classList.remove("show");
});

/* logout */
document.addEventListener("click", async (e) => {
    if (e.target.id === "logout") {
        await signOut(auth);
    }
});

</script>

</body>
</html>
