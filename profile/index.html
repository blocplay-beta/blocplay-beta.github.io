<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil</title>

<link rel="stylesheet" href="/style.css">

<style>
body {
    background: #0a0f1c;
    color: white;
    font-family: "Segoe UI", sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #111827;
    border: 1px solid #1e293b;
    border-radius: 15px;
    padding: 20px;
    text-align: center;
}

.avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    margin-bottom: 10px;
}

.username {
    font-size: 22px;
    font-weight: bold;
}

.userid {
    opacity: 0.6;
    margin-bottom: 15px;
}

.btn {
    background: #3b82f6;
    padding: 10px 15px;
    border-radius: 10px;
    color: white;
    text-decoration: none;
}
</style>

</head>

<body>

<div class="container">

    <div class="card">

        <img id="avatar" class="avatar">

        <div id="username" class="username">Chargement...</div>
        <div id="userid" class="userid"></div>

        <a href="/rizoplay/home" class="btn">Retour</a>

    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* 🔥 CONFIG */
const app = initializeApp({
  apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
});

const db = getFirestore(app);
const auth = getAuth(app);

/* 🔎 PARAMS */
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

/* 🔥 LOAD PROFILE */
async function loadProfile(user) {

    let found = null;

    // ✅ CAS 1 : via ID
    if (id) {

        const q = query(collection(db, "users"), where("id", "==", Number(id)));
        const snapshot = await getDocs(q);

        if (!snapshot.empty) {
            found = snapshot.docs[0].data();
        }

    } 

    // ✅ CAS 2 : utilisateur connecté
    else {

        if (!user) {
            document.getElementById("username").innerText = "Non connecté";
            return;
        }

        const q = query(collection(db, "users"), where("email", "==", user.email));
        const snapshot = await getDocs(q);

        if (!snapshot.empty) {
            found = snapshot.docs[0].data();
        }
    }

    // ❌ introuvable
    if (!found) {
        document.getElementById("username").innerText = "Utilisateur introuvable";
        return;
    }

    // ✅ affichage
    document.getElementById("avatar").src =
        found.photoURL || `https://ui-avatars.com/api/?name=${found.displayName}`;

    document.getElementById("username").innerText = found.displayName;
    document.getElementById("userid").innerText = "ID: " + found.id;

    // 🔥 titre dynamique
    document.title = id ? "Profil de " + found.displayName : "Mon profil";
}

/* 🔐 auth */
onAuthStateChanged(auth, (user) => {
    loadProfile(user);
});

</script>

</body>
</html>
