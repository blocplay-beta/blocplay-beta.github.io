<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil - BlocPlay</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
  <div class="header-content">

    <a href="/" class="logo">
      <img src="logo.ico">
    </a>

    <div class="profile-menu">
      <img src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
           class="avatar">

    </div>

  </div>
</header>

<div class="container">

  <div class="card profile-card">

    <h1>Mon profil</h1>

    <img id="profilePic" class="profile-pic" src="https://ui-avatars.com/api/?name=User&background=222&color=fff&size=128">

    <h2 id="username">Utilisateur</h2>

    <p id="email">email@exemple.com</p>

    <button id="logoutBtn" class="btn btn-dark">Se déconnecter</button>

  </div>

</div>

<script type="module">
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

const auth = getAuth();

/* affichage user */
onAuthStateChanged(auth, (user) => {
    if (user) {
        document.getElementById("email").textContent = user.email;
        document.getElementById("username").textContent = user.displayName || "Utilisateur";
        
        if (user.photoURL) {
            document.getElementById("profilePic").src = user.photoURL;
        }
    } else {
        window.location.href = "/login";
    }
});

/* logout */
document.getElementById("logoutBtn").addEventListener("click", () => {
    signOut(auth);
});
</script>

</body>
</html>
