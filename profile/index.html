<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil - BlocPlay</title>

<img src="/logo.ico" onerror="this.src='./logo.ico'">
<link rel="stylesheet" href="/style.css">

</head>

<body>

<header>
  <div class="header-content">

    <a href="/" class="logo">
      <img src="logo.ico">
    </a>

  </div>
</header>

<div class="container">

  <div class="card profile-card">

    <h1>Mon profil</h1>

    <img id="profilePic"
         class="profile-pic"
         src="https://ui-avatars.com/api/?name=User&background=222&color=fff&size=128">

    <h2 id="username">Chargement...</h2>

    <p id="email">Chargement...</p>

    <button id="logoutBtn" class="btn btn-dark">
      Se déconnecter
    </button>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
  storageBucket: "blocplay-a9417.firebasestorage.app",
  messagingSenderId: "540161549188",
  appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* 🔐 Vérification connexion */
onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "/login";
        return;
    }

    /* ✅ Données réelles */
    document.getElementById("email").textContent = user.email;

    document.getElementById("username").textContent =
        user.displayName || "Utilisateur";

    document.getElementById("profilePic").src =
        user.photoURL || `https://ui-avatars.com/api/?name=${user.displayName || user.email}`;

});

/* 🔓 Déconnexion */
document.getElementById("logoutBtn").addEventListener("click", () => {
    signOut(auth);
});
</script>

</body>
</html>
