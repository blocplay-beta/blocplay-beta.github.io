<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil - BlocPlay</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.ico">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0f1a">

<style>
.profile-container {
    position: relative;
    display: inline-block;
}

.rizo-badge {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(255,120,0,0.7);
}
</style>

</head>

<body>

<div class="container">

  <div class="card profile-card">

    <h1>Mon profil</h1>

    <div class="profile-container">
      <img id="profilePic" class="profile-pic">
      <img src="/rizo-play.png" id="rizoBadge" class="rizo-badge" style="display:none;">
    </div>

    <h2 id="username"></h2>
    <p id="email"></p>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { getFirestore, doc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const avatar = document.getElementById("avatar");
const dropdown = document.getElementById("dropdown");

function renderMenu(user) {
    if (user) {
        dropdown.innerHTML = `
            <a href="/profile">Profil</a>
            <a href="/settings">Paramètres</a>
            <a href="#" id="logout">Se déconnecter</a>
        `;
    } else {
        dropdown.innerHTML = `
            <a href="/login">Se connecter</a>
            <a href="/signup">Créer un compte</a>
        `;
    }
}

onAuthStateChanged(auth, async (user) => {

    if (!user) {
        window.location.href = "/login/request-google?id=1885365254349732354566555495235791";
        return;
    }

    renderMenu(user);

    // 🔥 IMPORTANT : récupération Firestore par UID
    const docRef = doc(db, "users", user.uid);
    const docSnap = await getDoc(docRef);

    if (!docSnap.exists()) {
        document.getElementById("username").textContent = "Utilisateur introuvable";
        return;
    }

    const data = docSnap.data();

    document.getElementById("email").textContent = data.email;
    document.getElementById("username").textContent = data.displayName;

    document.getElementById("profilePic").src =
        data.photoURL || `https://ui-avatars.com/api/?name=${data.displayName}`;

    // 🔥 ADMIN / RIZO
    const isAdmin =
        data.email === "blocplaystudios@gmail.com" &&
        data.displayName === "BlocPlay Studios";

    if (isAdmin) {
        localStorage.setItem("rizoplay", "true");
    }

    if (localStorage.getItem("rizoplay")) {
        document.getElementById("rizoBadge").style.display = "block";
    }

});

avatar.addEventListener("click", (e) => {
    e.stopPropagation();
    dropdown.classList.toggle("show");
});

document.addEventListener("click", () => {
    dropdown.classList.remove("show");
});

document.addEventListener("click", async (e) => {
    if (e.target.id === "logout") {
        await signOut(auth);
    }
});

</script>

<script type="module" src="/login/firebase-auth.js"></script>

</body>
</html>
