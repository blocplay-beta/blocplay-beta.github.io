<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BlocPlay</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
  <div class="header-content">

    <a href="https://blocplay-beta.github.io" class="logo">
      <img src="logo.ico">
    </a>

    <div class="profile-menu">
      <img src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64" class="avatar" id="avatar">
      
      <div class="dropdown" id="dropdown"></div>
    </div>

  </div>
</header>

<div class="container">

  <div class="card">
      <h1>La plateforme de jeux créée par et pour les gamers</h1>
      <p>BlocPlay est actuellement en bêta.</p>

      <div id="download-container"></div>
  </div>

  <div class="card">
      <h2>Voir le site BlocPlay</h2>
      <a href="https://sites.google.com/view/blocplay-beta/accueil" class="btn btn-dark">
          Voir le site BlocPlay
      </a>
  </div>

  <div class="card">
      <h2>Discord</h2>
      <a href="https://discord.gg/TcK65JDaaC" class="btn btn-discord">
          Rejoindre
      </a>
  </div>

</div>

<!-- DOWNLOAD -->
<script>
const container = document.getElementById("download-container");

const userAgent = navigator.userAgent.toLowerCase();

if (userAgent.includes("android")) {
    container.innerHTML = `<a class="btn btn-gradient" href="#">Télécharger Android</a>`;
} else if (userAgent.includes("windows")) {
    container.innerHTML = `<a class="btn btn-gradient" href="#">Télécharger Windows</a>`;
} else {
    container.innerHTML = `<p>Non disponible</p>`;
}
</script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "TON_API_KEY",
  authDomain: "TON_AUTH_DOMAIN",
  projectId: "TON_PROJECT_ID",
  storageBucket: "TON_STORAGE_BUCKET",
  messagingSenderId: "TON_SENDER_ID",
  appId: "TON_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const avatar = document.getElementById("avatar");
const dropdown = document.getElementById("dropdown");

let currentUser = null;

onAuthStateChanged(auth, (user) => {
    currentUser = user;

    if (user && user.photoURL) {
        avatar.src = user.photoURL;
    } else {
        avatar.src = "https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64";
    }

    renderMenu();
});

function renderMenu() {
    if (currentUser) {
        dropdown.innerHTML = `
            <a href="#">Changer de compte</a>
            <a href="#" id="logout">Se déconnecter</a>
        `;
    } else {
        dropdown.innerHTML = `
            <a href="/login">Se connecter</a>
            <a href="/signup">Créer un compte</a>
        `;
    }
}

avatar.addEventListener("click", (e) => {
    e.stopPropagation();
    dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
});

document.addEventListener("click", () => {
    dropdown.style.display = "none";
});

document.addEventListener("click", async (e) => {
    if (e.target.id === "logout") {
        await signOut(auth);
    }
});
</script>

</body>
</html>
