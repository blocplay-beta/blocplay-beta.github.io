<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BlocPlay</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
  <div class="header-content">

    <a href="https://blocplay-beta.github.io" class="logo">
      <img src="logo.ico">
    </a>

    <div class="profile-menu">
      <img src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
           class="avatar" id="avatar">

      <div class="dropdown" id="dropdown"></div>
    </div>

  </div>
</header>

<div class="container">

  <div class="card">
      <h1>La plateforme de jeux créée par et pour les gamers</h1>
      <p>BlocPlay est actuellement en bêta.</p>

      <div id="download-container"></div>
  </div>

  <div class="card">
      <h2>Voir le site BlocPlay</h2>

      <a href="https://sites.google.com/view/blocplay-beta/accueil" class="btn btn-dark">
        Voir le site BlocPlay
      </a>
  </div>

  <div class="card">
      <h2>Discord</h2>

      <a href="https://discord.gg/TcK65JDaaC" class="btn btn-discord">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg">
        Rejoindre
      </a>
  </div>

</div>

<script>
const container = document.getElementById("download-container");
const userAgent = navigator.userAgent.toLowerCase();

if (userAgent.includes("android")) {
    container.innerHTML = `
    <a href="#" class="btn btn-gradient" id="installBtn">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/android.svg">
        Installer BlocPlay
    </a>`;
} else if (userAgent.includes("windows")) {
    container.innerHTML = `
    <a href="#" class="btn btn-gradient" id="installBtn">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/windows.svg">
        Installer BlocPlay
    </a>`;
} else {
    container.innerHTML = `
    <a class="btn btn-gradient">
        ❌ Non disponible
    </a>`;
}

/* téléchargement */
document.addEventListener("click", function(e) {
    if (e.target.id === "installBtn") {
        window.location.href = "/download";
    }
});
</script>

</body>
</html>
