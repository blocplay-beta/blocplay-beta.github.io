<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BlocPlay</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.ico">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0f1a">
<link rel="icon" href="/icon.png">

</head>

<body>

<header>
  <div class="header-content">

    <a href="/" class="logo">
      <img src="/logo.ico">
    </a>

    <div class="profile-menu">
      <img src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
           class="avatar" id="avatar">

      <div class="dropdown" id="dropdown"></div>
    </div>

  </div>
</header>

<div class="container">

<!-- CARD PRINCIPALE -->
<div class="card">
    <h1>La plateforme de jeux créée par et pour les gamers</h1>

    <p>
        BlocPlay est actuellement en bêta. Accédez à la plateforme,
        installez-la sur Windows ou Android et découvrez les expériences disponibles.
    </p>

    <div id="download-container"></div>
</div>

<!-- VOIR SITE -->
<div class="card">
    <h2>Voir le site BlocPlay</h2>

    <a href="https://sites.google.com/view/blocplay-beta/accueil" class="btn btn-dark">
        Voir le site BlocPlay
    </a>
</div>

<!-- DISCORD -->
<div class="card">
    <h2>Rejoindre le Discord</h2>

    <a href="https://discord.gg/TcK65JDaaC" class="btn btn-discord">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg" class="icon">
        Rejoindre
    </a>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
  storageBucket: "blocplay-a9417.firebasestorage.app",
  messagingSenderId: "540161549188",
  appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* MENU PROFIL */
const avatar = document.getElementById("avatar");
const dropdown = document.getElementById("dropdown");

function renderMenu(user) {
    if (user) {
        dropdown.innerHTML = `
            <a href="/profile">Profil</a>
            <a href="/settings">Paramètres</a>
            <a href="#" id="logout">Se déconnecter</a>
        `;
    } else {
        dropdown.innerHTML = `
            <a href="/login">Se connecter</a>
            <a href="/signup">Créer un compte</a>
        `;
    }
}

onAuthStateChanged(auth, (user) => {
    renderMenu(user);
});

/* MENU INTERACTION */
avatar.addEventListener("click", (e) => {
    e.stopPropagation();
    dropdown.classList.toggle("show");
});

document.addEventListener("click", () => {
    dropdown.classList.remove("show");
});

/* LOGOUT */
document.addEventListener("click", async (e) => {
    if (e.target.id === "logout") {
        await signOut(auth);
    }
});

/* DOWNLOAD BUTTON */
const container = document.getElementById("download-container");
const userAgent = navigator.userAgent.toLowerCase();

let text = "";
let link = "";
let icon = "";

if (userAgent.includes("android")) {
    text = "Télécharger BlocPlay";
    link = "/download-blocplayinstaller-android";
    icon = '<img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/android.svg" class="icon">';
} else if (userAgent.includes("windows")) {
    text = "Télécharger BlocPlay";
    link = "/download-blocplaysetupinstaller-windows";
    icon = '<img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/windows.svg" class="icon">';
} else {
    text = "Téléchargement indisponible";
    link = "#";
    icon = "❌";
}

container.innerHTML = `
<a href="${link}" class="btn btn-gradient">
${icon} ${text}
</a>
`;
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js");
}
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js")
      .then((reg) => {
        console.log("Service Worker OK :", reg.scope);
      })
      .catch((err) => {
        console.log("Service Worker ERROR :", err);
      });
  });
}
</script>

</body>
</html>
