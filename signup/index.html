<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - BlocPlay</title>

  <link rel="icon" href="logo.ico">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b0f1a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #141a2a;
      padding: 30px;
      border-radius: 15px;
      width: 300px;
    }

    h2 { text-align: center; }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg,#8b5cf6,#22d3ee);
      font-weight: bold;
      cursor: pointer;
    }

    a {
      color: #22d3ee;
      display: block;
      text-align: center;
      margin-top: 10px;
      text-decoration: none;
    }
  </style>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0f1a">

</head>
<body>

<div class="box">
  <h2>Inscription</h2>

  <input type="text" id="username" placeholder="Pseudo">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Mot de passe">

  <button onclick="signup()">Créer un compte</button>

  <a href="/login">Déjà un compte ? Se connecter</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
    authDomain: "blocplay-a9417.firebaseapp.com",
    projectId: "blocplay-a9417",
    storageBucket: "blocplay-a9417.firebasestorage.app",
    messagingSenderId: "540161549188",
    appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // ⚠️ RENDRE ACCESSIBLE AU BOUTON
  window.signup = async function () {
    const username = document.getElementById("username").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);

      await updateProfile(userCredential.user, {
        displayName: username
      });

      alert("Compte créé !");
      window.location.href = "/login";
    } catch (error) {
      alert(error.message);
    }
  }
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js");
}
</script>

</body>
</html>
