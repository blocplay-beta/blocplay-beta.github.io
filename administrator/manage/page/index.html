<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gestionnaire de pages - Adminstation BlocPlay</title>

    <link
        rel="icon"
        href="/logo.ico"
    >

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <meta
        name="theme-color"
        content="#0b0f1a"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0f1a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .admin-container {
            width: min(1100px, calc(100% - 30px));
            margin: 40px auto;
        }

        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }

        .admin-title {
            margin: 0;
            font-size: 28px;
        }

        .admin-subtitle {
            margin: 7px 0 0;
            color: #8b96a8;
            font-size: 14px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 15px;
            border-radius: 10px;
            background: #151c2b;
            border: 1px solid rgba(255,255,255,.08);
            color: white;
            text-decoration: none;
            transition: .2s;
        }

        .back-button:hover {
            background: #1c2639;
        }

        .manager-grid {
            display: grid;
            grid-template-columns: 1fr 1.35fr;
            gap: 20px;
        }

        .admin-card {
            background: #111827;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 16px;
            padding: 20px;
        }

        .admin-card h2 {
            margin: 0 0 16px;
            font-size: 18px;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 10px;
            outline: none;
            background: #0b1220;
            color: white;
            padding: 11px 12px;
            font-family: inherit;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: #3b82f6;
        }

        .field textarea {
            min-height: 280px;
            resize: vertical;
            font-family: Consolas, monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .path-preview {
            margin-top: 7px;
            padding: 9px 10px;
            border-radius: 8px;
            background: #0b1220;
            color: #7dd3fc;
            font-family: Consolas, monospace;
            font-size: 12px;
            word-break: break-all;
        }

        .create-button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px;
            background: #2563eb;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .create-button:hover {
            background: #1d4ed8;
        }

        .create-button:disabled {
            opacity: .5;
            cursor: default;
        }

        .page-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .page-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 13px;
            border-radius: 11px;
            background: #0b1220;
            border: 1px solid rgba(255,255,255,.06);
        }

        .page-info {
            min-width: 0;
        }

        .page-name {
            color: white;
            font-weight: 600;
            font-size: 14px;
            word-break: break-word;
        }

        .page-path {
            margin-top: 4px;
            color: #64748b;
            font-size: 11px;
            font-family: Consolas, monospace;
            word-break: break-all;
        }

        .page-actions {
            display: flex;
            gap: 7px;
            flex-shrink: 0;
        }

        .page-action {
            border: 0;
            border-radius: 8px;
            padding: 8px 10px;
            cursor: pointer;
            color: white;
            background: #1f2937;
        }

        .page-action:hover {
            background: #293548;
        }

        .empty {
            padding: 25px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        .status {
            display: none;
            margin-bottom: 15px;
            padding: 11px 13px;
            border-radius: 9px;
            font-size: 13px;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: rgba(34,197,94,.12);
            border: 1px solid rgba(34,197,94,.25);
            color: #86efac;
        }

        .status.error {
            background: rgba(239,68,68,.12);
            border: 1px solid rgba(239,68,68,.25);
            color: #fca5a5;
        }

        .loading {
            color: #64748b;
            text-align: center;
            padding: 20px;
            font-size: 13px;
        }

        @media (max-width: 800px) {

            .manager-grid {
                grid-template-columns: 1fr;
            }

            .admin-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .page-item {
                align-items: flex-start;
                flex-direction: column;
            }

            .page-actions {
                width: 100%;
            }

            .page-action {
                flex: 1;
            }

        }

    </style>
</head>

<body>

    <main class="admin-container">

        <div class="admin-header">

            <div>
                <h1 class="admin-title">
                    Gestionnaire de pages
                </h1>

                <p class="admin-subtitle">
                    Crée et gère les pages administratives de BlocPlay.
                </p>
            </div>

            <a
                href="/administrator/"
                class="back-button"
            >
                ← Administration
            </a>

        </div>


        <div
            id="status"
            class="status"
        ></div>


        <div class="manager-grid">


            <!-- CRÉATION -->

            <section class="admin-card">

                <h2>
                    Créer une page
                </h2>


                <div class="field">

                    <label for="pageName">
                        Nom du fichier
                    </label>

                    <input
                        id="pageName"
                        type="text"
                        placeholder="fr-profile-index.html"
                        autocomplete="off"
                    >

                </div>


                <div class="field">

                    <label>
                        Chemin de la page
                    </label>

                    <div
                        id="pathPreview"
                        class="path-preview"
                    >
                        /administrator/manage/page/
                    </div>

                </div>


                <div class="field">

                    <label for="pageTemplate">
                        Modèle
                    </label>

                    <select id="pageTemplate">

                        <option value="blank">
                            Page vide
                        </option>

                        <option value="blocplay">
                            Page BlocPlay
                        </option>

                        <option value="admin">
                            Page administration
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label for="pageContent">
                        Contenu HTML
                    </label>

                    <textarea
                        id="pageContent"
                        placeholder="Le contenu HTML de la page..."
                    ></textarea>

                </div>


                <button
                    id="createButton"
                    class="create-button"
                    type="button"
                >
                    Créer la page
                </button>

            </section>



            <!-- LISTE -->

            <section class="admin-card">

                <h2>
                    Pages existantes
                </h2>

                <div
                    id="pageList"
                    class="page-list"
                >

                    <div class="loading">
                        Chargement des pages...
                    </div>

                </div>

            </section>

        </div>

    </main>



<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    import {
        getFirestore,
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



    const firebaseConfig = {

        apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",

        authDomain: "blocplay-a9417.firebaseapp.com",

        projectId: "blocplay-a9417",

        storageBucket: "blocplay-a9417.firebasestorage.app",

        messagingSenderId: "540161549188",

        appId: "1:540161549188:web:e0ec0350bd044de2f333d1"

    };



    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);



    const pageName =
        document.getElementById("pageName");


    const pageTemplate =
        document.getElementById("pageTemplate");


    const pageContent =
        document.getElementById("pageContent");


    const pathPreview =
        document.getElementById("pathPreview");


    const createButton =
        document.getElementById("createButton");


    const pageList =
        document.getElementById("pageList");


    const status =
        document.getElementById("status");



    /*
     * ----------------------------------------------------
     * STATUT
     * ----------------------------------------------------
     */

    function showStatus(message, type = "success") {

        status.textContent =
            message;

        status.className =
            "status show " + type;

    }



    function hideStatus() {

        status.className =
            "status";

    }



    /*
     * ----------------------------------------------------
     * APERÇU DU CHEMIN
     * ----------------------------------------------------
     */

    function updatePath() {

        const name =
            pageName.value.trim();

        if (!name) {

            pathPreview.textContent =
                "/administrator/manage/page/";

            return;

        }

        pathPreview.textContent =
            "/administrator/manage/page/" + name;

    }



    pageName.addEventListener(
        "input",
        updatePath
    );



    /*
     * ----------------------------------------------------
     * MODÈLES
     * ----------------------------------------------------
     */

    pageTemplate.addEventListener(
        "change",
        () => {

            const template =
                pageTemplate.value;


            if (template === "blank") {

                pageContent.value =
`<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlocPlay</title>
    <link rel="icon" href="/logo.ico">
    <link rel="stylesheet" href="/style.css">
</head>

<body>

</body>
</html>`;

            }


            if (template === "blocplay") {

                pageContent.value =
`<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlocPlay</title>

    <link rel="icon" href="/logo.ico">
    <link rel="stylesheet" href="/style.css">

    <meta name="theme-color" content="#0b0f1a">
</head>

<body>

<header>

    <div class="header-content">

        <a href="/" class="logo">
            <img src="/icon.png" alt="BlocPlay">
        </a>

    </div>

</header>


<main class="container">

    <div class="card">

        <h1>Nouvelle page</h1>

        <p>
            Cette page a été créée depuis le gestionnaire de pages.
        </p>

    </div>

</main>

</body>
</html>`;

            }


            if (template === "admin") {

                pageContent.value =
`<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administration - BlocPlay</title>

    <link rel="icon" href="/logo.ico">
    <link rel="stylesheet" href="/style.css">

    <meta name="theme-color" content="#0b0f1a">
</head>

<body>

<main class="container">

    <div class="card">

        <h1>Nouvelle page administrative</h1>

        <p>
            Cette page a été créée depuis le gestionnaire de pages BlocPlay.
        </p>

    </div>

</main>

</body>
</html>`;

            }

        }
    );



    /*
     * ----------------------------------------------------
     * VALIDATION DU NOM
     * ----------------------------------------------------
     */

    function isValidPageName(name) {

        return /^[a-zA-Z0-9_-]+\.html$/.test(name);

    }



    /*
     * ----------------------------------------------------
     * CRÉATION
     * ----------------------------------------------------
     */

    createButton.addEventListener(
        "click",
        async () => {

            hideStatus();


            const name =
                pageName.value.trim();


            const content =
                pageContent.value;


            if (!name) {

                showStatus(
                    "Indique un nom de fichier.",
                    "error"
                );

                return;

            }


            if (!isValidPageName(name)) {

                showStatus(
                    "Le nom doit être au format exemple.html.",
                    "error"
                );

                return;

            }


            if (!content.trim()) {

                showStatus(
                    "Le contenu HTML est vide.",
                    "error"
                );

                return;

            }


            createButton.disabled =
                true;


            createButton.textContent =
                "Création...";


            try {

                /*
                 * Le navigateur ne crée pas directement
                 * le fichier dans GitHub.
                 *
                 * Cette requête sera traitée par notre
                 * backend sécurisé.
                 */

                const response =
                    await fetch(
                        "/api/admin/pages/create",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                fileName: name,

                                content: content

                            })

                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Impossible de créer la page."
                    );

                }


                showStatus(
                    "La page " +
                    name +
                    " a été créée."
                );


                pageName.value =
                    "";


                pageContent.value =
                    "";


                pageTemplate.value =
                    "blank";


                updatePath();


                await loadPages();

            }

            catch (error) {

                console.error(error);


                showStatus(
                    error.message ||
                    "Une erreur est survenue.",
                    "error"
                );

            }

            finally {

                createButton.disabled =
                    false;

                createButton.textContent =
                    "Créer la page";

            }

        }
    );



    /*
     * ----------------------------------------------------
     * LISTE DES PAGES
     * ----------------------------------------------------
     */

    async function loadPages() {

        pageList.innerHTML =
            `<div class="loading">
                Chargement des pages...
            </div>`;


        try {

            /*
             * Même principe :
             * la liste réelle des fichiers sera fournie
             * par le backend sécurisé.
             */

            const response =
                await fetch(
                    "/api/admin/pages"
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.message ||
                    "Impossible de charger les pages."
                );

            }


            const pages =
                Array.isArray(result.pages)
                    ? result.pages
                    : [];


            renderPages(pages);

        }

        catch (error) {

            console.error(error);


            pageList.innerHTML = `
                <div class="empty">
                    Impossible de charger les pages.
                </div>
            `;

        }

    }



    function renderPages(pages) {

        pageList.innerHTML =
            "";


        if (!pages.length) {

            pageList.innerHTML = `
                <div class="empty">
                    Aucune page administrative.
                </div>
            `;

            return;

        }


        pages.forEach(
            page => {

                const item =
                    document.createElement("div");

                item.className =
                    "page-item";


                const info =
                    document.createElement("div");

                info.className =
                    "page-info";


                const name =
                    document.createElement("div");

                name.className =
                    "page-name";

                name.textContent =
                    page.name;


                const path =
                    document.createElement("div");

                path.className =
                    "page-path";

                path.textContent =
                    page.path;


                info.appendChild(name);

                info.appendChild(path);


                const actions =
                    document.createElement("div");

                actions.className =
                    "page-actions";


                const openButton =
                    document.createElement("button");

                openButton.className =
                    "page-action";

                openButton.textContent =
                    "Ouvrir";


                openButton.addEventListener(
                    "click",
                    () => {

                        window.open(
                            page.path,
                            "_blank"
                        );

                    }
                );


                const editButton =
                    document.createElement("button");

                editButton.className =
                    "page-action";

                editButton.textContent =
                    "Modifier";


                editButton.addEventListener(
                    "click",
                    () => {

                        loadPageForEditing(
                            page
                        );

                    }
                );


                actions.appendChild(
                    openButton
                );

                actions.appendChild(
                    editButton
                );


                item.appendChild(info);

                item.appendChild(actions);


                pageList.appendChild(item);

            }
        );

    }



    /*
     * ----------------------------------------------------
     * MODIFICATION
     * ----------------------------------------------------
     */

    async function loadPageForEditing(page) {

        try {

            const response =
                await fetch(
                    "/api/admin/pages/content?path=" +
                    encodeURIComponent(
                        page.path
                    )
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.message ||
                    "Impossible de récupérer la page."
                );

            }


            pageName.value =
                page.name;


            pageContent.value =
                result.content || "";


            updatePath();


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


            showStatus(
                "Page chargée dans l'éditeur."
            );

        }

        catch (error) {

            showStatus(
                error.message ||
                "Impossible de charger la page.",
                "error"
            );

        }

    }



    /*
     * ----------------------------------------------------
     * AUTHENTIFICATION + RÔLE
     * ----------------------------------------------------
     */

    onAuthStateChanged(
        auth,
        async user => {

            if (!user) {

                window.location.href =
                    "/login";

                return;

            }


            try {

                const userRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                const userSnap =
                    await getDoc(userRef);


                if (!userSnap.exists()) {

                    window.location.href =
                        "/";

                    return;

                }


                const data =
                    userSnap.data();


                const role =
                    data.role;


                const allowed =
                    role === "admin" ||
                    role === "staff_site";


                if (!allowed) {

                    document.body.innerHTML = `
                        <main
                            class="admin-container"
                            style="text-align:center;"
                        >

                            <div class="admin-card">

                                <h1>
                                    Accès refusé
                                </h1>

                                <p
                                    style="
                                        color:#8b96a8;
                                        margin-top:10px;
                                    "
                                >
                                    Tu n'as pas les permissions
                                    nécessaires pour gérer les pages.
                                </p>

                                <a
                                    href="/"
                                    class="back-button"
                                    style="margin-top:20px;"
                                >
                                    Retour à BlocPlay
                                </a>

                            </div>

                        </main>
                    `;

                    return;

                }


                await loadPages();

            }

            catch (error) {

                console.error(error);

                showStatus(
                    "Impossible de vérifier les permissions.",
                    "error"
                );

            }

        }
    );

</script>

</body>
</html>
