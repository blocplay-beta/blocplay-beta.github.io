<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#0b0f1a">

    <title>Utilisateurs - Administration BlocPlay</title>

    <link rel="icon"
          href="/logo.ico">

    <link rel="stylesheet"
          href="/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0f1a;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .admin-container {
            width: min(1200px, calc(100% - 30px));
            margin: 30px auto;
        }

        .breadcrumb {
            color: #7d899c;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .breadcrumb a {
            color: #7d899c;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            color: white;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .admin-title h1 {
            margin: 0;
            font-size: 28px;
        }

        .admin-title p {
            margin: 7px 0 0;
            color: #8c98aa;
            font-size: 14px;
        }

        .admin-badge {
            background: #2563eb;
            color: white;
            padding: 8px 13px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .search-users {
            flex: 1;
            min-width: 220px;
            padding: 12px 14px;
            border-radius: 9px;
            border: 1px solid #263247;
            outline: none;
            background: #111827;
            color: white;
            font-size: 14px;
        }

        .search-users:focus {
            border-color: #2563eb;
        }

        .refresh-button {
            border: 0;
            border-radius: 9px;
            padding: 12px 16px;
            background: #1f2937;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        .refresh-button:hover {
            opacity: .85;
        }

        .users-card {
            background: #111827;
            border: 1px solid rgba(255,255,255,.06);
            border-radius: 14px;
            overflow: hidden;
        }

        .users-list {
            display: flex;
            flex-direction: column;
        }

        .user-row {
            display: grid;
            grid-template-columns: minmax(220px, 1.7fr)
                               minmax(120px, .8fr)
                               minmax(110px, .7fr)
                               auto;
            align-items: center;
            gap: 15px;
            padding: 15px 18px;
            border-bottom: 1px solid rgba(255,255,255,.05);
        }

        .user-row:last-child {
            border-bottom: 0;
        }

        .user-main {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: #1f2937;
            flex-shrink: 0;
        }

        .user-info {
            min-width: 0;
        }

        .user-name {
            font-size: 14px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-email {
            margin-top: 4px;
            color: #7d899c;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .role-select {
            width: 100%;
            padding: 9px 10px;
            border-radius: 8px;
            border: 1px solid #263247;
            background: #0b0f1a;
            color: white;
            outline: none;
        }

        .role-select:focus {
            border-color: #2563eb;
        }

        .status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: max-content;
            padding: 6px 9px;
            border-radius: 7px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-active {
            background: rgba(34,197,94,.12);
            color: #4ade80;
        }

        .status-banned {
            background: rgba(239,68,68,.12);
            color: #f87171;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 7px;
            flex-wrap: wrap;
        }

        .action-button {
            border: 0;
            border-radius: 8px;
            padding: 9px 11px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .action-button:hover {
            opacity: .85;
        }

        .reset-button {
            background: #2563eb;
        }

        .ban-button {
            background: #7f1d1d;
        }

        .unban-button {
            background: #166534;
        }

        .loading,
        .empty {
            padding: 35px;
            text-align: center;
            color: #7d899c;
        }

        .error-box {
            display: none;
            margin-bottom: 18px;
            padding: 13px 15px;
            border-radius: 10px;
            background: rgba(239,68,68,.12);
            border: 1px solid rgba(239,68,68,.25);
            color: #fca5a5;
            font-size: 13px;
        }

        .success-box {
            display: none;
            margin-bottom: 18px;
            padding: 13px 15px;
            border-radius: 10px;
            background: rgba(34,197,94,.12);
            border: 1px solid rgba(34,197,94,.25);
            color: #86efac;
            font-size: 13px;
        }

        @media (max-width: 850px) {

            .user-row {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .actions {
                justify-content: flex-start;
            }

            .role-select {
                max-width: 300px;
            }

        }

    </style>
</head>

<body>

    <div class="admin-container">

        <div class="breadcrumb">
            <a href="/">BlocPlay</a>
            /
            <a href="/administrator/">administrator</a>
            /
            <a href="/administrator/manage/">manage</a>
            /
            users
        </div>

        <div class="admin-header">

            <div class="admin-title">

                <h1>Gestion des utilisateurs</h1>

                <p>
                    Gérer les rôles, les bannissements et les comptes BlocPlay.
                </p>

            </div>

            <div class="admin-badge">
                ADMIN
            </div>

        </div>

        <div id="errorBox"
             class="error-box"></div>

        <div id="successBox"
             class="success-box"></div>

        <div class="toolbar">

            <input
                type="text"
                id="searchUsers"
                class="search-users"
                placeholder="Rechercher un utilisateur ou une adresse e-mail..."
                autocomplete="off"
            >

            <button
                id="refreshButton"
                class="refresh-button"
                type="button">
                Actualiser
            </button>

        </div>

        <div class="users-card">

            <div id="usersList"
                 class="users-list">

                <div class="loading">
                    Chargement des utilisateurs...
                </div>

            </div>

        </div>

    </div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",

    authDomain: "blocplay-a9417.firebaseapp.com",

    projectId: "blocplay-a9417",

    storageBucket: "blocplay-a9417.firebasestorage.app",

    messagingSenderId: "540161549188",

    appId: "1:540161549188:web:e0ec0350bd044de2f333d1"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


const usersList =
    document.getElementById("usersList");


const searchUsers =
    document.getElementById("searchUsers");


const refreshButton =
    document.getElementById("refreshButton");


const errorBox =
    document.getElementById("errorBox");


const successBox =
    document.getElementById("successBox");


let users = [];


function showError(message) {

    errorBox.textContent = message;

    errorBox.style.display = "block";

    successBox.style.display = "none";

}


function showSuccess(message) {

    successBox.textContent = message;

    successBox.style.display = "block";

    errorBox.style.display = "none";

    setTimeout(() => {

        successBox.style.display = "none";

    }, 4000);

}


function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function getAvatar(user) {

    if (user.photoURL) {

        return user.photoURL;

    }

    const name =
        encodeURIComponent(
            user.displayName ||
            user.username ||
            "User"
        );

    return `https://ui-avatars.com/api/?name=${name}&background=111&color=fff&rounded=true&size=96`;

}


function getRoleLabel(role) {

    switch (role) {

        case "admin":
            return "Administrateur";

        case "staff_site":
            return "Staff site";

        case "staff_roblox":
            return "Staff Roblox";

        case "staff_discord":
            return "Staff Discord";

        case "staff_application":
            return "Staff application";

        default:
            return "Utilisateur";

    }

}


function renderUsers() {

    const search =
        searchUsers.value
            .trim()
            .toLowerCase();


    const filtered =
        users.filter(user => {

            const name =
                String(
                    user.displayName ||
                    user.username ||
                    ""
                ).toLowerCase();

            const email =
                String(
                    user.email ||
                    ""
                ).toLowerCase();

            const uid =
                String(
                    user.uid ||
                    ""
                ).toLowerCase();

            return (
                name.includes(search) ||
                email.includes(search) ||
                uid.includes(search)
            );

        });


    if (!filtered.length) {

        usersList.innerHTML = `
            <div class="empty">
                Aucun utilisateur trouvé.
            </div>
        `;

        return;

    }


    usersList.innerHTML =
        filtered.map(user => {

            const banned =
                user.banned === true;

            return `

                <div class="user-row">

                    <div class="user-main">

                        <img
                            class="user-avatar"
                            src="${escapeHTML(getAvatar(user))}"
                            alt=""
                        >

                        <div class="user-info">

                            <div class="user-name">
                                ${escapeHTML(
                                    user.displayName ||
                                    user.username ||
                                    "Utilisateur"
                                )}
                            </div>

                            <div class="user-email">
                                ${escapeHTML(
                                    user.email ||
                                    user.uid
                                )}
                            </div>

                        </div>

                    </div>


                    <div>

                        <select
                            class="role-select"
                            data-role-uid="${escapeHTML(user.uid)}">

                            <option value="user"
                                ${user.role === "user" || !user.role ? "selected" : ""}>
                                Utilisateur
                            </option>

                            <option value="staff_site"
                                ${user.role === "staff_site" ? "selected" : ""}>
                                Staff site
                            </option>

                            <option value="staff_roblox"
                                ${user.role === "staff_roblox" ? "selected" : ""}>
                                Staff Roblox
                            </option>

                            <option value="staff_discord"
                                ${user.role === "staff_discord" ? "selected" : ""}>
                                Staff Discord
                            </option>

                            <option value="staff_application"
                                ${user.role === "staff_application" ? "selected" : ""}>
                                Staff application
                            </option>

                            <option value="admin"
                                ${user.role === "admin" ? "selected" : ""}>
                                Administrateur
                            </option>

                        </select>

                    </div>


                    <div>

                        <span class="status ${
                            banned
                                ? "status-banned"
                                : "status-active"
                        }">

                            ${
                                banned
                                    ? "Banni de BlocPlay"
                                    : "Actif"
                            }

                        </span>

                    </div>


                    <div class="actions">

                        <button
                            class="action-button reset-button"
                            data-reset-uid="${escapeHTML(user.uid)}">

                            Réinitialiser

                        </button>

                        ${
                            banned

                            ?

                            `<button
                                class="action-button unban-button"
                                data-ban-uid="${escapeHTML(user.uid)}"
                                data-ban-value="false">
                                Débannir
                            </button>`

                            :

                            `<button
                                class="action-button ban-button"
                                data-ban-uid="${escapeHTML(user.uid)}"
                                data-ban-value="true">
                                Bannir
                            </button>`
                        }

                    </div>

                </div>

            `;

        }).join("");


    document
        .querySelectorAll("[data-role-uid]")
        .forEach(select => {

            select.addEventListener(
                "change",
                async () => {

                    const uid =
                        select.dataset.roleUid;

                    const role =
                        select.value;

                    await changeRole(
                        uid,
                        role
                    );

                }
            );

        });


    document
        .querySelectorAll("[data-ban-uid]")
        .forEach(button => {

            button.addEventListener(
                "click",
                async () => {

                    const uid =
                        button.dataset.banUid;

                    const banned =
                        button.dataset.banValue === "true";

                    await changeBanStatus(
                        uid,
                        banned
                    );

                }
            );

        });


    document
        .querySelectorAll("[data-reset-uid]")
        .forEach(button => {

            button.addEventListener(
                "click",
                async () => {

                    const uid =
                        button.dataset.resetUid;

                    await resetPassword(uid);

                }
            );

        });

}


async function verifyAdmin(user) {

    if (!user) {

        window.location.href =
            "/login";

        return false;

    }


    try {

        const userSnapshot =
            await getDoc(
                doc(
                    db,
                    "users",
                    user.uid
                )
            );


        if (!userSnapshot.exists()) {

            window.location.href =
                "/error/404";

            return false;

        }


        const data =
            userSnapshot.data();


        if (data.role !== "admin") {

            window.location.href =
                "/error/404";

            return false;

        }


        if (data.banned === true) {

            window.location.href =
                "/error/404";

            return false;

        }


        return true;

    } catch (error) {

        console.error(error);

        window.location.href =
            "/error/404";

        return false;

    }

}


async function loadUsers() {

    usersList.innerHTML = `
        <div class="loading">
            Chargement des utilisateurs...
        </div>
    `;


    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "users"
                )
            );


        users =
            snapshot.docs.map(
                item => ({

                    uid: item.id,

                    ...item.data()

                })
            );


        users.sort(
            (a, b) => {

                const nameA =
                    String(
                        a.displayName ||
                        a.username ||
                        a.email ||
                        ""
                    ).toLowerCase();

                const nameB =
                    String(
                        b.displayName ||
                        b.username ||
                        b.email ||
                        ""
                    ).toLowerCase();

                return nameA.localeCompare(nameB);

            }
        );


        renderUsers();


    } catch (error) {

        console.error(error);

        showError(
            "Impossible de charger les utilisateurs. Vérifie les règles Firestore."
        );

        usersList.innerHTML = `
            <div class="empty">
                Impossible de charger les utilisateurs.
            </div>
        `;

    }

}


async function changeRole(uid, role) {

    if (!uid || !role) {
        return;
    }


    const target =
        users.find(
            user => user.uid === uid
        );


    if (!target) {
        return;
    }


    if (uid === auth.currentUser.uid) {

        showError(
            "Tu ne peux pas modifier ton propre rôle depuis cette page."
        );

        renderUsers();

        return;

    }


    try {

        await updateDoc(
            doc(
                db,
                "users",
                uid
            ),
            {
                role: role
            }
        );


        target.role = role;

        showSuccess(
            `Rôle modifié : ${getRoleLabel(role)}.`
        );


        renderUsers();


    } catch (error) {

        console.error(error);

        showError(
            "Impossible de modifier le rôle. Vérifie les règles Firestore."
        );

        renderUsers();

    }

}


async function changeBanStatus(uid, banned) {

    if (!uid) {
        return;
    }


    if (uid === auth.currentUser.uid) {

        showError(
            "Tu ne peux pas te bannir ou te débannir toi-même."
        );

        return;

    }


    const target =
        users.find(
            user => user.uid === uid
        );


    if (!target) {
        return;
    }


    const action =
        banned
            ? "bannir"
            : "débannir";


    const confirmed =
        confirm(
            `Voulez-vous vraiment ${action} cet utilisateur de BlocPlay ?`
        );


    if (!confirmed) {
        return;
    }


    try {

        await updateDoc(
            doc(
                db,
                "users",
                uid
            ),
            {
                banned: banned
            }
        );


        target.banned = banned;


        showSuccess(
            banned
                ? "Utilisateur banni de BlocPlay."
                : "Utilisateur débanni."
        );


        renderUsers();


    } catch (error) {

        console.error(error);

        showError(
            "Impossible de modifier le bannissement."
        );

    }

}


async function resetPassword(uid) {

    const target =
        users.find(
            user => user.uid === uid
        );


    if (!target) {
        return;
    }


    if (!target.email) {

        showError(
            "Cet utilisateur n'a pas d'adresse e-mail enregistrée."
        );

        return;

    }


    const confirmed =
        confirm(
            `Envoyer un e-mail de réinitialisation du mot de passe à ${target.email} ?`
        );


    if (!confirmed) {
        return;
    }


    try {

        await sendPasswordResetEmail(
            auth,
            target.email
        );


        showSuccess(
            `E-mail de réinitialisation envoyé à ${target.email}.`
        );


    } catch (error) {

        console.error(error);


        if (
            error.code ===
            "auth/invalid-email"
        ) {

            showError(
                "L'adresse e-mail de cet utilisateur est invalide."
            );

            return;

        }


        showError(
            "Impossible d'envoyer l'e-mail de réinitialisation."
        );

    }

}


searchUsers.addEventListener(
    "input",
    renderUsers
);


refreshButton.addEventListener(
    "click",
    loadUsers
);


onAuthStateChanged(
    auth,
    async user => {

        const allowed =
            await verifyAdmin(user);


        if (!allowed) {
            return;
        }


        await loadUsers();

    }
);

</script>

</body>
</html>
