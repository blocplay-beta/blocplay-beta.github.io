<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>RizoIA Chats</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f172a;
            color: white;
        }

        #chat {
            padding: 20px;
            height: 80vh;
            overflow-y: auto;
        }

        .message {
            margin: 10px 0;
        }

        .user {
            text-align: right;
            color: #38bdf8;
        }

        .ai {
            text-align: left;
            color: #22c55e;
        }

        #inputBar {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            padding: 10px;
            background: #020617;
        }

        #input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }

        button {
            margin-left: 10px;
            padding: 10px;
            background: #7c3aed; /* couleur RizoPlay */
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }
    </style>
</head>

<body>

<div id="chat"></div>

<div id="inputBar">
    <input id="input" placeholder="Écris un message..." />
    <button onclick="sendMessage()">Envoyer</button>
</div>

<script>
const userId = "user123";

async function sendMessage() {
    const input = document.getElementById("input");
    const message = input.value;

    if (!message) return;

    addMessage("user", message);
    input.value = "";

    const res = await fetch("https://blocplay-beta-github-io.onrender.com/ai", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message,
            userId
        })
    });

    const data = await res.json();

    addMessage("ai", data.reply);
}

function addMessage(type, text) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.innerText = text;

    document.getElementById("chat").appendChild(div);

    window.scrollTo(0, document.body.scrollHeight);
}
</script>

</body>
</html>
