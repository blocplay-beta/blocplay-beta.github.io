<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RizoIA</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #0a0f1c;
    color: white;
}

.container {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */
.sidebar {
    width: 260px;
    background: #0f172a;
    padding: 20px;
    border-right: 1px solid #1e293b;
}

.create-btn {
    width: 100%;
    padding: 12px;
    background: #3b82f6;
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    margin-bottom: 20px;
}

.chat-item {
    padding: 12px;
    background: #111827;
    margin-bottom: 10px;
    border-radius: 8px;
    cursor: pointer;
}

.chat-item:hover {
    background: #1e293b;
}

/* MAIN */
.main {
    flex: 1;
    padding: 20px;
}
</style>

</head>

<body>

<div class="container">

    <div class="sidebar">

        <button class="create-btn" onclick="createChat()">+ Créer un chat</button>

        <div id="list"></div>

    </div>

</div>

<script>

/* CRÉER CHAT */
function createChat() {
    const id = Date.now();
    location.href = "/rizoplay/ia/chat/view?id=" + id;
}

/* CHARGER CHATS */
async function loadChats() {
    try {
        const res = await fetch("/conversations");
        const data = await res.json();

        const list = document.getElementById("list");
        list.innerHTML = "";

        Object.keys(data).forEach(id => {
            const div = document.createElement("div");
            div.className = "chat-item";
            div.innerText = "Chat #" + id;

            div.onclick = () => {
                location.href = "/rizoplay/ia/chat/view?id=" + id;
            };

            list.appendChild(div);
        });

    } catch (e) {
        console.log("Erreur");
    }
}

loadChats();
</script>

</body>
</html>
