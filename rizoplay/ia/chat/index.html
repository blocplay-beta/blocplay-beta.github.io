<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RizoIA - Chat</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #0b0f19;
    color: white;
}

.container {
    display: flex;
    height: 100vh;
}

/* Sidebar */
.sidebar {
    width: 260px;
    background: #0f172a;
    padding: 20px;
    border-right: 1px solid #1e293b;
}

.sidebar h2 {
    margin-bottom: 20px;
}

.sidebar button {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    background: #1e293b;
    border: none;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

.sidebar button:hover {
    background: #334155;
}

/* Main */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* Header */
.header {
    padding: 15px;
    border-bottom: 1px solid #1e293b;
    font-weight: bold;
}

/* Chat */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.msg {
    max-width: 70%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
}

.user {
    background: #3b82f6;
    margin-left: auto;
}

.ai {
    background: #1e293b;
}

/* Input */
.inputBar {
    display: flex;
    padding: 15px;
    border-top: 1px solid #1e293b;
}

.inputBar input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    outline: none;
}

.inputBar button {
    margin-left: 10px;
    background: #3b82f6;
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}

.inputBar button:hover {
    background: #2563eb;
}
</style>

</head>

<body>

<div class="container">

    <div class="sidebar">
        <h2>RizoIA</h2>
        <button onclick="location.href='/chat'">💬 Chat</button>
        <button onclick="location.href='/view'">📁 Conversations</button>
    </div>

    <div class="main">

        <div class="header">💬 Chat</div>

        <div class="chat" id="chat"></div>

        <div class="inputBar">
            <input id="input" placeholder="Écris un message...">
            <button onclick="send()">Envoyer</button>
        </div>

    </div>

</div>

<script>
const chat = document.getElementById("chat");

function addMsg(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function send() {
    const input = document.getElementById("input");
    const text = input.value;
    if (!text) return;

    addMsg(text, "user");
    input.value = "";

    const loading = document.createElement("div");
    loading.className = "msg ai";
    loading.innerText = "⏳...";
    chat.appendChild(loading);

    try {
        const res = await fetch("/ai", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                message: text,
                userId: "user1"
            })
        });

        const data = await res.json();
        loading.innerText = data.reply;

    } catch (err) {
        loading.innerText = "❌ Erreur serveur";
    }
}
</script>

</body>
</html>
