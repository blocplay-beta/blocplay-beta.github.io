<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RizoIA - Chat</title>

<style>
:root {
    --bg: #0a0f1c;
    --panel: #0f172a;
    --panel-2: #111827;
    --border: #1e293b;
    --accent: #3b82f6;
}

body {
    margin: 0;
    font-family: "Inter", "Segoe UI", sans-serif;
    background: var(--bg);
    color: white;
}

.container {
    display: flex;
    height: 100vh;
}

/* Sidebar animation */
.sidebar {
    width: 260px;
    background: var(--panel);
    padding: 20px;
    border-right: 1px solid var(--border);
    transform: translateX(-100%);
    animation: slideIn 0.5s ease forwards;
}

@keyframes slideIn {
    from { transform: translateX(-100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

.sidebar button {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: white;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
}

.sidebar button:hover {
    background: var(--accent);
    transform: translateX(5px);
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    animation: fadeMain 0.5s ease;
}

@keyframes fadeMain {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
}

.header {
    padding: 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
    font-weight: 600;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.msg {
    max-width: 70%;
    padding: 14px;
    margin: 12px 0;
    border-radius: 14px;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.user {
    background: var(--accent);
    margin-left: auto;
}

.ai {
    background: var(--panel-2);
    border: 1px solid var(--border);
}

.inputBar {
    display: flex;
    padding: 15px;
    border-top: 1px solid var(--border);
}

.inputBar input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: white;
    outline: none;
}

.inputBar button {
    margin-left: 10px;
    background: var(--accent);
    border: none;
    padding: 12px 16px;
    border-radius: 10px;
    color: white;
    cursor: pointer;
}

.inputBar button:hover {
    transform: scale(1.05);
}
</style>

</head>

<body>

<div class="container">

    <div class="sidebar">
        <h2>RizoIA</h2>
        <button onclick="location.href='/chat'">💬 Chat</button>
        <button onclick="location.href='/view'">📁 Conversations</button>
    </div>

    <div class="main">

        <div class="header">💬 Chat</div>

        <div class="chat" id="chat"></div>

        <div class="inputBar">
            <input id="input" placeholder="Écris un message...">
            <button onclick="send()">Envoyer</button>
        </div>

    </div>

</div>

<script>
const chat = document.getElementById("chat");

function addMsg(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function send() {
    const input = document.getElementById("input");
    const text = input.value;
    if (!text) return;

    addMsg(text, "user");
    input.value = "";

    const loading = document.createElement("div");
    loading.className = "msg ai";
    loading.innerText = "⏳...";
    chat.appendChild(loading);

    try {
        const res = await fetch("/ai", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                message: text,
                userId: "user1"
            })
        });

        const data = await res.json();
        loading.innerText = data.reply;

    } catch (err) {
        loading.innerText = "❌ Erreur serveur";
    }
}
</script>

</body>
</html>
