<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RizoIA Chats</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b0f19;
    color: white;
    display: flex;
    height: 100vh;
}

/* sidebar */
.sidebar {
    width: 260px;
    background: #111827;
    padding: 10px;
    overflow-y: auto;
}

.chat-item {
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 5px;
}

.chat-item:hover {
    background: #1f2937;
}

/* main */
.main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}
</style>
</head>

<body>

<div class="sidebar">
    <h3>💬 Discussions</h3>
    <div id="list"></div>
</div>

<div class="main">
    <h2>Sélectionne une discussion</h2>
</div>

<script>
async function loadChats() {
    const res = await fetch("https://blocplay-beta-github-io.onrender.com/conversations");
    const data = await res.json();

    const list = document.getElementById("list");
    list.innerHTML = "";

    Object.keys(data).forEach(id => {
        const div = document.createElement("div");
        div.className = "chat-item";
        div.innerText = "Chat " + id;

        div.onclick = () => {
            location.href = "/rizoplay/ia/chat/view/?id=" + id;
        };

        list.appendChild(div);
    });
}

loadChats();
</script>

</body>
</html>
