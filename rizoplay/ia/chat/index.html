<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discussions</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    margin: 0;
}

h2 {
    padding: 15px;
}

.chat {
    padding: 15px;
    border-bottom: 1px solid #334155;
    cursor: pointer;
}

.chat:hover {
    background: #1e293b;
}
</style>
</head>

<body>

<h2>💬 Discussions</h2>
<div id="list">Chargement...</div>

<script>
// DEBUG ERREUR
window.onerror = function(message, source, lineno) {
    document.getElementById("list").innerText =
        "❌ Erreur JS:\n" + message + "\nLigne: " + lineno;
};

async function loadChats() {
    try {
        const res = await fetch("https://blocplay-beta-github-io.onrender.com/conversations");

        if (!res.ok) throw new Error("HTTP " + res.status);

        const data = await res.json();

        const list = document.getElementById("list");
        list.innerHTML = "";

        const keys = Object.keys(data);

        if (keys.length === 0) {
            list.innerHTML = "Aucune discussion";
            return;
        }

        keys.forEach(id => {
            const div = document.createElement("div");
            div.className = "chat";
            div.innerText = "🧠 Chat " + id;

            div.onclick = () => {
                window.location.href = "/rizoplay/ia/chat/view/?id=" + id;
            };

            list.appendChild(div);
        });

    } catch (e) {
        document.getElementById("list").innerText =
            "❌ Erreur fetch:\n" + e.message;
    }
}

loadChats();
</script>

</body>
</html>
