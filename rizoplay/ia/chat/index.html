<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chats</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
}

.chat {
    padding: 15px;
    border-bottom: 1px solid #334155;
    cursor: pointer;
}

.chat:hover {
    background: #1e293b;
}
</style>
</head>

<body>

<h2>💬 Conversations</h2>
<div id="list"></div>

<script>
async function loadChats() {
    const res = await fetch("https://blocplay-beta-github-io.onrender.com/conversations");
    const data = await res.json();

    const list = document.getElementById("list");
    list.innerHTML = "";

    Object.keys(data).forEach(id => {
        const div = document.createElement("div");
        div.className = "chat";
        div.innerText = "🧠 Chat " + id;

        div.onclick = () => {
            window.location.href = "/rizoplay/ia/chat/view/?id=" + id;
        };

        list.appendChild(div);
    });
}

loadChats();
</script>

</body>
</html>
