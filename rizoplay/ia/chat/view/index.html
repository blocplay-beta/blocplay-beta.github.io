<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Chat</title>

<style>
body {
    font-family: Arial;
    background: #020617;
    color: white;
}

.msg {
    margin: 10px;
}

.user {
    text-align: right;
    color: #38bdf8;
}

.ai {
    text-align: left;
    color: #22c55e;
}
</style>
</head>

<body>

<h2>👁️ Conversation</h2>
<div id="chat"></div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function loadChat() {
    const res = await fetch(`https://blocplay-beta-github-io.onrender.com/conversation/${id}`);
    const data = await res.json();

    const chat = document.getElementById("chat");
    chat.innerHTML = "";

    if (data.error) {
        chat.innerText = "❌ " + data.error;
        return;
    }

    data.forEach(msg => {
        const div = document.createElement("div");
        div.className = "msg " + msg.role;
        div.innerText = msg.content;
        chat.appendChild(div);
    });
}

loadChat();
</script>

</body>
</html>
