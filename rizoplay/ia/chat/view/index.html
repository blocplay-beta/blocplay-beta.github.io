<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RizoIA Chat</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b0f19;
    color: white;
    display: flex;
    height: 100vh;
}

/* layout */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* header */
.header {
    padding: 15px;
    border-bottom: 1px solid #1f2937;
    font-weight: bold;
}

/* chat */
#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

/* messages */
.msg {
    max-width: 75%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 12px;
}

.user {
    background: #2563eb;
    margin-left: auto;
}

.ai {
    background: #1f2937;
}

/* input */
.input-bar {
    padding: 15px;
    background: #111827;
    display: flex;
    gap: 10px;
    margin-bottom: 10px; /* 🔥 remonte la barre */
}

.input-bar input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
}

.input-bar button {
    background: #22c55e;
    border: none;
    padding: 12px 15px;
    border-radius: 10px;
    color: white;
}
</style>
</head>

<body>

<div class="main">

<div class="header" id="title">💬 Chat</div>

<div id="chat"></div>

<div class="input-bar">
    <input id="input" placeholder="Écris ton message...">
    <button onclick="send()">Envoyer</button>
</div>

</div>

<script>
const id = new URLSearchParams(location.search).get("id");
const chat = document.getElementById("chat");

function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
}

async function loadChat() {
    const res = await fetch(`https://blocplay-beta-github-io.onrender.com/conversation/${id}`);
    const data = await res.json();

    chat.innerHTML = "";

    data.forEach(msg => {
        const div = document.createElement("div");
        div.className = "msg " + msg.role;
        div.innerText = msg.content;
        chat.appendChild(div);
    });

    document.getElementById("title").innerText = "💬 Chat " + id;

    scrollBottom();
}

async function send() {
    const input = document.getElementById("input");
    const message = input.value;

    if (!message) return;

    input.value = "";

    const userDiv = document.createElement("div");
    userDiv.className = "msg user";
    userDiv.innerText = message;
    chat.appendChild(userDiv);

    scrollBottom();

    const res = await fetch("https://blocplay-beta-github-io.onrender.com/ai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            message: message,
            userId: id
        })
    });

    const data = await res.json();

    const aiDiv = document.createElement("div");
    aiDiv.className = "msg ai";
    aiDiv.innerText = data.reply;
    chat.appendChild(aiDiv);

    scrollBottom();
}

loadChat();
</script>

</body>
</html>
