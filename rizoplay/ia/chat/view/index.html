<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversations</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #0b0f19;
    color: white;
}

.container {
    display: flex;
    height: 100vh;
}

/* Sidebar */
.sidebar {
    width: 260px;
    background: #0f172a;
    padding: 20px;
    border-right: 1px solid #1e293b;
}

.sidebar h2 {
    margin-bottom: 20px;
}

.sidebar button {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    background: #1e293b;
    border: none;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

.sidebar button:hover {
    background: #334155;
}

/* Main */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* Header */
.header {
    padding: 15px;
    border-bottom: 1px solid #1e293b;
    font-weight: bold;
}

/* List */
.list {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.item {
    padding: 15px;
    margin-bottom: 10px;
    background: #1e293b;
    border-radius: 10px;
    cursor: pointer;
}

.item:hover {
    background: #334155;
}
</style>

</head>

<body>

<div class="container">

    <div class="sidebar">
        <h2>RizoIA</h2>
        <button onclick="location.href='/chat'">💬 Chat</button>
        <button onclick="location.href='/view'">📁 Conversations</button>
    </div>

    <div class="main">

        <div class="header">📁 Conversations</div>

        <div class="list" id="list"></div>

    </div>

</div>

<script>
async function load() {
    try {
        const res = await fetch("/conversations");
        const data = await res.json();

        const list = document.getElementById("list");
        list.innerHTML = "";

        Object.keys(data).forEach(id => {
            const div = document.createElement("div");
            div.className = "item";
            div.innerText = "Conversation " + id;

            div.onclick = () => {
                location.href = "/chat?userId=" + id;
            };

            list.appendChild(div);
        });

    } catch (err) {
        document.getElementById("list").innerText = "❌ Erreur serveur";
    }
}

load();
</script>

</body>
</html>
