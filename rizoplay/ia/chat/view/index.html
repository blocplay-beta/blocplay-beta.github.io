<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RizoIA - Chat</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/rizo.ico">

<style>

body {
  margin: 0;
  background: #0b0f1a;
  color: white;
  font-family: Arial;
}

.container {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
}

.msg {
  margin: 8px 0;
  padding: 10px;
  border-radius: 10px;
  max-width: 70%;
}

.user {
  background: #ff7a00;
  align-self: flex-end;
}

.bot {
  background: #222;
}

.input-box {
  display: flex;
  padding: 10px;
  gap: 10px;
  border-top: 1px solid #222;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
}

button {
  background: linear-gradient(135deg, #ff7a00, #ff3c00);
  border: none;
  padding: 12px 15px;
  border-radius: 10px;
  color: white;
  cursor: pointer;
}

</style>
</head>

<body>

<div class="container">

  <div id="messages" class="messages"></div>

  <div class="input-box">
    <input type="text" id="msgInput" placeholder="Écris un message...">
    <button onclick="sendMessage()">Envoyer</button>
  </div>

</div>

<script>

// 🔥 Récupération ID
const urlParams = new URLSearchParams(window.location.search);
const chatId = urlParams.get("id");

console.log("ID du chat :", chatId);

// 🔥 Récupération chats
let chats = JSON.parse(localStorage.getItem("rizoplay_chats")) || [];

// 🔥 Trouver le chat
let chat = chats.find(c => c.id === chatId);

// 🔴 Si pas trouvé
if (!chat) {
  alert("Chat introuvable");
  console.log("Chats disponibles :", chats);
}

// 🔥 UI
const messagesDiv = document.getElementById("messages");

// 🔥 Afficher messages
function renderMessages() {

  messagesDiv.innerHTML = "";

  if (!chat) return;

  chat.messages.forEach(m => {

    const div = document.createElement("div");
    div.className = "msg " + m.type;
    div.textContent = m.text;

    messagesDiv.appendChild(div);
  });

  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// 🔥 Sauvegarde
function saveChats() {
  localStorage.setItem("rizoplay_chats", JSON.stringify(chats));
}

// 🔥 Envoyer message
function sendMessage() {

  const input = document.getElementById("msgInput");
  const text = input.value.trim();

  if (!text || !chat) return;

  // user
  chat.messages.push({
    type: "user",
    text: text
  });

  // IA simple
  chat.messages.push({
    type: "bot",
    text: "🤖 RizoIA : " + text
  });

  saveChats();
  renderMessages();

  input.value = "";
}

// 🔥 Lancer affichage
renderMessages();

</script>

</body>
</html>
