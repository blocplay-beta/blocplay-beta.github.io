<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversations</title>

<style>
:root {
    --bg: #0a0f1c;
    --panel: #0f172a;
    --panel-2: #111827;
    --border: #1e293b;
    --accent: #3b82f6;
}

body {
    margin: 0;
    font-family: "Inter", "Segoe UI", sans-serif;
    background: var(--bg);
    color: white;
}

.container {
    display: flex;
    height: 100vh;
}

/* Sidebar */
.sidebar {
    width: 260px;
    background: var(--panel);
    padding: 20px;
    border-right: 1px solid var(--border);
    transform: translateX(-100%);
    animation: slideIn 0.5s ease forwards;
}

@keyframes slideIn {
    from { transform: translateX(-100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

.sidebar button {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: white;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
}

.sidebar button:hover {
    background: var(--accent);
    transform: translateX(5px);
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    animation: fadeMain 0.5s ease;
}

@keyframes fadeMain {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
}

.header {
    padding: 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
    font-weight: 600;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.item {
    padding: 15px;
    margin-bottom: 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
}

.item:hover {
    transform: translateX(5px);
    border-color: var(--accent);
}
</style>

</head>

<body>

<div class="container">

    <div class="sidebar">
        <h2>RizoIA</h2>
        <button onclick="location.href='/chat'">💬 Chat</button>
        <button onclick="location.href='/view'">📁 Conversations</button>
    </div>

    <div class="main">

        <div class="header">📁 Conversations</div>

        <div class="chat" id="list"></div>

    </div>

</div>

<script>
async function load() {
    try {
        const res = await fetch("/conversations");
        const data = await res.json();

        const list = document.getElementById("list");
        list.innerHTML = "";

        Object.keys(data).forEach(id => {
            const div = document.createElement("div");
            div.className = "item";
            div.innerText = "Conversation " + id;

            div.onclick = () => {
                location.href = "/chat?userId=" + id;
            };

            list.appendChild(div);
        });

    } catch (err) {
        document.getElementById("list").innerText = "❌ Erreur serveur";
    }
}

load();
</script>

</body>
</html>
