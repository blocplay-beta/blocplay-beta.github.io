<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/rizo.ico">

<style>
body {
  background:#0b0f1a;
  color:white;
  font-family: Arial;
}

.container {
  max-width:800px;
  margin:auto;
  padding:20px;
}

.card {
  background:#111;
  padding:20px;
  border-radius:15px;
}

.messages {
  height:400px;
  overflow-y:auto;
  margin-bottom:10px;
  padding:10px;
  background:#0f0f0f;
  border-radius:10px;
}

.message {
  margin-bottom:10px;
}

input {
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
}

button {
  margin-top:10px;
  background:linear-gradient(135deg,#ff7a00,#ff3c00);
  border:none;
  padding:12px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}
</style>

</head>

<body>

<div class="container">
  <div class="card">

    <h1 id="title">Chargement...</h1>

    <div class="messages" id="messages"></div>

    <input type="text" id="input" placeholder="Écris un message...">
    <button onclick="sendMessage()">Envoyer</button>

  </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const chatId = urlParams.get("id");

let chats = JSON.parse(localStorage.getItem("rizoplay_chats")) || [];

let chat = chats.find(c => c.id === chatId);

// 🔥 DEBUG si problème
console.log("ID:", chatId);
console.log("Chats:", chats);
console.log("Chat trouvé:", chat);

// ❌ si chat introuvable
if (!chat) {
  document.body.innerHTML = "<h2 style='color:white'>Chat introuvable ❌</h2>";
  throw new Error("Chat non trouvé");
}

// titre
document.getElementById("title").innerText = chat.name;

// afficher messages
function render() {
  const container = document.getElementById("messages");
  container.innerHTML = "";

  chat.messages.forEach(msg => {
    const div = document.createElement("div");
    div.className = "message";
    div.innerText = msg;
    container.appendChild(div);
  });

  container.scrollTop = container.scrollHeight;
}

render();

// envoyer message
function sendMessage() {
  const input = document.getElementById("input");
  const text = input.value.trim();

  if (!text) return;

  chat.messages.push(text);

  localStorage.setItem("rizoplay_chats", JSON.stringify(chats));

  input.value = "";
  render();
}
</script>

</body>
</html>
