<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversation</title>

<style>
body {
    font-family: Arial;
    background: #020617;
    color: white;
    margin: 0;
}

h2 {
    padding: 15px;
}

.msg {
    margin: 10px;
}

.user {
    text-align: right;
    color: #38bdf8;
}

.ai {
    text-align: left;
    color: #22c55e;
}
</style>
</head>

<body>

<h2>👁️ Conversation</h2>
<div id="chat">Chargement...</div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function loadChat() {
    try {
        const res = await fetch(`https://blocplay-beta-github-io.onrender.com/conversation/${id}`);
        const data = await res.json();

        const chat = document.getElementById("chat");
        chat.innerHTML = "";

        if (data.error) {
            chat.innerText = "❌ " + data.error;
            return;
        }

        data.forEach(msg => {
            const div = document.createElement("div");
            div.className = "msg " + msg.role;
            div.innerText = msg.content;
            chat.appendChild(div);
        });

    } catch (e) {
        document.getElementById("chat").innerText = "Erreur serveur ❌";
        console.error(e);
    }
}

loadChat();
</script>

</body>
</html>
