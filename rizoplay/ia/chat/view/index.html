<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RizoIA Chat</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/rizo.ico">

<style>

body {
    margin: 0;
    background: #0b0f1a;
    color: white;
    font-family: Arial;
}

.container {
    display: flex;
    flex-direction: column;
    height: 100vh;
}

.header {
    padding: 15px;
    background: #111;
    font-weight: bold;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.msg {
    margin-bottom: 10px;
    padding: 10px;
    border-radius: 10px;
    max-width: 70%;
}

.user {
    background: #ff7a00;
    margin-left: auto;
}

.bot {
    background: #222;
}

.input-box {
    display: flex;
    padding: 10px;
    background: #111;
}

input {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    outline: none;
}

button {
    margin-left: 10px;
    padding: 12px 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg,#ff7a00,#ff3c00);
    color: white;
    cursor: pointer;
}

</style>
</head>

<body>

<div class="container">

    <div class="header" id="title">RizoIA</div>

    <div class="messages" id="messages"></div>

    <div class="input-box">
        <input type="text" id="input" placeholder="Écris un message...">
        <button onclick="sendMessage()">Envoyer</button>
    </div>

</div>

<script>

// 🔥 récupération ID
const urlParams = new URLSearchParams(window.location.search);
const chatId = urlParams.get("id");

// 🔥 stockage
let chats = JSON.parse(localStorage.getItem("rizoplay_chats")) || [];
let chat = chats.find(c => c.id === chatId);

// 🔥 sécurité
if (!chat) {
    document.body.innerHTML = "<h2 style='color:white'>Chat introuvable ❌</h2>";
    throw new Error("Chat introuvable");
}

// 🔥 titre
document.getElementById("title").innerText = chat.name;

// 🔥 IA locale
function generateAIResponse(text) {

    text = text.toLowerCase();

    if (/(bonjour|salut|hello|hey)/.test(text)) {
        return "👋 Salut ! Je suis RizoIA.";
    }

    if (text.includes("ça va")) {
        return "😄 Oui ça va très bien !";
    }

    if (text.includes("blocplay")) {
        return "🎮 BlocPlay est une plateforme de jeux.";
    }

    if (text.includes("rizoplay")) {
        return "🔥 RizoPlay est la version premium de BlocPlay.";
    }

    if (text.includes("heure")) {
        return "⏰ Il est " + new Date().toLocaleTimeString();
    }

    if (text.includes("date")) {
        return "📅 Nous sommes le " + new Date().toLocaleDateString();
    }

    const calcMatch = text.match(/(\d+)\s*([\+\-\*\/])\s*(\d+)/);
    if (calcMatch) {
        const a = parseFloat(calcMatch[1]);
        const op = calcMatch[2];
        const b = parseFloat(calcMatch[3]);

        switch(op) {
            case "+": return "🧮 Résultat : " + (a + b);
            case "-": return "🧮 Résultat : " + (a - b);
            case "*": return "🧮 Résultat : " + (a * b);
            case "/": return b !== 0 ? "🧮 Résultat : " + (a / b) : "Erreur";
        }
    }

    if (text.includes("blague")) {
        return "😂 Pourquoi les devs aiment le café ? Parce que Java les réveille !";
    }

    const name = localStorage.getItem("username");
    if (text.startsWith("mon nom est")) {
        const n = text.replace("mon nom est", "").trim();
        localStorage.setItem("username", n);
        return "😊 Enchanté " + n + " !";
    }

    if (name && text.includes("bonjour")) {
        return "👋 Salut " + name + " !";
    }

    return "🤖 Je ne comprends pas encore, mais j’apprends !";
}

// 🔥 afficher messages
function render() {

    const container = document.getElementById("messages");
    container.innerHTML = "";

    chat.messages.forEach(m => {

        const div = document.createElement("div");
        div.className = "msg " + m.type;
        div.textContent = m.text;

        container.appendChild(div);
    });

    container.scrollTop = container.scrollHeight;
}

// 🔥 sauvegarde
function save() {
    localStorage.setItem("rizoplay_chats", JSON.stringify(chats));
}

// 🔥 envoyer message
function sendMessage() {

    const input = document.getElementById("input");
    const text = input.value.trim();

    if (!text) return;

    // user
    chat.messages.push({
        type: "user",
        text: text
    });

    // IA
    const response = generateAIResponse(text);

    chat.messages.push({
        type: "bot",
        text: response
    });

    save();
    render();

    input.value = "";
}

// 🔥 initialisation
render();

</script>

</body>
</html>
