<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RizoIA</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #0a0f1c;
    color: white;
}

.chat {
    height: calc(100vh - 80px);
    overflow-y: auto;
    padding: 20px;
}

.msg {
    max-width: 70%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
}

.user { background: #3b82f6; margin-left: auto; }
.ai { background: #111827; border: 1px solid #1e293b; }

.inputBar {
    display: flex;
    padding: 15px;
    border-top: 1px solid #1e293b;
}

.inputBar input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #1e293b;
    background: #0f172a;
    color: white;
}

.inputBar button {
    margin-left: 10px;
    background: #3b82f6;
    border: none;
    padding: 12px;
    border-radius: 10px;
    color: white;
    cursor: pointer;
}
</style>

</head>

<body>

<div class="chat" id="chat"></div>

<div class="inputBar">
    <input id="input" placeholder="Tape quelque chose...">
    <button onclick="send()">🟠</button>
</div>

<script>
const chat = document.getElementById("chat");
const id = new URLSearchParams(window.location.search).get("id");

/* CHARGER CHAT */
async function load() {
    const res = await fetch("/chat-data?id=" + id);
    const data = await res.json();

    chat.innerHTML = "";

    data.messages.forEach(m => {
        const div = document.createElement("div");
        div.className = "msg " + m.role;
        div.innerText = m.text;
        chat.appendChild(div);
    });
}

function addMsg(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.innerText = text;
    chat.appendChild(div);
}

/* ENVOYER */
async function send() {
    const input = document.getElementById("input");
    const text = input.value;
    if (!text) return;

    addMsg(text, "user");
    input.value = "";

    const loading = document.createElement("div");
    loading.className = "msg ai";
    loading.innerText = "⏳...";
    chat.appendChild(loading);

    const res = await fetch("/ai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            message: text,
            userId: id
        })
    });

    const data = await res.json();
    loading.innerText = data.reply;
}

load();
</script>

</body>
</html>
