<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversation</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #020617;
    color: white;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* 🔝 HEADER */
.header {
    padding: 15px;
    background: #0f172a;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 1px solid #1e293b;
}

/* 💬 CHAT */
#chat {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
}

/* message */
.msg {
    margin: 8px;
    padding: 10px;
    border-radius: 10px;
    max-width: 70%;
}

.user {
    background: #38bdf8;
    margin-left: auto;
}

.ai {
    background: #22c55e;
}

/* ⌨️ INPUT */
.input-bar {
    display: flex;
    padding: 10px;
    background: #0f172a;
    border-top: 1px solid #1e293b;
}

.input-bar input {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
}

.input-bar button {
    margin-left: 10px;
    padding: 10px 15px;
    background: #22c55e; /* couleur RizoPlay */
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
}

/* ⏳ ANIMATION RONDS */
.loader {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 40px;
}

.circle {
    width: 10px;
    height: 10px;
    margin: 5px;
    border-radius: 50%;
    background: white;
    animation: bounce 1s infinite ease-in-out;
}

.circle:nth-child(2) { animation-delay: 0.2s; }
.circle:nth-child(3) { animation-delay: 0.4s; }
.circle:nth-child(4) { animation-delay: 0.6s; }
.circle:nth-child(5) { animation-delay: 0.8s; }

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}
</style>
</head>

<body>

<div class="header" id="title">💬 Conversation</div>

<div id="chat"></div>

<!-- ⏳ Loader -->
<div id="loader" class="loader" style="display:none;">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<!-- INPUT -->
<div class="input-bar">
    <input id="input" placeholder="Écris un message...">
    <button onclick="send()">Envoyer</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const chat = document.getElementById("chat");
const loader = document.getElementById("loader");
const title = document.getElementById("title");

/* 🔴 DEBUG */
window.onerror = function(message) {
    alert("Erreur JS: " + message);
};

/* 💬 CHARGER CHAT */
async function loadChat() {
    try {
        loader.style.display = "flex";

        const res = await fetch(`https://blocplay-beta-github-io.onrender.com/conversation/${id}`);
        const data = await res.json();

        chat.innerHTML = "";

        data.forEach(msg => {
            const div = document.createElement("div");
            div.className = "msg " + msg.role;
            div.innerText = msg.content;
            chat.appendChild(div);
        });

        title.innerText = "💬 Chat " + id;

    } catch (e) {
        chat.innerText = "❌ Erreur chargement";
    } finally {
        loader.style.display = "none";
    }
}

/* 📤 ENVOYER MESSAGE */
async function send() {
    const input = document.getElementById("input");
    const message = input.value;

    if (!message) return;

    input.value = "";

    // afficher message utilisateur
    const div = document.createElement("div");
    div.className = "msg user";
    div.innerText = message;
    chat.appendChild(div);

    // loader IA
    loader.style.display = "flex";

    try {
        const res = await fetch("https://blocplay-beta-github-io.onrender.com/ai", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message,
                userId: id
            })
        });

        const data = await res.json();

        const aiDiv = document.createElement("div");
        aiDiv.className = "msg ai";
        aiDiv.innerText = data.reply;

        chat.appendChild(aiDiv);

    } catch (e) {
        alert("Erreur envoi");
    } finally {
        loader.style.display = "none";
    }
}

loadChat();
</script>

</body>
</html>
