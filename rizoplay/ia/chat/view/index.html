<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/rizo.ico">

<style>
.container {
  display:flex;
  flex-direction:column;
  height:100vh;
}

.messages {
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.msg {
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
  max-width:70%;
}

.user {
  background:#ff7a00;
  align-self:flex-end;
}

.bot {
  background:#222;
}

.input-box {
  display:flex;
  padding:10px;
  gap:10px;
}

input {
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
}

button {
  background:#ff7a00;
  border:none;
  padding:10px 15px;
  border-radius:10px;
  color:white;
}
</style>
</head>

<body>

<div class="container">

  <div id="messages" class="messages"></div>

  <div class="input-box">
    <input type="text" id="msgInput" placeholder="Message...">
    <button onclick="sendMessage()">Envoyer</button>
  </div>

</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const chatId = urlParams.get("id");

let chats = JSON.parse(localStorage.getItem("rizoplay_chats")) || [];
let chat = chats.find(c => c.id === chatId);

if (!chat) {
  alert("Chat introuvable");
  window.location.href = "/rizoplay/ia/chat/";
}

const messagesDiv = document.getElementById("messages");

function renderMessages() {
  messagesDiv.innerHTML = "";

  chat.messages.forEach(m => {
    const div = document.createElement("div");
    div.className = "msg " + m.type;
    div.textContent = m.text;
    messagesDiv.appendChild(div);
  });

  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function saveChats() {
  localStorage.setItem("rizoplay_chats", JSON.stringify(chats));
}

function sendMessage() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();

  if (!text) return;

  // message utilisateur
  chat.messages.push({ type:"user", text:text });

  // réponse IA FAKE (tu brancheras vraie IA après)
  chat.messages.push({ type:"bot", text:"🤖 Réponse RizoIA : " + text });

  saveChats();
  renderMessages();

  input.value = "";
}

renderMessages();
</script>

</body>
</html>
