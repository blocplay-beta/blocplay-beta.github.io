<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversations</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #0a0f1c;
    color: white;
}

/* HEADER TOP */
.topbar {
    display: flex;
    align-items: center;
    padding: 15px;
    border-bottom: 1px solid #1e293b;
}

.menu-btn {
    font-size: 22px;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 8px;
}

.menu-btn:hover {
    background: #1e293b;
}

/* PAGE */
.content {
    padding: 20px;
}

/* CREATE BUTTON */
.create-btn {
    width: 100%;
    padding: 14px;
    background: #3b82f6;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 20px;
}

.create-btn:hover {
    background: #2563eb;
}

/* CHAT ITEM */
.chat-item {
    padding: 15px;
    background: #111827;
    border: 1px solid #1e293b;
    border-radius: 10px;
    margin-bottom: 10px;
    cursor: pointer;
}

.chat-item:hover {
    background: #1e293b;
}

/* FULL SCREEN MENU */
.overlay {
    position: fixed;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: #0f172a;
    transition: 0.3s;
    padding: 20px;
}

.overlay.open {
    left: 0;
}

.overlay button {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    background: #1e293b;
    border: none;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

.overlay button:hover {
    background: #334155;
}
</style>

</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="menu-btn" onclick="openMenu()">☰</div>
    <h3 style="margin-left:10px;">Conversations</h3>
</div>

<!-- CONTENT -->
<div class="content">
    <button class="create-btn" onclick="createChat()">+ Créer un chat</button>
    <div id="list"></div>
</div>

<!-- MENU FULL SCREEN -->
<div class="overlay" id="menu">
    <h2>Menu</h2>

    <button onclick="location.href='/rizoplay/ia/chat'">💬 Chat</button>
    <button onclick="location.href='/rizoplay/ia/chat/view'">📁 Conversations</button>

    <button onclick="closeMenu()">❌ Fermer</button>
</div>

<script>
function openMenu() {
    document.getElementById("menu").classList.add("open");
}

function closeMenu() {
    document.getElementById("menu").classList.remove("open");
}

/* CRÉER UN CHAT */
function createChat() {
    const id = Date.now(); // ID unique simple
    location.href = "/rizoplay/ia/chat/view?id=" + id;
}

/* CHARGER LES CHATS */
async function loadChats() {
    try {
        const res = await fetch("/conversations");
        const data = await res.json();

        const list = document.getElementById("list");
        list.innerHTML = "";

        Object.keys(data).forEach(id => {
            const div = document.createElement("div");
            div.className = "chat-item";
            div.innerText = "Chat #" + id;

            div.onclick = () => {
                location.href = "/rizoplay/ia/chat/view?id=" + id;
            };

            list.appendChild(div);
        });

    } catch (err) {
        document.getElementById("list").innerText = "Erreur de chargement";
    }
}

loadChats();
</script>

</body>
</html>
