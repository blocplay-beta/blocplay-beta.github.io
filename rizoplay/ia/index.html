<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RizoIA</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f0f0f;
    color: white;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.msg {
    max-width: 70%;
    padding: 10px 15px;
    border-radius: 15px;
    margin: 10px 0;
}

.user {
    background: #2563eb;
    margin-left: auto;
}

.ai {
    background: #1f1f1f;
}

#inputBox {
    display: flex;
    padding: 10px;
    border-top: 1px solid #333;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: none;
    outline: none;
}

button {
    margin-left: 10px;
    padding: 10px 15px;
    border-radius: 20px;
    border: none;
    background: #ff4d00;
    color: white;
    cursor: pointer;
}
</style>

</head>

<body>

<div id="chat"></div>

<div id="inputBox">
    <input id="msg" placeholder="Écris un message..." />
    <button onclick="send()">Envoyer</button>
</div>

<script>
const chat = document.getElementById("chat");

function addMsg(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function send() {
    const input = document.getElementById("msg");
    const text = input.value;
    if (!text) return;

    addMsg(text, "user");
    input.value = "";

    addMsg("⏳ ...", "ai");

    const res = await fetch("https://blocplay-beta-github-io.onrender.com/ai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            message: text,
            userId: "user1"
        })
    });

    const data = await res.json();

    document.querySelector(".ai:last-child").innerText = data.reply;
}
</script>

</body>
</html>
