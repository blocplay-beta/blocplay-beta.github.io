<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RizoPlay Payment</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.ico">

<style>
body {
    margin:0;
    font-family:Arial;
}

/* LOADING */
#loading {
    position:fixed;
    width:100%;
    height:100%;
    background:#0b0f1a;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:18px;
}

/* EXISTANT */
.pay-option {
    display: block;
    margin: 10px 0;
    padding: 15px;
    border-radius: 10px;
    background: #1f2937;
    cursor: pointer;
}

.pay-option:hover {
    background: #374151;
}

.hidden {
    display: none;
}

input {
    padding: 10px;
    border-radius: 8px;
    border: none;
    width: 100%;
}

.pay-btn {
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #00c853, #00e676);
    color: white;
    font-weight: bold;
    cursor: pointer;
}
</style>

</head>

<body>

<!-- LOADING -->
<div id="loading">Loading...</div>

<header>
  <div class="header-content">

    <a href="/" class="logo">
      <img src="/icon.png">
    </a>

    <div class="profile-menu">
      <img src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
           class="avatar" id="avatar">

      <div class="dropdown" id="dropdown"></div>
    </div>

  </div>
</header>

<div class="container">

  <div class="card">

    <h1>RizoPlay Payment</h1>
    <h2>$1.99</h2>

    <div class="pay-option" onclick="selectMethod('card')">
      💳 Credit Card
    </div>

    <div class="pay-option" onclick="selectMethod('gift')">
      🎁 RizoPlay Gift Card
    </div>

    <div id="cardSection" class="hidden">
      <p>Secure payment</p>
      <button class="pay-btn" onclick="fakePay()">Pay</button>
    </div>

    <div id="giftSection" class="hidden">
      <input type="text" id="giftCode" placeholder="Enter gift code">
      <button class="pay-btn" onclick="redeemCode()">Redeem</button>
    </div>

  </div>

</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loading = document.getElementById("loading");

onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "/login";
    } else {
        loading.style.display = "none";
        renderMenu(user);
    }

});

const avatar = document.getElementById("avatar");
const dropdown = document.getElementById("dropdown");

function renderMenu(user) {

    if (user) {
        dropdown.innerHTML = `
            <a href="/profile">Profile</a>
            <a href="/settings">Settings</a>
            <a href="#" id="logout">Log out</a>
        `;
    } else {
        dropdown.innerHTML = `
            <a href="/login">Log in</a>
            <a href="/signup">Sign up</a>
        `;
    }

}

/* MENU */
avatar.addEventListener("click", (e) => {
    e.stopPropagation();
    dropdown.classList.toggle("show");
});

document.addEventListener("click", () => {
    dropdown.classList.remove("show");
});

/* LOGOUT */
document.addEventListener("click", async (e) => {
    if (e.target.id === "logout") {
        await signOut(auth);
        window.location.href = "/login";
    }
});

</script>

<script>

function selectMethod(method) {
  document.getElementById("cardSection").classList.add("hidden");
  document.getElementById("giftSection").classList.add("hidden");

  if (method === "card") {
    document.getElementById("cardSection").classList.remove("hidden");
  }

  if (method === "gift") {
    document.getElementById("giftSection").classList.remove("hidden");
  }
}

function fakePay() {
  alert("💳 Fake payment");
}

function redeemCode() {
  const code = document.getElementById("giftCode").value;

  if (code === "BP_CREATE-rizoplay") {
    alert("🎉 Valid code!");
  } else {
    alert("❌ Invalid code");
  }
}

</script>

</body>
</html>
