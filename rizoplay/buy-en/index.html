<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RizoPlay Payment</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.ico">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0f1a">

<style>
.pay-option {
    display: block;
    margin: 10px 0;
    padding: 15px;
    border-radius: 10px;
    background: #1f2937;
    cursor: pointer;
}

.hidden {
    display: none;
}

input {
    padding: 10px;
    border-radius: 8px;
    border: none;
    width: 100%;
}

.pay-btn {
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #00c853, #00e676);
    color: white;
    font-weight: bold;
}
</style>

</head>

<body>

<header>
  <div class="header-content">

    <a href="/" class="logo">
      <img src="/icon.png">
    </a>

    <div class="profile-menu">
      <img src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
           class="avatar" id="avatar">

      <div class="dropdown" id="dropdown"></div>
    </div>

  </div>
</header>

<div class="container">

  <div class="card">

    <h1>RizoPlay Payment</h1>
    <h2>$1.99</h2>

    <div class="pay-option" onclick="selectMethod('card')">
      💳 Credit Card
    </div>

    <div class="pay-option" onclick="selectMethod('gift')">
      🎁 RizoPlay Gift Card
    </div>

    <div id="cardSection" class="hidden">
      <p>Secure payment (Stripe soon)</p>
      <button class="pay-btn" onclick="fakePay()">Pay</button>
    </div>

    <div id="giftSection" class="hidden">
      <input type="text" id="giftCode" placeholder="Gift code">
      <button class="pay-btn" onclick="redeemCode()">Redeem</button>
    </div>

  </div>

</div>

<script>
function selectMethod(method) {
  document.getElementById("cardSection").classList.add("hidden");
  document.getElementById("giftSection").classList.add("hidden");

  if (method === "card") {
    document.getElementById("cardSection").classList.remove("hidden");
  }

  if (method === "gift") {
    document.getElementById("giftSection").classList.remove("hidden");
  }
}

function fakePay() {
  alert("💳 Fake payment (Stripe soon)");
}

function redeemCode() {
  const code = document.getElementById("giftCode").value;

  if (code === "RIZO-1234") {
    alert("🎉 Code valid!");
  } else {
    alert("❌ Invalid code");
  }
}
</script>

</body>
</html>
