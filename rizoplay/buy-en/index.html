<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RizoPlay - Payment</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.container {
  padding:20px;
}

.card {
  background:#1f2937;
  padding:20px;
  border-radius:12px;
  margin-top:15px;
}

.option {
  padding:15px;
  background:#374151;
  border-radius:10px;
  margin-top:10px;
  cursor:pointer;
}

button {
  padding:12px;
  border:none;
  border-radius:10px;
  background:#00c853;
  color:white;
  margin-top:10px;
  cursor:pointer;
}

input {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-top:10px;
}

.hidden {
  display:none;
}
</style>

</head>

<body>

<div class="container">

  <h1>RizoPlay Payment</h1>
  <h2>$1.99</h2>

  <div class="card">

    <div class="option" onclick="selectMethod('card')">
      💳 Credit Card
    </div>

    <div class="option" onclick="selectMethod('gift')">
      🎁 Gift Code
    </div>

    <div id="cardSection" class="hidden">
      <button onclick="fakePay()">Pay</button>
    </div>

    <div id="giftSection" class="hidden">
      <input id="code" placeholder="Enter code">
      <button onclick="checkCode()">Redeem</button>
    </div>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
  appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {

  if (!user) {
    window.location.replace("/login");
  }

});

</script>

<script>

function selectMethod(type) {

  document.getElementById("cardSection").classList.add("hidden");
  document.getElementById("giftSection").classList.add("hidden");

  if (type === "card") {
    document.getElementById("cardSection").classList.remove("hidden");
  }

  if (type === "gift") {
    document.getElementById("giftSection").classList.remove("hidden");
  }

}

function fakePay() {
  alert("💳 Fake payment");
}

function checkCode() {
  const code = document.getElementById("code").value;

  if (code === "BP_CREATE-rizoplay") {
    alert("🎉 Valid code!");
  } else {
    alert("❌ Invalid code");
  }
}

</script>

</body>
</html>
