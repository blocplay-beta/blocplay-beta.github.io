<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RizoPlay - Avantages</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/rizo.ico">

<meta name="theme-color" content="#0b0f1a">

<style>

.rizo-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.btn-rizo {
    background: linear-gradient(135deg, #ff7a00, #ff3c00);
    color: white;
    padding: 10px 20px;
    border-radius: 10px;
    text-decoration: none;
}

/* 🔥 profil identique */
.profile-box {
    display: flex;
    justify-content: center;
    margin-top: 20px;
    cursor: pointer;
    text-decoration: none;
}

.profile-wrapper {
    position: relative;
    display: inline-block;
}

.main-profile {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    display: block;
}

.rizo-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 14px;
    height: 14px;
}

/* contenu */
.container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #111;
    padding: 20px;
    border-radius: 15px;
    margin-top: 20px;
}

</style>

</head>

<body>

<header>
  <div class="header-content">

    <a href="/rizoplay/home" class="logo">
      <img src="/rizo-play.png">
    </a>

    <div class="profile-menu">
      <img src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
           class="avatar" id="avatar">

      <div class="dropdown" id="dropdown"></div>
    </div>

  </div>
</header>

<div class="container">

    <a href="/rizoplay/home" class="btn-rizo">Retour</a>

    <div class="card">

        <h1>Mes avantages</h1>

        <ul style="list-style:none; padding:0;">
            <li>Aucun avantage disponible pour le moment</li>
            <li>Contenu proposé par BlocPlay Studios</li>
            <li>© 2026 BlocPlay Studios</li>
        </ul>

    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const avatar = document.getElementById("avatar");
const dropdown = document.getElementById("dropdown");

function renderMenu(user) {
    if (user) {
        dropdown.innerHTML = `
            <a href="/profile">Profil</a>
            <a href="/settings">Paramètres</a>
            <a href="#" id="logout">Se déconnecter</a>
        `;
    } else {
        dropdown.innerHTML = `
            <a href="/login">Se connecter</a>
            <a href="/signup">Créer un compte</a>
        `;
    }
}

onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "/login";
        return;
    }

    renderMenu(user);

    const hasRizo = localStorage.getItem("rizoplay");

    if (!hasRizo) {
        window.location.href = "/rizoplay";
    }
});

/* MENU */
avatar.addEventListener("click", (e) => {
    e.stopPropagation();
    dropdown.classList.toggle("show");
});

document.addEventListener("click", () => {
    dropdown.classList.remove("show");
});

document.addEventListener("click", async (e) => {
    if (e.target.id === "logout") {
        await signOut(auth);
    }
});

</script>

</body>
</html>
