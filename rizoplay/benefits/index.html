<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RizoPlay - Avantages</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/rizo.ico">

<meta name="theme-color" content="#0b0f1a">

<style>

.container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #111;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 15px;
}

.btn-back {
    display: inline-block;
    margin-bottom: 20px;
    color: white;
    text-decoration: none;
    background: #222;
    padding: 8px 15px;
    border-radius: 8px;
}

h1 {
    color: #ff7a00;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    margin: 10px 0;
    padding: 10px;
    background: #1a1a1a;
    border-radius: 10px;
}

/* 🔥 HEADER PROFIL */
.profile-menu {
    position: relative;
}

.avatar {
    width: 40px;
    border-radius: 50%;
    cursor: pointer;
}

.dropdown {
    position: absolute;
    right: 0;
    top: 50px;
    background: #111;
    border-radius: 10px;
    display: none;
    flex-direction: column;
    min-width: 150px;
}

.dropdown a {
    padding: 10px;
    color: white;
    text-decoration: none;
}

.dropdown a:hover {
    background: #222;
}

.dropdown.show {
    display: flex;
}

.header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
}

</style>

</head>

<body>

<header>
  <div class="header-content">

    <a href="/" class="logo">
      <img src="/rizo-play.png" height="40">
    </a>

    <div class="profile-menu">
      <img src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
           class="avatar" id="avatar">

      <div class="dropdown" id="dropdown"></div>
    </div>

  </div>
</header>

<div class="container">

    <a href="/rizoplay/home" class="btn-back">← Retour</a>

    <h1>✨ Avantages RizoPlay</h1>

    <div class="card">
        <ul>
            <li>🚀 Accès à du contenu exclusif</li>
            <li>⚡ Expérience améliorée</li>
            <li>🎮 Fonctionnalités premium</li>
            <li>🔒 Accès réservé aux membres</li>
            <li>🎨 Design personnalisé</li>
        </ul>
    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const avatar = document.getElementById("avatar");
const dropdown = document.getElementById("dropdown");

/* MENU */
function renderMenu(user) {
    if (user) {
        dropdown.innerHTML = `
            <a href="/profile">Profil</a>
            <a href="/settings">Paramètres</a>
            <a href="#" id="logout">Se déconnecter</a>
        `;
    } else {
        dropdown.innerHTML = `
            <a href="/login">Se connecter</a>
            <a href="/signup">Créer un compte</a>
        `;
    }
}

onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "/login";
        return;
    }

    renderMenu(user);

    const hasRizo = localStorage.getItem("rizoplay");

    if (!hasRizo) {
        window.location.href = "/rizoplay";
    }
});

/* MENU CLICK */
avatar.addEventListener("click", (e) => {
    e.stopPropagation();
    dropdown.classList.toggle("show");
});

document.addEventListener("click", () => {
    dropdown.classList.remove("show");
});

document.addEventListener("click", async (e) => {
    if (e.target.id === "logout") {
        await signOut(auth);
    }
});

</script>

</body>
</html>
