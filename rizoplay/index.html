<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RizoPlay - Premium</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.ico">

<style>

.profile-btn {
    position: fixed;
    top: 15px;
    right: 15px;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #222;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 18px;
}

.btn-rizo {
    background: linear-gradient(135deg, #ff7a00, #ff3c00);
    color: white;
    padding: 14px 30px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: bold;
    display: inline-block;
    transition: 0.2s;
}

</style>

</head>

<body>

<!-- 👤 PROFIL (CORRIGÉ) -->
<button class="profile-btn" id="profileBtn">👤</button>

<header>
  <div class="header-content">
    <a href="/" class="logo">
      <img src="/icon.png">
    </a>
  </div>
</header>

<div class="container">

  <div class="card" style="text-align:center;">
    <img src="/rizo-play.png" style="width:120px;">
    <h1>RizoPlay</h1>
  </div>

  <div class="card" style="text-align:center;">
    <h2 id="price">1,99€</h2>

    <a href="#" id="buyBtn" class="btn-rizo">
      Payer RizoPlay
    </a>
  </div>

</div>

<script>
/* PROFIL */
document.getElementById("profileBtn").addEventListener("click", () => {
  alert("Menu profil à ouvrir ici (ou redirection vers settings)");
});

/* LANGUE */
const price = document.getElementById("price");

if (navigator.language.startsWith("en")) {
  price.textContent = "$1.99";
}

/* ACHAT */
document.getElementById("buyBtn").addEventListener("click", (e) => {
  e.preventDefault();

  if (navigator.language.startsWith("en")) {
    window.location.href = "/rizoplay/buy-en";
  } else {
    window.location.href = "/rizoplay/buy-fr";
  }
});
</script>

</body>
</html>
