<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RizoPlay</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/rizo.ico">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0f1a">

<style>

/* SECTION AVANTAGES */
.rizo-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.rizo-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

/* PROFIL */
.rizo-profile {
    position: relative;
    cursor: pointer;
}

.rizo-profile img {
    width: 60px;
    height: 60px;
    border-radius: 50%;
}

/* LOGO RIZOPLAY PETIT */
.rizo-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    width: 22px;
}

/* BOUTON VOIR PLUS */
.btn-rizo {
    background: linear-gradient(135deg, #ff7a00, #ff3c00);
    color: white;
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

</style>

</head>

<body>

<header>
  <div class="header-content">

    <a href="/" class="logo">
      <img src="/rizo-play.png">
    </a>

    <div class="profile-menu">
      <img src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
           class="avatar" id="avatar">

      <div class="dropdown" id="dropdown"></div>
    </div>

  </div>
</header>

<div class="container">

  <!-- SECTION AVANTAGES -->
  <div class="card">

    <div class="rizo-section">

      <!-- GAUCHE -->
      <div class="rizo-left">

        <div>
          <h2>Mes avantages</h2>
        </div>

        <!-- PROFIL -->
        <div class="rizo-profile" onclick="window.location.href='/profile'">

          <img id="userAvatar" src="https://ui-avatars.com/api/?name=User">

          <!-- PETIT LOGO RIZO -->
          <img src="/rizo-play.png" class="rizo-badge">

        </div>

      </div>

      <!-- DROITE -->
      <button class="btn-rizo">
        Voir plus
      </button>

    </div>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
  storageBucket: "blocplay-a9417.firebasestorage.app",
  messagingSenderId: "540161549188",
  appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const avatar = document.getElementById("avatar");
const dropdown = document.getElementById("dropdown");

/* MENU */
function renderMenu(user) {
    if (user) {
        dropdown.innerHTML = `
            <a href="/profile">Profil</a>
            <a href="/settings">Paramètres</a>
            <a href="#" id="logout">Se déconnecter</a>
        `;
    } else {
        dropdown.innerHTML = `
            <a href="/login">Se connecter</a>
            <a href="/signup">Créer un compte</a>
        `;
    }
}

/* 🔒 PROTECTION RIZOPLAY */
onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "/login";
        return;
    }

    // 👉 TEMPORAIRE : vérif localStorage (à remplacer plus tard par Firestore)
    const hasRizo = localStorage.getItem("rizoplay");

    if (!hasRizo) {
        window.location.href = "/rizoplay";
        return;
    }

    renderMenu(user);

    // Avatar dynamique
    document.getElementById("userAvatar").src =
        user.photoURL || `https://ui-avatars.com/api/?name=${user.displayName}`;
});

/* MENU */
avatar.addEventListener("click", (e) => {
    e.stopPropagation();
    dropdown.classList.toggle("show");
});

document.addEventListener("click", () => {
    dropdown.classList.remove("show");
});

/* LOGOUT */
document.addEventListener("click", async (e) => {
    if (e.target.id === "logout") {
        await signOut(auth);
        window.location.href = "/login";
    }
});

</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js");
}
</script>

</body>
</html>
