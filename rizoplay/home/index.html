<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RizoPlay - Home</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/rizo.ico">

<meta name="theme-color" content="#0b0f1a">

<style>
.profile-box {
    position: relative;
    display: inline-block;
}

.profile-box img {
    width: 50px;
    border-radius: 50%;
}

/* 🔥 badge plus petit ici */
.rizo-badge {
    position: absolute;
    top: 1px;
    right: 1px;
    width: 12px;
}
</style>

</head>

<body>

<header>
  <div class="header-content">

    <a href="/">
      <img src="/rizo-play.png" style="height:40px;">
    </a>

  </div>
</header>

<div class="container">

  <div class="card">

    <h2>Mes avantages</h2>

    <div class="profile-box">
      <img id="profilePic">
      <img src="/rizo-play.png" class="rizo-badge">
    </div>

    <button class="btn" style="margin-top:20px;">Voir plus</button>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "/login";
        return;
    }

    const isAdmin =
        user.email === "blocplaystudios@gmail.com" &&
        user.displayName === "BlocPlay Studios";

    if (isAdmin) {
        localStorage.setItem("rizoplay", "true");
    }

    const hasRizo = localStorage.getItem("rizoplay");

    if (!hasRizo) {
        window.location.href = "/rizoplay";
    }

    document.getElementById("profilePic").src =
        user.photoURL || `https://ui-avatars.com/api/?name=${user.displayName}`;
});
</script>

</body>
</html>
