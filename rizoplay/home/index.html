<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RizoPlay</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/rizo.ico">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0f1a">

<style>

/* PROFIL + BADGE */
.profile-box {
    position: relative;
    display: flex;
    align-items: center;
    gap: 15px;
}

.profile-circle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
}

/* 🔥 BADGE RIZOPLAY (FIX PETIT) */
.rizo-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(255,120,0,0.7);
}

/* BOUTON RIZO STYLE */
.btn-rizo {
    background: linear-gradient(135deg, #ff7a00, #ff3c00);
    color: white;
    padding: 10px 20px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
    border: none;
}

</style>

</head>

<body>

<header>
  <div class="header-content">

    <a href="/" class="logo">
      <img src="/rizo-play.png">
    </a>

    <div class="profile-menu">
      <img src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
           class="avatar" id="avatar">

      <div class="dropdown" id="dropdown"></div>
    </div>

  </div>
</header>

<div class="container">

  <!-- SECTION AVANTAGES -->
  <div class="card">

    <h2>Mes avantages</h2>

    <div class="profile-box">

      <!-- PROFIL -->
      <div style="position:relative; cursor:pointer;" onclick="window.location.href='/profile'">
        <img id="profilePic" class="profile-circle">
        <img src="/rizo-play.png" class="rizo-badge">
      </div>

      <!-- BOUTON -->
      <button class="btn-rizo">
        Voir plus
      </button>

    </div>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* FIREBASE (exact comme tes autres pages) */
const firebaseConfig = {
  apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
  storageBucket: "blocplay-a9417.firebasestorage.app",
  messagingSenderId: "540161549188",
  appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const avatar = document.getElementById("avatar");
const dropdown = document.getElementById("dropdown");

/* MENU */
function renderMenu(user) {
    if (user) {
        dropdown.innerHTML = `
            <a href="/profile">Profil</a>
            <a href="/settings">Paramètres</a>
            <a href="#" id="logout">Se déconnecter</a>
        `;
    } else {
        window.location.href = "/login";
    }
}

/* AUTH + CHECK RIZOPLAY */
onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "/login";
        return;
    }

    renderMenu(user);

    // 🔥 PHOTO PROFIL
    document.getElementById("profilePic").src =
        user.photoURL || `https://ui-avatars.com/api/?name=${user.displayName}`;

    // 🔥 CHECK RIZOPLAY
    const hasRizo = localStorage.getItem("rizoplay");

    if (!hasRizo) {
        window.location.href = "/rizoplay";
    }
});

/* MENU ACTIONS */
avatar.addEventListener("click", (e) => {
    e.stopPropagation();
    dropdown.classList.toggle("show");
});

document.addEventListener("click", () => {
    dropdown.classList.remove("show");
});

document.addEventListener("click", async (e) => {
    if (e.target.id === "logout") {
        await signOut(auth);
    }
});
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js");
}
</script>

</body>
</html>
