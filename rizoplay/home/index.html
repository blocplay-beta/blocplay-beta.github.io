<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RizoPlay - Accueil</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/rizo.ico">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0f1a">

<style>

.rizo-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.btn-rizo {
    background: linear-gradient(135deg, #ff7a00, #ff3c00);
    color: white;
    padding: 10px 20px;
    border-radius: 10px;
    text-decoration: none;
}

/* 🔥 centrer le profil */
.profile-box {
    display: flex;
    justify-content: center;
    margin-top: 20px;
    cursor: pointer;
    text-decoration: none;
}

.profile-wrapper {
    position: relative;
    display: inline-block;
}

/* 🔥 vrai style du profil */
.main-profile {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    display: block;
}

/* 🔥 badge petit en haut à droite */
.rizo-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 14px;
    height: 14px;
}

</style>

</head>

<body>

<header>
  <div class="header-content">

    <a href="/" class="logo">
      <img src="/rizo-play.png">
    </a>

    <div class="profile-menu">
      <img src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
           class="avatar" id="avatar">

      <div class="dropdown" id="dropdown"></div>
    </div>

  </div>
</header>

<div class="container">

  <div class="card">

    <div class="rizo-header">
      <h2>Mes avantages</h2>

      <a href="#" class="btn-rizo">Voir plus</a>
    </div>

    <!-- 🔥 PROFIL -->
    <a href="/profile" class="profile-box">
      <div class="profile-wrapper">

        <img id="profilePic" class="main-profile">

        <!-- badge -->
        <img src="/rizo-play.png" class="rizo-badge">

      </div>
    </a>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const avatar = document.getElementById("avatar");
const dropdown = document.getElementById("dropdown");

function renderMenu(user) {
    if (user) {
        dropdown.innerHTML = `
            <a href="/profile">Profil</a>
            <a href="/settings">Paramètres</a>
            <a href="#" id="logout">Se déconnecter</a>
        `;
    } else {
        dropdown.innerHTML = `
            <a href="/login">Se connecter</a>
            <a href="/signup">Créer un compte</a>
        `;
    }
}

onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "/login";
        return;
    }

    renderMenu(user);

    document.getElementById("profilePic").src =
        user.photoURL || `https://ui-avatars.com/api/?name=${user.displayName}`;

    // 🔥 ADMIN
    const isAdmin =
        user.email === "blocplaystudios@gmail.com" &&
        user.displayName === "BlocPlay Studios";

    if (isAdmin) {
        localStorage.setItem("rizoplay", "true");
    }

    const hasRizo = localStorage.getItem("rizoplay");

    if (!hasRizo) {
        window.location.href = "/rizoplay";
    }
});

/* MENU */
avatar.addEventListener("click", (e) => {
    e.stopPropagation();
    dropdown.classList.toggle("show");
});

document.addEventListener("click", () => {
    dropdown.classList.remove("show");
});

document.addEventListener("click", async (e) => {
    if (e.target.id === "logout") {
        await signOut(auth);
    }
});

</script>

</body>
</html>
