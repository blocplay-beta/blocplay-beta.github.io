<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paiement RizoPlay</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

#loadingScreen {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:20px;
  z-index:9999;
}

#content {
  display:none;
  padding:20px;
}

.card {
  background:#1f2937;
  padding:20px;
  border-radius:10px;
}

.pay-option {
  margin:10px 0;
  padding:15px;
  border-radius:10px;
  background:#374151;
  cursor:pointer;
}

.pay-btn {
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#00c853;
  color:white;
  font-weight:bold;
}

.hidden { display:none; }

input {
  padding:10px;
  border-radius:8px;
  border:none;
  width:100%;
}
</style>

</head>

<body>

<!-- 🔥 LOADING -->
<div id="loadingScreen">Chargement...</div>

<!-- 🔥 CONTENU -->
<div id="content">

  <h1>Paiement RizoPlay</h1>
  <h2>1,99€</h2>

  <div class="card">

    <div class="pay-option" onclick="selectMethod('card')">
      💳 Carte bancaire
    </div>

    <div class="pay-option" onclick="selectMethod('gift')">
      🎁 Carte cadeau
    </div>

    <div id="cardSection" class="hidden">
      <button class="pay-btn" onclick="fakePay()">Payer</button>
    </div>

    <div id="giftSection" class="hidden">
      <input type="text" id="giftCode" placeholder="Code">
      <button class="pay-btn" onclick="redeemCode()">Valider</button>
    </div>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSy...",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
});

const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {

  document.getElementById("loadingScreen").style.display = "none";

  if (!user) {
    window.location.href = "/login";
    return;
  }

  document.getElementById("content").style.display = "block";
});
</script>

<script>
function selectMethod(method) {

  document.getElementById("cardSection").classList.add("hidden");
  document.getElementById("giftSection").classList.add("hidden");

  if (method === "card") {
    document.getElementById("cardSection").classList.remove("hidden");
  }

  if (method === "gift") {
    document.getElementById("giftSection").classList.remove("hidden");
  }
}

function fakePay() {
  alert("💳 Paiement simulé");
}

function redeemCode() {
  const code = document.getElementById("giftCode").value;

  if (code === "BP_CREATE-rizoplay") {
    alert("🎉 Code valide !");
  } else {
    alert("❌ Code invalide");
  }
}
</script>

</body>
</html>
