<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paiement RizoPlay</title>

<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.ico">

<style>
.hidden { display:none; }

.pay-option {
    display:block;
    margin:10px 0;
    padding:15px;
    border-radius:10px;
    background:#1f2937;
    cursor:pointer;
}

.pay-btn {
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#00c853,#00e676);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

input {
    padding:10px;
    border-radius:8px;
    border:none;
    width:100%;
}
</style>

</head>

<body>

<header>
  <div class="header-content">
    <a href="/" class="logo"><img src="/icon.png"></a>

    <div class="profile-menu">
      <img src="https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64"
           class="avatar" id="avatar">
      <div class="dropdown" id="dropdown"></div>
    </div>
  </div>
</header>

<div class="container">

  <div class="card">

    <h1>Paiement RizoPlay</h1>
    <h2>1,99€</h2>

    <div class="pay-option" onclick="selectMethod('card')">
      💳 Carte bancaire
    </div>

    <div class="pay-option" onclick="selectMethod('gift')">
      🎁 Carte cadeau RizoPlay
    </div>

    <div id="cardSection" class="hidden">
      <p>Paiement sécurisé</p>
      <button class="pay-btn" onclick="fakePay()">Payer</button>
    </div>

    <div id="giftSection" class="hidden">
      <input type="text" id="giftCode" placeholder="Code carte cadeau">
      <button class="pay-btn" onclick="redeemCode()">Valider</button>
    </div>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "blocplay-a9417.firebaseapp.com",
  projectId: "blocplay-a9417",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* 🔥 BLOQUER SI NON CONNECTÉ */
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "/login";
  }
});
</script>

<script>
function selectMethod(method) {
  document.getElementById("cardSection").classList.add("hidden");
  document.getElementById("giftSection").classList.add("hidden");

  if (method === "card") {
    document.getElementById("cardSection").classList.remove("hidden");
  }

  if (method === "gift") {
    document.getElementById("giftSection").classList.remove("hidden");
  }
}

/* 💳 FAKE PAYMENT */
function fakePay() {
  alert("💳 Paiement simulé (à connecter plus tard)");
}

/* 🎁 CODE CADEAU */
function redeemCode() {
  const code = document.getElementById("giftCode").value;

  if (code === "BP_CREATE-rizoplay") {
    alert("🎉 Code valide ! RizoPlay activé");
  } else {
    alert("❌ Code invalide");
  }
}
</script>

</body>
</html>
