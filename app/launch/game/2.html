<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Rider - Play.Works Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #030308;
            font-family: 'Orbitron', sans-serif; user-select: none;
        }

        #game-container {
            position: relative; width: 100vw; height: 100vh;
        }

        canvas {
            display: block; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0f1026 0%, #030308 100%);
        }

        /* HUD EN JEU */
        .hud {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
            font-size: 1.3rem; pointer-events: none; z-index: 5;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }

        .hud-item { color: #fff; display: flex; align-items: center; gap: 8px; }
        .hud-gem { color: #ff007f; text-shadow: 0 0 10px #ff007f; }

        /* MENU STYLE PLAY.WORKS */
        .menu-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 8, 0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
        }

        h1.game-title {
            font-size: 4.5rem; margin: 0 0 10px 0; letter-spacing: 3px;
            color: #00f2fe;
            text-shadow: 0 0 20px #00f2fe, 0 0 40px #00f2fe;
            text-align: center; font-weight: 900;
        }

        .subtitle {
            color: #ff007f; font-size: 1.1rem; letter-spacing: 4px; margin-bottom: 30px;
            text-shadow: 0 0 10px #ff007f;
        }

        .stats-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 12px; padding: 15px 30px; margin-bottom: 30px;
            color: #a0a0c0; font-size: 1.1rem; text-align: center; line-height: 1.8;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.1);
        }

        .play-btn {
            background: #ff007f; color: #fff; border: none;
            padding: 16px 70px; font-size: 1.8rem; font-weight: 900;
            border-radius: 50px; cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase; letter-spacing: 2px;
        }

        .play-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.9);
            background: #ff3399;
        }

        .controls-tip {
            margin-top: 35px; color: #606080; font-size: 0.9rem;
            text-align: center; font-family: sans-serif; line-height: 1.5;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="neonCanvas"></canvas>
    
    <div class="hud" id="game-hud" style="display: none;">
        <div class="hud-item">SCORE: <span id="score">0</span></div>
        <div class="hud-item hud-gem">💎 <span id="gems">0</span></div>
    </div>

    <div id="menu-overlay" class="menu-overlay">
        <h1 class="game-title">NEON RIDER</h1>
        <div class="subtitle">PLAY.WORKS EDITION</div>
        
        <div class="stats-panel">
            MEILLEUR SCORE : <span id="best-score" style="color:#00f2fe;">0</span><br>
            CRISTAUX : <span id="total-gems" style="color:#ff007f;">0</span>
        </div>

        <button id="play-btn" class="play-btn">JOUER</button>

        <div class="controls-tip">
            Maintenir <b>ESPACE</b> ou <b>FLÈCHE HAUT</b> pour accélérer<br>
            <b>FLÈCHES GAUCHE / DROITE</b> pour contrôler l'équilibre et faire des flips
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
    authDomain: "blocplay-a9417.firebaseapp.com",
    projectId: "blocplay-a9417",
    storageBucket: "blocplay-a9417.firebasestorage.app",
    messagingSenderId: "540161549188",
    appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let uId = null, highscore = 0, totalGemsDB = 0;

onAuthStateChanged(auth, (u) => {
    if (u) {
        uId = u.uid;
        get(child(ref(db), `neon_rider_v7/${uId}`)).then((s) => {
            if (s.exists()) {
                highscore = s.val().best || 0;
                totalGemsDB = s.val().gems || 0;
                document.getElementById('best-score').textContent = Math.floor(highscore);
                document.getElementById('total-gems').textContent = totalGemsDB;
            }
        });
    }
});

const canvas = document.getElementById('neonCanvas');
const ctx = canvas.getContext('2d');
const menuOverlay = document.getElementById('menu-overlay');
const gameHud = document.getElementById('game-hud');

let isPlaying = false;
let score = 0;
let cameraX = 0, cameraY = 0;
let segments = [];
let diamonds = [];

const bike = {
    x: 100, y: 0,
    vx: 0, vy: 0,
    speed: 0,
    maxSpeed: 12,
    accel: 0.35,
    friction: 0.985,
    gravity: 0.3,
    angle: 0,
    isGrounded: false,
    radius: 12,
    flipTracker: 0
};

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// GENERATION DE PARCOURS SECURISEE (PAS DE SPAWN DANS LE VIDE)
function buildMap() {
    segments = [];
    diamonds = [];
    
    let cx = 0;
    let cy = canvas.height * 0.55;

    // 1. ZONE DE DEPART CONTINU DE 1200px (Garantit qu'on ne tombe jamais dans le vide au spawn)
    segments.push({ x1: cx, y1: cy, x2: cx + 1200, y2: cy });
    cx += 1200;

    for (let i = 0; i < 40; i++) {
        // Plat / Descente douce pour prendre de l'élan
        let runLength = 500 + Math.random() * 300;
        let nextY = cy + (Math.random() * 40 - 20);
        segments.push({ x1: cx, y1: cy, x2: cx + runLength, y2: nextY });
        
        // Cristaux sur le chemin
        for (let j = 1; j <= 3; j++) {
            diamonds.push({ x: cx + (j * 120), y: nextY - 20, picked: false });
        }
        
        cx += runLength;
        cy = nextY;

        // Kicker / Tremplin adouci
        let rampWidth = 120;
        let rampHeight = 35 + Math.random() * 20;
        segments.push({ x1: cx, y1: cy, x2: cx + rampWidth, y2: cy - rampHeight });
        cx += rampWidth;
        cy -= rampHeight;

        // TROU RAPPROCHÉ + PLATEFORME DE RÉCEPTION BASSE ET LARGE
        let safeGap = 130 + Math.random() * 50; // Trou très court
        let dropHeight = 90; // Réception rabaissée pour toujours arriver par le dessus

        diamonds.push({ x: cx + (safeGap / 2), y: cy + 10, picked: false });

        cx += safeGap;
        cy += dropHeight;

        // Plateforme d'atterrissage très longue pour ne pas rater
        let landWidth = 600;
        segments.push({ x1: cx, y1: cy, x2: cx + landWidth, y2: cy });
        cx += landWidth;
    }

    // Fin sans fin
    segments.push({ x1: cx, y1: cy, x2: cx + 20000, y2: cy });
}

const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function start() {
    buildMap();
    
    // Placer la moto exactement sur le sol de départ
    bike.x = 200; 
    bike.y = canvas.height * 0.55 - bike.radius - 5;
    bike.vx = 4; bike.vy = 0; bike.speed = 2;
    bike.angle = 0;
    bike.isGrounded = true;
    bike.flipTracker = 0;
    
    score = 0;
    document.getElementById('score').textContent = '0';
    document.getElementById('gems').textContent = totalGemsDB;

    menuOverlay.style.display = 'none';
    gameHud.style.display = 'flex';
    isPlaying = true;
    
    requestAnimationFrame(loop);
}

function getSurface(x) {
    for (let seg of segments) {
        if (x >= seg.x1 && x <= seg.x2) {
            let t = (x - seg.x1) / (seg.x2 - seg.x1);
            let y = seg.y1 + t * (seg.y2 - seg.y1);
            let angle = Math.atan2(seg.y2 - seg.y1, seg.x2 - seg.x1);
            return { y, angle };
        }
    }
    return null;
}

function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
}

function update() {
    if (keys['Space'] || keys['KeyW'] || keys['ArrowUp']) {
        bike.speed = Math.min(bike.speed + bike.accel, bike.maxSpeed);
    } else {
        bike.speed *= bike.friction;
    }

    if (!bike.isGrounded) {
        if (keys['ArrowLeft'] || keys['KeyA']) {
            bike.angle -= 0.1;
            bike.flipTracker -= 0.1;
        }
        if (keys['ArrowRight'] || keys['KeyD']) {
            bike.angle += 0.1;
            bike.flipTracker += 0.1;
        }

        if (Math.abs(bike.flipTracker) >= Math.PI * 2) {
            score += 1000;
            bike.flipTracker = 0;
        }
    } else {
        bike.flipTracker = 0;
    }

    if (bike.isGrounded) {
        bike.vx = Math.cos(bike.angle) * bike.speed;
        bike.vy = Math.sin(bike.angle) * bike.speed;
    } else {
        bike.vy += bike.gravity;
    }

    bike.x += bike.vx;
    bike.y += bike.vy;

    let surface = getSurface(bike.x);
    if (surface) {
        if (bike.y + bike.radius >= surface.y && bike.vy >= -0.2) {
            let diff = Math.abs(normalizeAngle(bike.angle - surface.angle));
            if (!bike.isGrounded && diff > 1.2) {
                crash();
                return;
            }

            bike.y = surface.y - bike.radius;
            bike.isGrounded = true;
            bike.angle = bike.angle * 0.3 + surface.angle * 0.7;
        } else {
            bike.isGrounded = false;
        }
    } else {
        bike.isGrounded = false;
    }

    diamonds.forEach(d => {
        if (!d.picked && Math.hypot(bike.x - d.x, bike.y - d.y) < bike.radius + 18) {
            d.picked = true;
            totalGemsDB++;
            score += 250;
            document.getElementById('gems').textContent = totalGemsDB;
        }
    });

    cameraX = bike.x - (canvas.width * 0.25);
    cameraY = cameraY * 0.88 + (bike.y - (canvas.height * 0.55)) * 0.12;

    score += bike.vx * 0.15;
    document.getElementById('score').textContent = Math.floor(score);

    if (bike.y > cameraY + canvas.height + 300) crash();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, -cameraY);

    // PISTES NEON BLEUES
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#00f2fe';
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#00f2fe';
    
    segments.forEach(seg => {
        if (seg.x2 >= cameraX - 200 && seg.x1 <= cameraX + canvas.width + 200) {
            ctx.beginPath();
            ctx.moveTo(seg.x1, seg.y1);
            ctx.lineTo(seg.x2, seg.y2);
            ctx.stroke();
        }
    });
    ctx.shadowBlur = 0;

    // CRISTAUX ROSES
    diamonds.forEach(d => {
        if (!d.picked && d.x >= cameraX - 100 && d.x <= cameraX + canvas.width + 100) {
            ctx.save();
            ctx.translate(d.x, d.y);
            ctx.fillStyle = '#ff007f';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff007f';
            ctx.beginPath();
            ctx.moveTo(0, -9); ctx.lineTo(6, 0); ctx.lineTo(0, 9); ctx.lineTo(-6, 0);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
    });
    ctx.shadowBlur = 0;

    // MOTO
    ctx.save();
    ctx.translate(bike.x, bike.y);
    ctx.rotate(bike.angle);

    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f2fe';
    ctx.fillStyle = '#00f2fe';

    // Roues
    ctx.beginPath(); ctx.arc(-15, 5, 7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(15, 5, 7, 0, Math.PI * 2); ctx.fill();

    // Corps
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-15, 5); ctx.lineTo(-4, -6); ctx.lineTo(8, -6); ctx.lineTo(15, 5);
    ctx.moveTo(-4, -6); ctx.lineTo(2, -12); ctx.lineTo(7, -6);
    ctx.stroke();

    ctx.restore();
    ctx.restore();
}

function loop() {
    if (!isPlaying) return;
    update();
    draw();
    requestAnimationFrame(loop);
}

function crash() {
    isPlaying = false;
    
    let finalScore = Math.floor(score);
    if (finalScore > highscore) highscore = finalScore;

    if (uId) {
        set(ref(db, `neon_rider_v7/${uId}`), { best: highscore, gems: totalGemsDB });
    }

    document.getElementById('best-score').textContent = highscore;
    document.getElementById('total-gems').textContent = totalGemsDB;
    document.querySelector('.game-title').textContent = "CRASH !";
    document.getElementById('play-btn').textContent = "REJOUER";

    gameHud.style.display = 'none';
    menuOverlay.style.display = 'flex';
}

document.getElementById('play-btn').addEventListener('click', start);
</script>
</body>
</html>
