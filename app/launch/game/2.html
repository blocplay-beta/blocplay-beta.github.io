<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rider - Premium Edition</title>
    <style>
        :root {
            --neon-glow: #00f2fe;
        }
        body {
            margin: 0;
            background-color: #02040a;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 960px;
            height: 540px;
            background: #050814;
            border: 2px solid #1e293b;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.15);
        }

        canvas {
            display: block;
        }

        /* HUD Élégant */
        .hud {
            position: absolute;
            top: 25px; left: 30px; right: 30px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .hud-block {
            background: rgba(5, 8, 20, 0.75);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
        }

        .highlight {
            color: var(--neon-glow);
            text-shadow: 0 0 10px var(--neon-glow);
        }

        /* Écran Game Over / Start */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 5, 12, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        h1 {
            font-size: 4rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        button {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            padding: 14px 45px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        button:hover {
            color: #000;
            background: #fff;
            box-shadow: 0 0 25px #fff;
            transform: scale(1.05);
        }

        .controls {
            position: absolute;
            bottom: 20px;
            color: #475569;
            font-size: 0.85rem;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="ctxCanvas" width="960" height="540"></canvas>
    
    <div class="hud">
        <div class="hud-block">SCORE: <span id="score" class="highlight">0</span></div>
        <div class="hud-block">💎: <span id="diamonds" style="color: #fe0979; text-shadow: 0 0 10px #fe0979;">0</span></div>
        <div class="hud-block">BEST: <span id="best">0</span></div>
    </div>

    <div id="game-over-screen" class="overlay" style="display: none;">
        <h1 id="screen-title" class="highlight">MOTO CRASHED</h1>
        <p style="color: #64748b; margin-bottom: 30px; font-size: 1.2rem;">Score final : <span id="final-score">0</span></p>
        <button id="actionBtn">RIDE ENCORE</button>
    </div>

    <div class="controls">
        [Flèche Droite] Incliner vers l'avant | [Flèche Gauche] Incliner vers l'arrière (Flips)
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// --- CONFIG FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
    authDomain: "blocplay-a9417.firebaseapp.com",
    projectId: "blocplay-a9417",
    storageBucket: "blocplay-a9417.firebasestorage.app",
    messagingSenderId: "540161549188",
    appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let userId = null, cloudBest = 0, cloudDiamonds = 0;

onAuthStateChanged(auth, (user) => {
    if (user) {
        userId = user.uid;
        get(child(ref(db), `neon_rider_pro/${userId}`)).then((s) => {
            if (s.exists()) {
                cloudBest = s.val().best || 0;
                cloudDiamonds = s.val().diamonds || 0;
                document.getElementById('best').textContent = cloudBest;
                document.getElementById('diamonds').textContent = cloudDiamonds;
            }
        });
    }
});

// --- CODE DU MOTEUR GRAPHIQUE ET PHYSIQUE ---
const canvas = document.getElementById('ctxCanvas');
const ctx = canvas.getContext('2d');

const themes = [
    { neon: '#00f2fe', bgGrad: '#041226' },
    { neon: '#fe0979', bgGrad: '#260414' },
    { neon: '#fffe00', bgGrad: '#212102' },
    { neon: '#00ff66', bgGrad: '#02210f' }
];
let currentTheme = themes[0];

let isRunning = true;
let score = 0, diamondsCollected = 0;
let particles = [], gems = [];

// Caméra fluide (Lerp)
const camera = { x: 0, y: 0, targetX: 0, targetY: 0 };

// La Moto (Physiques articulées)
const bike = {
    x: 100, y: 300,
    vx: 5.5, vy: 0,
    radius: 12,
    angle: 0,
    angularVelocity: 0,
    gravity: 0.3,
    isGrounded: false,
    flipTracker: 0
};

// Tracé vectoriel fait main d'un vrai niveau fluide (Lignes de fuite, Tremplins)
const trackPoints = [];
function buildTrack() {
    trackPoints.length = 0;
    let currX = 0, currY = 400;
    trackPoints.push({ x: currX, y: currY });

    for (let i = 0; i < 150; i++) {
        let length = 150 + Math.random() * 150;
        let type = Math.random();

        if (type < 0.3) { // Ligne droite
            currX += length;
        } else if (type < 0.65) { // Belle montée / Tremplin de saut
            currX += length;
            currY -= 60 + Math.random() * 60;
        } else { // Descente rapide
            currX += length;
            currY += 70 + Math.random() * 50;
        }
        trackPoints.push({ x: currX, y: currY });
    }
    
    // Générer les cristaux de forme losange au-dessus des bosses
    gems.length = 0;
    for (let i = 2; i < trackPoints.length - 1; i++) {
        if(Math.random() > 0.3) {
            gems.push({
                x: trackPoints[i].x - 50,
                y: trackPoints[i].y - 40 - Math.random() * 40,
                collected: false
            });
        }
    }
}

// Clavier
const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function startNewRun() {
    currentTheme = themes[Math.floor(Math.random() * themes.length)];
    document.documentElement.style.setProperty('--neon-glow', currentTheme.neon);
    
    bike.x = 100; bike.y = 250; bike.vx = 5.5; bike.vy = 0;
    bike.angle = 0; bike.angularVelocity = 0; bike.flipTracker = 0;
    score = 0; isRunning = true;
    particles = [];
    
    buildTrack();
    document.getElementById('game-over-screen').style.display = 'none';
    gameLoop();
}

// Chercher la hauteur de la piste sous la moto
function getTrackData(x) {
    for (let i = 0; i < trackPoints.length - 1; i++) {
        let p1 = trackPoints[i], p2 = trackPoints[i+1];
        if (x >= p1.x && x <= p2.x) {
            let t = (x - p1.x) / (p2.x - p1.x);
            let y = p1.y + t * (p2.y - p1.y);
            let angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
            return { y, angle };
        }
    }
    return null;
}

function update() {
    bike.vx += 0.0005; // Accélération progressive globale
    bike.x += bike.vx;
    bike.vy += bike.gravity;
    bike.y += bike.vy;

    let track = getTrackData(bike.x);

    if (track) {
        // Détection de contact avec la ligne
        if (bike.y + bike.radius >= track.y) {
            let angleDiff = Math.abs(normalizeAngle(bike.angle - track.angle));
            
            // Si l'angle d'atterrissage dépasse 80 degrés de différence = Crash direct
            if (!bike.isGrounded && angleDiff > 1.4) {
                endGame();
                return;
            }

            bike.y = track.y - bike.radius;
            bike.vy = 0;
            bike.isGrounded = true;

            // La moto épouse la pente en douceur
            bike.angle = bike.angle * 0.5 + track.angle * 0.5;
            bike.flipTracker = 0;

            // Particules de frottement au sol
            if (Math.random() > 0.4) {
                particles.push({
                    x: bike.x, y: bike.y + bike.radius,
                    vx: -bike.vx * 0.4 + (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 1) * 2,
                    size: Math.random() * 3 + 1, alpha: 1
                });
            }
        } else {
            bike.isGrounded = false;
        }
    }

    // Gestion des figures aériennes (Flips)
    if (!bike.isGrounded) {
        if (keys['ArrowLeft']) bike.angularVelocity = -0.065;
        else if (keys['ArrowRight']) bike.angularVelocity = 0.065;
        else bike.angularVelocity *= 0.95;

        bike.angle += bike.angularVelocity;
        bike.flipTracker += bike.angularVelocity;

        // Détection d'un 360° complet
        if (Math.abs(bike.flipTracker) >= Math.PI * 2) {
            score += 1000;
            bike.flipTracker = 0;
            // Éclat de particules vertes pour célébrer la figure
            for(let i=0; i<15; i++) {
                particles.push({ x: bike.x, y: bike.y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, size: 4, alpha: 1, isBonus: true });
            }
        }
    }

    // Ramassage des gemmes losanges
    gems.forEach(g => {
        if (!g.collected && Math.hypot(bike.x - g.x, bike.y - g.y) < bike.radius + 15) {
            g.collected = true;
            diamondsCollected++;
            cloudDiamonds++;
            score += 200;
            document.getElementById('diamonds').textContent = cloudDiamonds;
        }
    });

    // Nettoyage et mise à jour des effets de particules
    particles.forEach((p, idx) => {
        p.x += p.vx || 0; p.y += p.vy;
        p.alpha -= 0.02;
        if (p.alpha <= 0) particles.splice(idx, 1);
    });

    // Tracking caméra lissé (effet amorti haut de gamme)
    camera.targetX = bike.x - 250;
    camera.targetY = bike.y - 300;
    camera.x += (camera.targetX - camera.x) * 0.1;
    camera.y += (camera.targetY - camera.y) * 0.15;

    score += 0.5;
    document.getElementById('score').textContent = Math.floor(score);

    if (bike.y > 900) endGame(); // Chute fatale dans le vide
}

function draw() {
    // Fond d'écran avec dégradé dynamique propre au thème choisi
    let grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 50, canvas.width/2, canvas.height/2, 600);
    grad.addColorStop(0, currentTheme.bgGrad);
    grad.addColorStop(1, '#020306');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // 1. DESSINER LA PISTE VECTORIELLE (Effet néon nébuleux)
    ctx.beginPath();
    ctx.lineWidth = 6;
    ctx.strokeStyle = currentTheme.neon;
    ctx.shadowBlur = 15;
    ctx.shadowColor = currentTheme.neon;
    for (let i = 0; i < trackPoints.length; i++) {
        if (i === 0) ctx.moveTo(trackPoints[i].x, trackPoints[i].y);
        else ctx.lineTo(trackPoints[i].x, trackPoints[i].y);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 2. RENDU DES LOSANGES DE COLLECTION
    gems.forEach(g => {
        if (g.collected) return;
        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.fillStyle = '#fe0979';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#fe0979';
        ctx.beginPath();
        ctx.moveTo(0, -10); ctx.lineTo(7, 0); ctx.lineTo(0, 10); ctx.lineTo(-7, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    });
    ctx.shadowBlur = 0;

    // 3. EFFETS DES PARTICULES (Échappement & Poussière de pneu)
    particles.forEach(p => {
        ctx.fillStyle = p.isBonus ? '#00ff66' : currentTheme.neon;
        ctx.globalAlpha = p.alpha;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1.0;

    // 4. RENDU AVANCÉ DE LA MOTO TRON
    ctx.save();
    ctx.translate(bike.x, bike.y);
    ctx.rotate(bike.angle);
    
    ctx.shadowBlur = 15;
    ctx.shadowColor = currentTheme.neon;
    ctx.fillStyle = currentTheme.neon;

    // Roues pleines cyber
    ctx.beginPath(); ctx.arc(-18, 6, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(18, 6, 8, 0, Math.PI * 2); ctx.fill();

    // Châssis aérodynamique
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-18, 6); ctx.lineTo(-6, -8); ctx.lineTo(10, -8); ctx.lineTo(18, 6);
    ctx.closePath();
    ctx.stroke();

    ctx.restore();
    ctx.restore();
}

function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
}

function gameLoop() {
    if (!isRunning) return;
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function endGame() {
    isRunning = false;
    document.getElementById('game-over-screen').style.display = 'flex';
    document.getElementById('final-score').textContent = Math.floor(score);

    if (score > cloudBest) {
        cloudBest = Math.floor(score);
        document.getElementById('best').textContent = cloudBest;
    }
    if (userId) {
        set(ref(db, `neon_rider_pro/${userId}`), { best: cloudBest, diamonds: cloudDiamonds });
    }
}

document.getElementById('actionBtn').addEventListener('click', startNewRun);

// Premier démarrage automatique
startNewRun();
</script>
</body>
</html>
