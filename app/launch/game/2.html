<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rider - Pro Jump Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #020308;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 960px;
            height: 540px;
            background: #05070f;
            border: 3px solid var(--neon-theme, #00f2fe);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.15);
        }

        canvas {
            display: block;
        }

        .hud {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-family: monospace;
            font-size: 1.3rem;
            font-weight: bold;
            z-index: 5;
        }

        .hud-item {
            background: rgba(5, 7, 15, 0.85);
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 3, 8, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        h1 {
            font-size: 4rem;
            color: #fff;
            margin: 0 0 15px 0;
            letter-spacing: 3px;
        }

        button {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            padding: 12px 45px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #fff;
            color: #000;
            transform: scale(1.05);
        }

        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #475569;
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="neonCanvas" width="960" height="540"></canvas>
    
    <div class="hud">
        <div class="hud-item" id="score-label" style="color: #fff;">SCORE: <span id="score">0</span></div>
        <div class="hud-item" style="color: #00f2fe;">💎 <span id="gems">0</span></div>
        <div class="hud-item" style="color: #fffe00;">BEST: <span id="best">0</span></div>
    </div>

    <div id="game-overlay" class="overlay">
        <h1 id="menu-title">NEON RIDER</h1>
        <button id="actionBtn">RIDE</button>
    </div>

    <div class="controls">
        <strong style="color: #fff;">[BARRE ESPACE]</strong> Accélérer à fond | <strong style="color: #fff;">[FLÈCHE GAUCHE / DROITE]</strong> Sensibilité Max pour les Flips
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// --- CONFIGURATION CLOUD FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
    authDomain: "blocplay-a9417.firebaseapp.com",
    projectId: "blocplay-a9417",
    storageBucket: "blocplay-a9417.firebasestorage.app",
    messagingSenderId: "540161549188",
    appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let uId = null, highscore = 0, totalGems = 0;

onAuthStateChanged(auth, (u) => {
    if (u) {
        uId = u.uid;
        get(child(ref(db), `neon_rider_v5/${uId}`)).then((s) => {
            if (s.exists()) {
                highscore = s.val().best || 0;
                totalGems = s.val().gems || 0;
                document.getElementById('best').textContent = highscore;
                document.getElementById('gems').textContent = totalGems;
            }
        });
    }
});

// --- MOTEUR DE JEU ARCADE ---
const canvas = document.getElementById('neonCanvas');
const ctx = canvas.getContext('2d');

let isPlaying = false;
let score = 0;
let cameraX = 0, cameraY = 0;
let segments = [];
let diamonds = [];

// Configuration de la Moto (Ultra Réactive)
const bike = {
    x: 100, y: 200,
    vx: 0, vy: 0,
    speed: 0,
    maxSpeed: 10,       // Plus rapide pour sauter super loin
    accel: 0.3,
    friction: 0.99,
    gravity: 0.28,      // Gravité légèrement allégée en l'air pour planer
    angle: 0,
    isGrounded: false,
    radius: 14,
    flipTracker: 0
};

const themeColors = ['#00f2fe', '#fe0979', '#fffe00', '#00ff66', '#a855f7'];
let activeColor = themeColors[0];

// Génération de pistes avec Grands Espaces et Kickers Elevés
function buildMap() {
    segments = [];
    diamonds = [];
    
    let currentX = 0;
    let currentY = 400;

    // Ligne droite de départ
    segments.push({ x1: currentX, y1: currentY, x2: 500, y2: currentY });
    currentX = 500;

    for (let i = 0; i < 40; i++) {
        // 1. Longue ligne droite ou légère descente pour accumuler de la vitesse maximale
        let runUpLength = 400 + Math.random() * 200;
        let targetY = currentY + (Math.random() * 40 - 20);
        if (targetY > 450 || targetY < 250) targetY = 400;

        segments.push({ x1: currentX, y1: currentY, x2: currentX + runUpLength, y2: targetY });
        currentX += runUpLength;
        currentY = targetY;

        // Placer quelques pièces au ras du sol sur la piste
        for (let j = 1; j <= 3; j++) {
            diamonds.push({ x: currentX - (j * 80), y: currentY - 18, picked: false });
        }

        // 2. LE KICKER EXTRA HAUT (La piste monte fort juste avant le trou)
        let rampLength = 120;
        let rampHeight = 90 + Math.random() * 40; // Élévation brutale
        let rampEndX = currentX + rampLength;
        let rampEndY = currentY - rampHeight;

        segments.push({ x1: currentX, y1: currentY, x2: rampEndX, y2: rampEndY });
        currentX = rampEndX;
        currentY = rampEndY;

        // 3. ENORME ESPACE VIDE (Le gouffre pour les acrobaties)
        let massiveGap = 350 + Math.random() * 200; 
        let receptionY = currentY + 120; // La réception se situe bien plus bas pour assurer l'atterrissage

        // Des pièces idéalement positionnées sur la trajectoire de vol (parabole)
        diamonds.push({ x: currentX + (massiveGap / 3), y: currentY - 30, picked: false });
        diamonds.push({ x: currentX + (massiveGap / 2), y: currentY - 10, picked: false });
        diamonds.push({ x: currentX + (massiveGap * 1.5 / 2), y: currentY + 30, picked: false });

        currentX += massiveGap;
        currentY = receptionY;

        // Segment de réception
        segments.push({ x1: currentX, y1: currentY, x2: currentX + 250, y2: currentY });
        currentX += 250;
    }

    // Sécurité de fin de map
    segments.push({ x1: currentX, y1: currentY, x2: currentX + 5000, y2: currentY });
}

const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function start() {
    activeColor = themeColors[Math.floor(Math.random() * themeColors.length)];
    document.getElementById('game-container').style.setProperty('--neon-theme', activeColor);
    document.getElementById('score-label').style.color = activeColor;
    
    buildMap();
    
    bike.x = 150; bike.y = 350;
    bike.vx = 4; bike.vy = 0; bike.speed = 0;
    bike.angle = 0;
    bike.isGrounded = false;
    bike.flipTracker = 0;
    score = 0;
    
    document.getElementById('game-overlay').style.display = 'none';
    isPlaying = true;
    engineLoop();
}

function getSurface(x) {
    for (let seg of segments) {
        if (x >= seg.x1 && x <= seg.x2) {
            let t = (x - seg.x1) / (seg.x2 - seg.x1);
            let y = seg.y1 + t * (seg.y2 - seg.y1);
            let angle = Math.atan2(seg.y2 - seg.y1, seg.x2 - seg.x1);
            return { y, angle };
        }
    }
    return null; // Vide absolu (Trou)
}

function update() {
    // 1. Gestion de l'accélération à la Barre Espace
    if (keys['Space']) {
        bike.speed = Math.min(bike.speed + bike.accel, bike.maxSpeed);
    } else {
        bike.speed *= bike.friction;
    }

    // 2. Maniabilité ultra-sensible en plein vol
    if (!bike.isGrounded) {
        if (keys['ArrowLeft'] || keys['KeyA']) {
            bike.angle -= 0.11; // Rotation ultra rapide et franche
            bike.flipTracker -= 0.11;
        }
        if (keys['ArrowRight'] || keys['KeyD']) {
            bike.angle += 0.11;
            bike.flipTracker += 0.11;
        }

        // Calcul des acrobaties (360°)
        if (Math.abs(bike.flipTracker) >= Math.PI * 2) {
            score += 1500; // Gros bonus de figures
            bike.flipTracker = 0;
        }
    } else {
        bike.flipTracker = 0;
    }

    // Déplacement cinétique
    if (bike.isGrounded) {
        bike.vx = Math.cos(bike.angle) * bike.speed;
        bike.vy = Math.sin(bike.angle) * bike.speed;
    } else {
        bike.vy += bike.gravity; // Chute libre balistique sans aimant
    }

    bike.x += bike.vx;
    bike.y += bike.vy;

    // Collision stricte avec les segments de route
    let surface = getSurface(bike.x);
    if (surface) {
        // La moto touche la route uniquement si elle arrive par le dessus
        if (bike.y + bike.radius >= surface.y && bike.vy >= -0.1) {
            
            // Si la bécane tape sur le toit ou l'arrière de biais = Crash immédiat
            let diff = Math.abs(normalizeAngle(bike.angle - surface.angle));
            if (!bike.isGrounded && diff > 1.1) {
                crash();
                return;
            }

            bike.y = surface.y - bike.radius;
            bike.isGrounded = true;
            bike.angle = bike.angle * 0.3 + surface.angle * 0.7; // Épouse parfaitement le sol
        } else {
            bike.isGrounded = false;
        }
    } else {
        bike.isGrounded = false; // Suspension dans le vide
    }

    // Collecte des losanges ajustés
    diamonds.forEach(d => {
        if (!d.picked && Math.hypot(bike.x - d.x, bike.y - d.y) < bike.radius + 18) {
            d.picked = true;
            totalGems++;
            score += 250;
            document.getElementById('gems').textContent = totalGems;
        }
    });

    // Caméra de poursuite lissée centrée
    cameraX = bike.x - 250;
    cameraY = cameraY * 0.9 + (bike.y - 280) * 0.1;

    score += bike.vx * 0.15;
    document.getElementById('score').textContent = Math.floor(score);

    // Si tu tombes au fond du gouffre, aucune aide : c'est perdu !
    if (bike.y > 750) crash();
}

function draw() {
    ctx.fillStyle = '#03050a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, -cameraY);

    // 1. Rendu des circuits vectoriels
    ctx.lineWidth = 6;
    ctx.strokeStyle = activeColor;
    ctx.shadowBlur = 16;
    ctx.shadowColor = activeColor;
    
    segments.forEach(seg => {
        if (seg.x2 >= cameraX - 100 && seg.x1 <= cameraX + canvas.width + 100) {
            ctx.beginPath();
            ctx.moveTo(seg.x1, seg.y1);
            ctx.lineTo(seg.x2, seg.y2);
            ctx.stroke();
        }
    });
    ctx.shadowBlur = 0;

    // 2. Rendu des pièces de monnaie (Losanges rabaissés)
    diamonds.forEach(d => {
        if (d.picked) return;
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.fillStyle = '#00f2fe';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00f2fe';
        ctx.beginPath();
        ctx.moveTo(0, -9); ctx.lineTo(6, 0); ctx.lineTo(0, 9); ctx.lineTo(-6, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    });
    ctx.shadowBlur = 0;

    // 3. Rendu de la Véritable Moto
    ctx.save();
    ctx.translate(bike.x, bike.y);
    ctx.rotate(bike.angle);

    ctx.shadowBlur = 12;
    ctx.shadowColor = activeColor;
    ctx.fillStyle = activeColor;

    // Roues Cyber indépendantes
    ctx.beginPath(); ctx.arc(-16, 5, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(16, 5, 8, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    // Corps de la Moto Sportive
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-16, 5); ctx.lineTo(-4, -7); ctx.lineTo(8, -7); ctx.lineTo(16, 5);
    ctx.moveTo(-4, -7); ctx.lineTo(2, -14); ctx.lineTo(7, -7); // Guidon de pilotage
    ctx.stroke();

    ctx.restore();
    ctx.restore();
}

function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
}

function engineLoop() {
    if (!isPlaying) return;
    update();
    draw();
    requestAnimationFrame(engineLoop);
}

function crash() {
    isPlaying = false;
    document.getElementById('menu-title').textContent = "CRASH !";
    document.getElementById('actionBtn').textContent = "RE-TENTER LE RUN";
    document.getElementById('game-overlay').style.display = 'flex';

    if (score > highscore) {
        highscore = Math.floor(score);
        document.getElementById('best').textContent = highscore;
    }
    if (uId) {
        set(ref(db, `neon_rider_v5/${uId}`), { best: highscore, gems: totalGems });
    }
}

document.getElementById('actionBtn').addEventListener('click', start);
</script>
</body>
</html>
