<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rider - TV Arcade Edition</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #0c0014;
            color: #fff; font-family: 'Impact', 'Arial Black', sans-serif; user-select: none;
        }

        #game-container {
            position: relative; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #240046 0%, #0c0014 100%);
        }

        canvas { display: block; width: 100%; height: 100%; }

        .hud {
            position: absolute; top: 25px; left: 30px; right: 30px;
            display: flex; justify-content: space-between;
            pointer-events: none; z-index: 5;
        }

        .score-display {
            font-size: 3.5rem; color: #fff; font-weight: 900;
            text-shadow: 3px 3px 0px #000;
        }

        .gems-display {
            font-size: 2.5rem; color: #d000ff;
            text-shadow: 2px 2px 0px #000;
            display: flex; align-items: center; gap: 10px;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(12, 0, 20, 0.85);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
        }

        .menu-box {
            background: #1a0033; border: 4px solid #d000ff;
            padding: 40px; border-radius: 20px; text-align: center;
            box-shadow: 0 0 30px rgba(208, 0, 255, 0.4);
            max-width: 500px;
        }

        h1 { font-size: 4rem; margin: 0 0 10px 0; color: #00f2fe; text-shadow: 0 0 20px #00f2fe; }
        p { font-size: 1.5rem; color: #ff007f; margin-bottom: 30px; text-transform: uppercase; }
        
        button {
            background: #d000ff; color: #fff; border: none;
            padding: 15px 50px; font-size: 2rem; font-weight: bold; cursor: pointer;
            border-radius: 10px; box-shadow: 0 5px 0 #800080; text-transform: uppercase;
        }
        button:hover { background: #e033ff; }
        button:active { transform: translateY(4px); box-shadow: 0 1px 0 #800080; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="neonCanvas"></canvas>
    
    <div class="hud">
        <div id="score" class="score-display">0</div>
        <div class="gems-display">
            <span id="gems">0</span> <span style="font-size: 3rem;">♦</span>
        </div>
    </div>

    <div id="game-overlay" class="overlay">
        <div class="menu-box">
            <h1 id="menu-title">NEON RIDER</h1>
            <p id="menu-sub">Arcade Playworks Edition</p>
            <button id="actionBtn">PLAY</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('neonCanvas');
const ctx = canvas.getContext('2d');

let isPlaying = false;
let score = 0;
let gemsCollected = 0;
let cameraX = 0, cameraY = 0;
let trackPoints = [];
let diamonds = [];
let obstacles = [];

// Moto jaune originale de la vidéo avec une physique de grip et de poids réaliste
const bike = {
    x: 150, y: 300,
    vx: 0, vy: 0,
    speed: 0,
    maxSpeed: 10,
    maxReverse: -3,
    accel: 0.18,
    friction: 0.98,
    gravity: 0.45,
    angle: 0,
    angularVelocity: 0,
    isGrounded: false,
    radius: 15
};

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Génération de la piste rouge fluide continue (comme sur la vidéo)
function generateTrack() {
    trackPoints = [];
    diamonds = [];
    obstacles = [];

    let cx = 0;
    let cy = canvas.height * 0.6;
    
    trackPoints.push({ x: -1000, y: cy });
    trackPoints.push({ x: 500, y: cy });
    cx = 500;

    for (let i = 0; i < 40; i++) {
        let rand = Math.random();
        
        if (rand < 0.4) {
            // Ligne droite ou vallonnée
            let len = 400 + Math.random() * 200;
            let targetY = cy + (Math.random() * 100 - 50);
            
            // Placement des losanges violets
            for(let j = 1; j <= 3; j++) {
                diamonds.push({ x: cx + (len * (j/4)), y: (cy + (targetY - cy) * (j/4)) - 30, picked: false });
            }
            cx += len; cy = targetY;
            trackPoints.push({ x: cx, y: cy });
        } else {
            // Une grande bosse avec une scie rouge géante dans le creux suivant !
            let len = 500;
            let peakY = cy - 130;
            let valleyY = cy + 100;

            trackPoints.push({ x: cx + len * 0.25, y: peakY });
            trackPoints.push({ x: cx + len * 0.5, y: cy });
            
            // Ajout de la scie d'obstacle au milieu du creux
            obstacles.push({ x: cx + len * 0.75, y: valleyY - 20, radius: 45, rotation: 0 });
            
            // Losanges au-dessus de l'obstacle
            diamonds.push({ x: cx + len * 0.75, y: valleyY - 140, picked: false });
            diamonds.push({ x: cx + len * 0.85, y: valleyY - 100, picked: false });

            cx += len; cy = valleyY;
            trackPoints.push({ x: cx, y: cy });
        }
    }
    trackPoints.push({ x: cx + 5000, y: cy });
}

const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function start() {
    generateTrack();
    bike.x = 150; bike.y = canvas.height * 0.4;
    bike.vx = 0; bike.vy = 0; bike.speed = 0; bike.angle = 0;
    score = 0; gemsCollected = 0;
    document.getElementById('gems').textContent = gemsCollected;
    document.getElementById('game-overlay').style.display = 'none';
    isPlaying = true;
    loop();
}

function updatePhysics() {
    // --- MODE DE JEU ARCADE : TOUT SE JOUE AUX FLÈCHES DE CÔTÉ ET DU HAUT ---
    const pressForward = keys['ArrowRight'] || keys['KeyD'];
    const pressBackward = keys['ArrowLeft'] || keys['KeyA'];
    const pressLean = keys['ArrowUp'] || keys['KeyW'] || keys['KeyZ'];

    if (bike.isGrounded) {
        // Au sol, les flèches horizontales déplacent la moto sur la ligne
        if (pressForward) bike.speed = Math.min(bike.speed + bike.accel, bike.maxSpeed);
        else if (pressBackward) bike.speed = Math.max(bike.speed - bike.accel, bike.maxReverse);
        else bike.speed *= bike.friction;

        bike.vx = Math.cos(bike.angle) * bike.speed;
        bike.vy = Math.sin(bike.angle) * bike.speed;
        
        // Appuyer sur Haut permet de cabrer la moto légèrement au sol
        if (pressLean) bike.angle -= 0.03;
        bike.angularVelocity = 0;
    } else {
        // En plein saut (Galipettes / Flips gérés par l'inclinaison des flèches)
        if (pressBackward) bike.angularVelocity = -0.07;
        else if (pressForward) bike.angularVelocity = 0.07;
        else if (pressLean) bike.angularVelocity = -0.04;
        else bike.angularVelocity *= 0.95;

        bike.angle += bike.angularVelocity;
        bike.vy += bike.gravity;
        bike.vx *= 0.995;
    }

    bike.x += bike.vx;
    bike.y += bike.vy;

    // Blocage au bord gauche de l'écran pour caler son élan
    let borderLeft = cameraX + 30;
    if (bike.x < borderLeft) {
        bike.x = borderLeft;
        if (bike.vx < 0) { bike.vx = 0; bike.speed = 0; }
    }

    // --- DETECTION MATRICIELLE DE LA LIGNE CONTINU ---
    let currentSurface = null;
    for (let i = 0; i < trackPoints.length - 1; i++) {
        let p1 = trackPoints[i]; let p2 = trackPoints[i+1];
        if (bike.x >= p1.x && bike.x <= p2.x) {
            let pct = (bike.x - p1.x) / (p2.x - p1.x);
            let yOnTrack = p1.y + pct * (p2.y - p1.y);
            
            // Système anti-pass-through pour coller à la ligne rouge
            if (bike.y + bike.radius >= yOnTrack && bike.y - bike.radius <= yOnTrack + 20 && bike.vy >= -2) {
                currentSurface = { y: yOnTrack, angle: Math.atan2(p2.y - p1.y, p2.x - p1.x) };
                break;
            }
        }
    }

    if (currentSurface) {
        let diff = bike.angle - currentSurface.angle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;

        // Crash si mauvais angle d'atterrissage
        if (!bike.isGrounded && Math.abs(diff) > 1.2 && Math.abs(bike.vy) > 1.5) {
            crash("GAME OVER");
            return;
        }

        bike.y = currentSurface.y - bike.radius;
        bike.vy = 0;
        bike.isGrounded = true;
        bike.angle = bike.angle * 0.3 + currentSurface.angle * 0.7;
    } else {
        bike.isGrounded = false;
    }

    // Gestion des collisions obstacles (Scies)
    obstacles.forEach(obs => {
        obs.rotation += 0.08;
        if (Math.hypot(bike.x - obs.x, bike.y - obs.y) < obs.radius + bike.radius - 5) {
            crash("GAME OVER");
        }
    });

    // Ramassage de l'argent (cristaux violets)
    diamonds.forEach(d => {
        if (!d.picked && Math.hypot(bike.x - d.x, bike.y - d.y) < bike.radius + 25) {
            d.picked = true;
            gemsCollected++;
            document.getElementById('gems').textContent = gemsCollected;
        }
    });

    // Centrage Caméra identique à la vidéo
    cameraX = bike.x - (canvas.width * 0.3);
    cameraY = cameraY * 0.9 + (bike.y - (canvas.height * 0.55)) * 0.1;

    // Score de distance
    if (bike.vx > 0) score += bike.vx * 0.03;
    document.getElementById('score').textContent = Math.floor(score);

    if (bike.y > canvas.height + 600) crash("GAME OVER");
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, -cameraY);

    // DESSIN DE LA LIGNE CONTINU ROUGE FLUO DU JEU
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#ff0055';
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#ff0055';
    ctx.beginPath();
    trackPoints.forEach((p, idx) => {
        if (idx === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
    ctx.shadowBlur = 0;

    // DESSIN DES LOSANGES VIOLETS (ARGENT)
    diamonds.forEach(d => {
        if (d.picked) return;
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.fillStyle = '#d000ff';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#d000ff';
        ctx.beginPath();
        ctx.moveTo(0, -14); ctx.lineTo(9, 0); ctx.lineTo(0, 14); ctx.lineTo(-9, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    });
    ctx.shadowBlur = 0;

    // DESSIN DE LA SCIE OBSTACLE ROUGE
    obstacles.forEach(obs => {
        ctx.save();
        ctx.translate(obs.x, obs.y);
        ctx.rotate(obs.rotation);
        ctx.fillStyle = '#ff1100';
        ctx.beginPath();
        for (let j = 0; j < 16; j++) {
            let angle = (j / 16) * Math.PI * 2;
            ctx.lineTo(Math.cos(angle) * obs.radius, Math.sin(angle) * obs.radius);
            ctx.lineTo(Math.cos(angle + 0.1) * (obs.radius - 12), Math.sin(angle + 0.1) * (obs.radius - 12));
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    });

    // DESSIN DE LA MOTO JAUNE COMPACTE (REPRODUCTION SPRITE VIDÉO)
    ctx.save();
    ctx.translate(bike.x, bike.y);
    ctx.rotate(bike.angle);

    // Roues de la moto
    ctx.fillStyle = '#222';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-14, 5, 7, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(14, 5, 7, 0, Math.PI*2); ctx.fill(); ctx.stroke();

    // Corps Jaune Cyber
    ctx.fillStyle = '#ffea00';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ffea00';
    ctx.beginPath();
    ctx.moveTo(-16, 2);
    ctx.lineTo(-12, -8);
    ctx.lineTo(10, -8);
    ctx.lineTo(16, 2);
    ctx.closePath();
    ctx.fill();

    // Verrière cockpit bleu
    ctx.fillStyle = '#00f2fe';
    ctx.beginPath();
    ctx.moveTo(-2, -8); ctx.lineTo(6, -8); ctx.lineTo(2, -14); ctx.lineTo(-3, -14);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
    ctx.restore();
}

function loop() {
    if (!isPlaying) return;
    updatePhysics();
    draw();
    requestAnimationFrame(loop);
}

function crash(msg) {
    isPlaying = false;
    document.getElementById('menu-title').textContent = msg;
    document.getElementById('actionBtn').textContent = "TRY AGAIN";
    document.getElementById('game-overlay').style.display = 'flex';
}

document.getElementById('actionBtn').addEventListener('click', start);
</script>
</body>
</html>
