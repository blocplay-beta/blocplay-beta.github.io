<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rider - Fullscreen Arcade</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020308;
            color: #fff;
            font-family: system-ui, sans-serif;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .hud {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-family: monospace;
            font-size: 1.4rem;
            font-weight: bold;
            z-index: 5;
        }

        .hud-item {
            background: rgba(5, 7, 15, 0.85);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 3, 8, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        h1 {
            font-size: 4.5rem;
            color: #fff;
            margin: 0 0 20px 0;
            letter-spacing: 4px;
            text-align: center;
        }

        button {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            padding: 14px 60px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #fff;
            color: #000;
            transform: scale(1.05);
        }

        .controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            text-align: center;
            color: #64748b;
            font-size: 1rem;
            font-weight: 500;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="neonCanvas"></canvas>
    
    <div class="hud">
        <div class="hud-item" id="score-label" style="color: #fff;">SCORE: <span id="score">0</span></div>
        <div class="hud-item" style="color: #00f2fe;">💎 <span id="gems">0</span></div>
        <div class="hud-item" style="color: #fffe00;">BEST: <span id="best">0</span></div>
    </div>

    <div id="game-overlay" class="overlay">
        <h1 id="menu-title">NEON RIDER</h1>
        <button id="actionBtn">RIDE</button>
    </div>

    <div class="controls">
        <strong style="color: #fff;">[BARRE ESPACE]</strong> Accélérer | <strong style="color: #fff;">[FLÈCHE GAUCHE / DROITE]</strong> Flips Ultra-Sensibles
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// --- CONFIGURATION CLOUD FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
    authDomain: "blocplay-a9417.firebaseapp.com",
    projectId: "blocplay-a9417",
    storageBucket: "blocplay-a9417.firebasestorage.app",
    messagingSenderId: "540161549188",
    appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let uId = null, highscore = 0, totalGems = 0;

onAuthStateChanged(auth, (u) => {
    if (u) {
        uId = u.uid;
        get(child(ref(db), `neon_rider_v6/${uId}`)).then((s) => {
            if (s.exists()) {
                highscore = s.val().best || 0;
                totalGems = s.val().gems || 0;
                document.getElementById('best').textContent = highscore;
                document.getElementById('gems').textContent = totalGems;
            }
        });
    }
});

// --- MOTEUR DE JEU PLEIN ÉCRAN ---
const canvas = document.getElementById('neonCanvas');
const ctx = canvas.getContext('2d');

let isPlaying = false;
let score = 0;
let cameraX = 0, cameraY = 0;
let segments = [];
let diamonds = [];

const bike = {
    x: 100, y: 200,
    vx: 0, vy: 0,
    speed: 0,
    maxSpeed: 11,       // Un peu plus rapide pour un meilleur flow
    accel: 0.32,
    friction: 0.99,
    gravity: 0.26,      // Gravité légèrement réduite pour planer en toute sécurité
    angle: 0,
    isGrounded: false,
    radius: 14,
    flipTracker: 0
};

const themeColors = ['#00f2fe', '#fe0979', '#fffe00', '#00ff66', '#a855f7'];
let activeColor = themeColors[0];

// Gestion dynamique du plein écran
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', () => {
    resizeCanvas();
});
resizeCanvas();

// Génération de pistes calibrée : moins de sauts, réceptions proches et rabaissées
function buildMap() {
    segments = [];
    diamonds = [];
    
    let currentX = 0;
    let currentY = canvas.height * 0.65; // Position initiale basée sur l'écran

    // Grande zone de départ sécurisée
    segments.push({ x1: currentX, y1: currentY, x2: 600, y2: currentY });
    currentX = 600;

    for (let i = 0; i < 30; i++) {
        // 1. Très longues sections au sol pour profiter de la vitesse
        let runUpLength = 600 + Math.random() * 300;
        let targetY = currentY + (Math.random() * 40 - 20);
        
        // Limiter l'altitude globale pour pas que ça sorte de l'écran
        if (targetY > canvas.height * 0.8 || targetY < canvas.height * 0.4) targetY = canvas.height * 0.65;

        segments.push({ x1: currentX, y1: currentY, x2: currentX + runUpLength, y2: targetY });
        currentX += runUpLength;
        currentY = targetY;

        // Pièces posées de façon fluide sur la route
        for (let j = 1; j <= 3; j++) {
            diamonds.push({ x: currentX - (j * 100), y: currentY - 18, picked: false });
        }

        // 2. KICKER ADOUCI (Montée moins violente pour ne pas être propulsé trop haut)
        let rampLength = 140;
        let rampHeight = 45 + Math.random() * 20; 
        let rampEndX = currentX + rampLength;
        let rampEndY = currentY - rampHeight;

        segments.push({ x1: currentX, y1: currentY, x2: rampEndX, y2: rampEndY });
        currentX = rampEndX;
        currentY = rampEndY;

        // 3. TROU PLUS COURT & RÉCEPTION BASSE (Impossible de rater la plateforme)
        let safeGap = 200 + Math.random() * 80; 
        let receptionY = currentY + 160; // Grand drop : la plateforme est très basse, tu arrives forcément par le dessus !

        // Pièces au milieu du vol, faciles à attraper
        diamonds.push({ x: currentX + (safeGap / 2), y: currentY + 30, picked: false });

        currentX += safeGap;
        currentY = receptionY;

        // Longue plateforme de réception
        let landLength = 400;
        segments.push({ x1: currentX, y1: currentY, x2: currentX + landLength, y2: currentY });
        currentX += landLength;
    }

    // Ligne droite infinie à la fin
    segments.push({ x1: currentX, y1: currentY, x2: currentX + 10000, y2: currentY });
}

const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function start() {
    resizeCanvas();
    activeColor = themeColors[Math.floor(Math.random() * themeColors.length)];
    document.getElementById('game-container').style.setProperty('--neon-theme', activeColor);
    document.getElementById('score-label').style.color = activeColor;
    
    buildMap();
    
    bike.x = 150; 
    bike.y = canvas.height * 0.5;
    bike.vx = 4; bike.vy = 0; bike.speed = 0;
    bike.angle = 0;
    bike.isGrounded = false;
    bike.flipTracker = 0;
    score = 0;
    
    document.getElementById('game-overlay').style.display = 'none';
    isPlaying = true;
    engineLoop();
}

function getSurface(x) {
    for (let seg of segments) {
        if (x >= seg.x1 && x <= seg.x2) {
            let t = (x - seg.x1) / (seg.x2 - seg.x1);
            let y = seg.y1 + t * (seg.y2 - seg.y1);
            let angle = Math.atan2(seg.y2 - seg.y1, seg.x2 - seg.x1);
            return { y, angle };
        }
    }
    return null; 
}

function update() {
    // Barre Espace pour foncer
    if (keys['Space']) {
        bike.speed = Math.min(bike.speed + bike.accel, bike.maxSpeed);
    } else {
        bike.speed *= bike.friction;
    }

    // Sensibilité maximale instantanée en l'air
    if (!bike.isGrounded) {
        if (keys['ArrowLeft'] || keys['KeyA']) {
            bike.angle -= 0.12; 
            bike.flipTracker -= 0.12;
        }
        if (keys['ArrowRight'] || keys['KeyD']) {
            bike.angle += 0.12;
            bike.flipTracker += 0.12;
        }

        if (Math.abs(bike.flipTracker) >= Math.PI * 2) {
            score += 1500; 
            bike.flipTracker = 0;
        }
    } else {
        bike.flipTracker = 0;
    }

    // Calcul du mouvement
    if (bike.isGrounded) {
        bike.vx = Math.cos(bike.angle) * bike.speed;
        bike.vy = Math.sin(bike.angle) * bike.speed;
    } else {
        bike.vy += bike.gravity; 
    }

    bike.x += bike.vx;
    bike.y += bike.vy;

    // Gestion stricte des collisions (Zéro aimant au sol)
    let surface = getSurface(bike.x);
    if (surface) {
        if (bike.y + bike.radius >= surface.y && bike.vy >= -0.1) {
            
            // Crash si tu atterris sur la tête
            let diff = Math.abs(normalizeAngle(bike.angle - surface.angle));
            if (!bike.isGrounded && diff > 1.1) {
                crash();
                return;
            }

            bike.y = surface.y - bike.radius;
            bike.isGrounded = true;
            bike.angle = bike.angle * 0.3 + surface.angle * 0.7; 
        } else {
            bike.isGrounded = false;
        }
    } else {
        bike.isGrounded = false; 
    }

    // Collecte des cristaux
    diamonds.forEach(d => {
        if (!d.picked && Math.hypot(bike.x - d.x, bike.y - d.y) < bike.radius + 20) {
            d.picked = true;
            totalGems++;
            score += 250;
            document.getElementById('gems').textContent = totalGems;
        }
    });

    // Caméra dynamique centrée par rapport au plein écran
    cameraX = bike.x - (canvas.width * 0.25);
    cameraY = cameraY * 0.9 + (bike.y - (canvas.height * 0.6)) * 0.1;

    score += bike.vx * 0.15;
    document.getElementById('score').textContent = Math.floor(score);

    // Chute fatale
    if (bike.y > canvas.height + 500) crash();
}

function draw() {
    ctx.fillStyle = '#03050a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, -cameraY);

    // 1. Rendu des pistes néon
    ctx.lineWidth = 6;
    ctx.strokeStyle = activeColor;
    ctx.shadowBlur = 16;
    ctx.shadowColor = activeColor;
    
    segments.forEach(seg => {
        if (seg.x2 >= cameraX - 200 && seg.x1 <= cameraX + canvas.width + 200) {
            ctx.beginPath();
            ctx.moveTo(seg.x1, seg.y1);
            ctx.lineTo(seg.x2, seg.y2);
            ctx.stroke();
        }
    });
    ctx.shadowBlur = 0;

    // 2. Rendu des pièces (Losanges)
    diamonds.forEach(d => {
        if (d.picked) return;
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.fillStyle = '#00f2fe';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00f2fe';
        ctx.beginPath();
        ctx.moveTo(0, -9); ctx.lineTo(6, 0); ctx.lineTo(0, 9); ctx.lineTo(-6, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    });
    ctx.shadowBlur = 0;

    // 3. Rendu de la Moto
    ctx.save();
    ctx.translate(bike.x, bike.y);
    ctx.rotate(bike.angle);

    ctx.shadowBlur = 12;
    ctx.shadowColor = activeColor;
    ctx.fillStyle = activeColor;

    // Deux roues de moto distinctes
    ctx.beginPath(); ctx.arc(-16, 5, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(16, 5, 8, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    // Châssis blanc
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-16, 5); ctx.lineTo(-4, -7); ctx.lineTo(8, -7); ctx.lineTo(16, 5);
    ctx.moveTo(-4, -7); ctx.lineTo(2, -14); ctx.lineTo(7, -7); 
    ctx.stroke();

    ctx.restore();
    ctx.restore();
}

function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
}

function engineLoop() {
    if (!isPlaying) return;
    update();
    draw();
    requestAnimationFrame(engineLoop);
}

function crash() {
    isPlaying = false;
    document.getElementById('menu-title').textContent = "CRASH !";
    document.getElementById('actionBtn').textContent = "RIDE ENCORE";
    document.getElementById('game-overlay').style.display = 'flex';

    if (score > highscore) {
        highscore = Math.floor(score);
        document.getElementById('best').textContent = highscore;
    }
    if (uId) {
        set(ref(db, `neon_rider_v6/${uId}`), { best: highscore, gems: totalGems });
    }
}

document.getElementById('actionBtn').addEventListener('click', start);
</script>
</body>
</html>
