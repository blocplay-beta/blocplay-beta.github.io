<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON OVERDRIVE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&display=swap');

        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #030308;
            font-family: 'Orbitron', sans-serif; user-select: none;
        }

        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }

        /* HUD EN BAS A GAUCHE ET EN BAS A DROITE */
        .hud-player {
            position: absolute; bottom: 25px; z-index: 5;
            display: flex; flex-direction: column; gap: 8px;
            color: #fff; text-shadow: 0 0 10px #00f2fe;
            font-size: 1.1rem;
        }
        #hud-p1 { left: 25px; }
        #hud-p2 { right: 25px; text-align: right; }

        .health-bar-bg {
            width: 220px; height: 20px; background: rgba(255, 255, 255, 0.15);
            border: 2px solid #00f2fe; border-radius: 10px; overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }
        .health-bar-fill {
            width: 100%; height: 100%; background: #00f2fe;
            transition: width 0.2s ease;
        }
        #p2-fill { background: #ff007f; border-color: #ff007f; }

        /* HUD HAUT */
        .hud-top {
            position: absolute; top: 20px; left: 25px; right: 25px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; z-index: 5; color: #fff; font-size: 1.4rem;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* MENUS & OVERLAYS */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 8, 0.93); backdrop-filter: blur(8px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
        }

        h1 {
            font-size: 4rem; margin: 0 0 20px 0; letter-spacing: 4px;
            color: #00f2fe; text-shadow: 0 0 35px #00f2fe; text-align: center; font-weight: 900;
        }

        .btn-group { display: flex; flex-direction: column; gap: 16px; margin-top: 10px; align-items: center; }

        /* OPTIMISÉ POUR TÉLÉ ET PC (FOCUS VISIBLE) */
        .btn {
            background: #ff007f; color: #fff; border: 3px solid transparent;
            padding: 16px 45px; font-size: 1.25rem; font-weight: 900;
            border-radius: 35px; cursor: pointer; transition: all 0.15s ease;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
            font-family: 'Orbitron', sans-serif; text-transform: uppercase;
            width: 380px; text-align: center;
        }
        .btn:hover, .btn.focused {
            transform: scale(1.08); background: #ff3399;
            border-color: #ffffff; box-shadow: 0 0 40px rgba(255, 0, 127, 1);
            outline: none;
        }
        .btn-blue { background: #00f2fe; color: #000; box-shadow: 0 0 20px rgba(0, 242, 254, 0.5); }
        .btn-blue:hover, .btn-blue.focused { background: #66fcf1; border-color: #ffffff; box-shadow: 0 0 40px rgba(0, 242, 254, 1); }
        .btn-gold { background: #fffe00; color: #000; box-shadow: 0 0 20px rgba(255, 254, 0, 0.5); }
        .btn-gold:hover, .btn-gold.focused { background: #ffff66; border-color: #ffffff; box-shadow: 0 0 40px rgba(255, 254, 0, 1); }

        /* BOUTIQUE */
        .shop-box {
            background: #0c0d1b; border: 3px solid #00f2fe; border-radius: 18px;
            padding: 30px; width: 90%; max-width: 580px; box-shadow: 0 0 40px rgba(0, 242, 254, 0.4);
            display: flex; flex-direction: column; gap: 18px; color: #fff;
        }
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.06); padding: 14px 20px; border-radius: 12px;
            font-size: 1.1rem;
        }

        /* FENÊTRE PUB */
        .ad-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.88); backdrop-filter: blur(6px);
            align-items: center; justify-content: center; z-index: 20;
        }
        .ad-box {
            width: 90%; max-width: 720px; height: 520px; background: #0c0d1b;
            border: 3px solid #00f2fe; border-radius: 15px; overflow: hidden;
            display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,242,254,0.6);
        }
        .ad-box iframe { width: 100%; height: 420px; border: none; }
        .ad-footer {
            height: 100px; background: #060710; display: flex;
            align-items: center; justify-content: space-between; padding: 0 25px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas"></canvas>

    <div class="hud-top" id="hud-top" style="display:none;">
        <div>SCORE: <span id="score-val" style="color:#ff007f;">0</span></div>
        <div>🪙 <span id="coins-val" style="color:#fffe00;">0</span></div>
    </div>

    <div class="hud-player" id="hud-p1" style="display:none;">
        <div>JOUEUR 1</div>
        <div class="health-bar-bg"><div class="health-bar-fill" id="p1-fill"></div></div>
    </div>

    <div class="hud-player" id="hud-p2" style="display:none;">
        <div>JOUEUR 2</div>
        <div class="health-bar-bg" style="border-color:#ff007f;"><div class="health-bar-fill" id="p2-fill"></div></div>
    </div>

    <div id="menu" class="overlay">
        <h1>NEON OVERDRIVE</h1>

        <div class="btn-group">
            <button class="btn btn-action" onclick="startGame(1)">1 JOUEUR</button>
            <button class="btn btn-blue btn-action" onclick="startGame(2)">2 JOUEURS (CO-OP)</button>
            <button class="btn btn-gold btn-action" onclick="openShop()">BOUTIQUE 🪙</button>
        </div>
    </div>

    <div id="shop-menu" class="overlay" style="display:none;">
        <div class="shop-box">
            <h2 style="margin:0; text-align:center; color:#fffe00; font-size:2rem;">BOUTIQUE</h2>
            <div style="text-align:center; font-size:1.2rem;">Tes Pièces : <span id="shop-coins-val" style="color:#fffe00;">0</span> 🪙</div>

            <div class="shop-item">
                <div><b>Tir Rapide</b><br><small style="color:#aaa">Cadence élevée</small></div>
                <button class="btn btn-gold btn-action" id="buy-fire" style="width: auto; padding: 10px 20px;" onclick="buyUpgrade('fireRate')">50 🪙</button>
            </div>
            <div class="shop-item">
                <div><b>Coque Renforcée</b><br><small style="color:#aaa">+25 PV Max</small></div>
                <button class="btn btn-gold btn-action" id="buy-hp" style="width: auto; padding: 10px 20px;" onclick="buyUpgrade('maxHp')">75 🪙</button>
            </div>
            <div class="shop-item">
                <div><b>Skin Doré</b><br><small style="color:#aaa">Apparence dorée</small></div>
                <button class="btn btn-gold btn-action" id="buy-skin" style="width: auto; padding: 10px 20px;" onclick="buyUpgrade('goldSkin')">150 🪙</button>
            </div>

            <button class="btn btn-action" style="align-self:center; margin-top:10px;" onclick="closeShop()">RETOUR</button>
        </div>
    </div>

    <div id="revive-menu" class="overlay" style="display:none;">
        <h1 style="color:#ff0055; text-shadow:0 0 30px #ff0055;">PARTIE TERMINÉE</h1>
        <p style="color:#fff; margin-bottom: 25px; font-size:1.3rem;">Voulez-vous récupérer vos vies ?</p>

        <div class="btn-group">
            <button class="btn btn-gold btn-action" id="btn-pay-coins" onclick="reviveWithCoins()">PAYER 25 🪙</button>
            <button class="btn btn-blue btn-action" onclick="openAdModal()">REGARDER UNE PUB 📺</button>
            <button class="btn btn-action" style="background:#555;" onclick="closeGameOver()">NON MERCI</button>
        </div>
    </div>

    <div id="ad-modal" class="ad-modal">
        <div class="ad-box">
            <iframe id="ad-iframe" src=""></iframe>
            <div class="ad-footer">
                <span id="ad-timer-text" style="color:#fffe00; font-size:1.1rem;">Attente : 10s...</span>
                <button class="btn btn-blue btn-action" id="ad-close-btn" disabled style="width: auto; padding: 12px 25px; opacity:0.5;" onclick="reviveFromAd()">RÉCUPÉRER MES VIES</button>
            </div>
        </div>
    </div>
</div>

<script>
// --- AUDIO SYSTEM ---
class SoundSystem {
    constructor() { this.ctx = null; }
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    playShoot() {
        if (!this.ctx) return;
        let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.1);
    }
    playExplosion() {
        if (!this.ctx) return;
        let dur = 0.2, bufferSize = this.ctx.sampleRate * dur, buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        let data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        let noise = this.ctx.createBufferSource(); noise.buffer = buffer;
        let filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass';
        filter.frequency.setValueAtTime(500, this.ctx.currentTime); filter.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + dur);
        let gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.25, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
        noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
        noise.start(); noise.stop(this.ctx.currentTime + dur);
    }
}
const audio = new SoundSystem();

// --- SAVES & SHOP SYSTEM ---
let saveData = JSON.parse(localStorage.getItem('neon_overdrive_save')) || {
    coins: 0, fireRateLevel: 0, hpLevel: 0, goldSkin: false
};
function saveGame() { localStorage.setItem('neon_overdrive_save', JSON.stringify(saveData)); }

function openShop() {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('shop-menu').style.display = 'flex';
    updateShopUI();
    focusedBtnIndex = 0; updateButtonFocus();
}
function closeShop() {
    document.getElementById('shop-menu').style.display = 'none';
    document.getElementById('menu').style.display = 'flex';
    focusedBtnIndex = 0; updateButtonFocus();
}

function updateShopUI() {
    document.getElementById('shop-coins-val').textContent = saveData.coins;
    document.getElementById('buy-fire').textContent = saveData.fireRateLevel >= 3 ? "MAX" : (50 * (saveData.fireRateLevel + 1)) + " 🪙";
    document.getElementById('buy-hp').textContent = saveData.hpLevel >= 3 ? "MAX" : (75 * (saveData.hpLevel + 1)) + " 🪙";
    document.getElementById('buy-skin').textContent = saveData.goldSkin ? "ACQUIS" : "150 🪙";
}

function buyUpgrade(type) {
    if (type === 'fireRate' && saveData.fireRateLevel < 3) {
        let cost = 50 * (saveData.fireRateLevel + 1);
        if (saveData.coins >= cost) { saveData.coins -= cost; saveData.fireRateLevel++; }
    } else if (type === 'maxHp' && saveData.hpLevel < 3) {
        let cost = 75 * (saveData.hpLevel + 1);
        if (saveData.coins >= cost) { saveData.coins -= cost; saveData.hpLevel++; }
    } else if (type === 'goldSkin' && !saveData.goldSkin && saveData.coins >= 150) {
        saveData.coins -= 150; saveData.goldSkin = true;
    }
    saveGame(); updateShopUI();
}

// --- ENGINE & SETUP ---
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let isPlaying = false, score = 0, modePlayers = 1;

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

let players = [], bullets = [], enemies = [], fallingCoins = [], particles = [];
const keys = {};

// NAVIGATION NAVIGATION TÉLÉCOMMANDE / MANETTE / CLAVIER EN MENU
let focusedBtnIndex = 0;

function getActiveButtons() {
    const overlays = [
        document.getElementById('menu'),
        document.getElementById('shop-menu'),
        document.getElementById('revive-menu'),
        document.getElementById('ad-modal')
    ];
    const visibleOverlay = overlays.find(o => o && o.style.display !== 'none' && o.style.display !== '');
    if (!visibleOverlay) return [];
    return Array.from(visibleOverlay.querySelectorAll('.btn-action:not([disabled])'));
}

function updateButtonFocus() {
    const btns = getActiveButtons();
    btns.forEach((b, i) => {
        if (i === focusedBtnIndex) b.classList.add('focused');
        else b.classList.remove('focused');
    });
}

// GESTION TOUCHES TÉLÉCOMMANDE / PC
window.addEventListener('keydown', e => {
    keys[e.code] = true;

    // Touches Retour Télécommande (Escape, Backspace, GoBack)
    if (['Escape', 'Backspace', 'GoBack', 'XF86Back'].includes(e.key) || e.keyCode === 10009 || e.keyCode === 461) {
        if (document.getElementById('shop-menu').style.display === 'flex') closeShop();
        if (document.getElementById('revive-menu').style.display === 'flex') closeGameOver();
    }

    if (!isPlaying) {
        const btns = getActiveButtons();
        if (btns.length === 0) return;

        if (['ArrowDown', 'KeyS', 'ArrowRight', 'KeyD'].includes(e.code)) {
            focusedBtnIndex = (focusedBtnIndex + 1) % btns.length;
            updateButtonFocus();
        } else if (['ArrowUp', 'KeyW', 'ArrowLeft', 'KeyA'].includes(e.code)) {
            focusedBtnIndex = (focusedBtnIndex - 1 + btns.length) % btns.length;
            updateButtonFocus();
        } else if (['Enter', 'Space', 'Select'].includes(e.code) || e.keyCode === 13) {
            if (btns[focusedBtnIndex]) btns[focusedBtnIndex].click();
        }
    }
});

window.addEventListener('keyup', e => keys[e.code] = false);

// DÉMARRAGE DU JEU
function startGame(nbPlayers) {
    audio.init(); modePlayers = nbPlayers;
    players = [];
    
    let baseHp = 100 + saveData.hpLevel * 25;
    let p1Delay = Math.max(70, 130 - saveData.fireRateLevel * 20);

    // Player 1
    players.push({
        id: 1, x: canvas.width * (nbPlayers === 2 ? 0.35 : 0.5), y: canvas.height * 0.8,
        r: 18, hp: baseHp, maxHp: baseHp, color: saveData.goldSkin ? '#fffe00' : '#00f2fe',
        lastShot: 0, fireDelay: p1Delay
    });

    // Player 2
    if (nbPlayers === 2) {
        players.push({
            id: 2, x: canvas.width * 0.65, y: canvas.height * 0.8,
            r: 18, hp: 100, maxHp: 100, color: '#ff007f',
            lastShot: 0, fireDelay: 130
        });
    }

    bullets = []; enemies = []; fallingCoins = []; particles = []; score = 0;
    
    document.getElementById('menu').style.display = 'none';
    document.getElementById('revive-menu').style.display = 'none';
    document.getElementById('hud-top').style.display = 'flex';
    document.getElementById('hud-p1').style.display = 'flex';
    document.getElementById('hud-p2').style.display = nbPlayers === 2 ? 'flex' : 'none';
    document.getElementById('coins-val').textContent = saveData.coins;
    
    updateHealthUI();
    isPlaying = true;
    requestAnimationFrame(gameLoop);
}

function updateHealthUI() {
    if (players[0]) {
        document.getElementById('p1-fill').style.width = Math.max(0, (players[0].hp / players[0].maxHp) * 100) + '%';
    }
    if (players[1]) {
        document.getElementById('p2-fill').style.width = Math.max(0, (players[1].hp / players[1].maxHp) * 100) + '%';
    }
}

// SUPPORT MANETTES TV / PC (GAMEPAD API)
function pollGamepads() {
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    if (!gamepads) return;

    // Manette 1 -> Joueur 1
    if (gamepads[0] && players[0] && players[0].hp > 0) {
        let gp = gamepads[0];
        if (gp.axes[0] < -0.3 || gp.buttons[14]?.pressed) players[0].x -= 7;
        if (gp.axes[0] > 0.3 || gp.buttons[15]?.pressed) players[0].x += 7;
        if (gp.axes[1] < -0.3 || gp.buttons[12]?.pressed) players[0].y -= 7;
        if (gp.axes[1] > 0.3 || gp.buttons[13]?.pressed) players[0].y += 7;
        
        // Empêcher de sortir du canvas
        players[0].x = Math.max(players[0].r, Math.min(canvas.width - players[0].r, players[0].x));
        players[0].y = Math.max(players[0].r, Math.min(canvas.height - players[0].r, players[0].y));

        if ((gp.buttons[0]?.pressed || gp.buttons[7]?.pressed) && Date.now() - players[0].lastShot > players[0].fireDelay) {
            audio.playShoot();
            bullets.push({ x: players[0].x, y: players[0].y - 15, vy: -15, color: players[0].color });
            players[0].lastShot = Date.now();
        }
    }

    // Manette 2 -> Joueur 2
    if (gamepads[1] && players[1] && players[1].hp > 0) {
        let gp = gamepads[1];
        if (gp.axes[0] < -0.3 || gp.buttons[14]?.pressed) players[1].x -= 7;
        if (gp.axes[0] > 0.3 || gp.buttons[15]?.pressed) players[1].x += 7;
        if (gp.axes[1] < -0.3 || gp.buttons[12]?.pressed) players[1].y -= 7;
        if (gp.axes[1] > 0.3 || gp.buttons[13]?.pressed) players[1].y += 7;

        players[1].x = Math.max(players[1].r, Math.min(canvas.width - players[1].r, players[1].x));
        players[1].y = Math.max(players[1].r, Math.min(canvas.height - players[1].r, players[1].y));

        if ((gp.buttons[0]?.pressed || gp.buttons[7]?.pressed) && Date.now() - players[1].lastShot > players[1].fireDelay) {
            audio.playShoot();
            bullets.push({ x: players[1].x, y: players[1].y - 15, vy: -15, color: players[1].color });
            players[1].lastShot = Date.now();
        }
    }
}

function update() {
    pollGamepads();

    // Joueur 1 (ZQSD / Télécommande D-Pad + Espace)
    let p1 = players[0];
    if (p1 && p1.hp > 0) {
        if ((keys['KeyA'] || keys['KeyQ']) && p1.x > p1.r) p1.x -= 7;
        if (keys['KeyD'] && p1.x < canvas.width - p1.r) p1.x += 7;
        if ((keys['KeyW'] || keys['KeyZ']) && p1.y > p1.r) p1.y -= 7;
        if (keys['KeyS'] && p1.y < canvas.height - p1.r) p1.y += 7;
        if (keys['Space'] && Date.now() - p1.lastShot > p1.fireDelay) {
            audio.playShoot();
            bullets.push({ x: p1.x, y: p1.y - 15, vy: -15, color: p1.color });
            p1.lastShot = Date.now();
        }
    }

    // Joueur 2 (Flèches + Entrée)
    let p2 = players[1];
    if (p2 && p2.hp > 0) {
        if (keys['ArrowLeft'] && p2.x > p2.r) p2.x -= 7;
        if (keys['ArrowRight'] && p2.x < canvas.width - p2.r) p2.x += 7;
        if (keys['ArrowUp'] && p2.y > p2.r) p2.y -= 7;
        if (keys['ArrowDown'] && p2.y < canvas.height - p2.r) p2.y += 7;
        if (keys['Enter'] && Date.now() - p2.lastShot > p2.fireDelay) {
            audio.playShoot();
            bullets.push({ x: p2.x, y: p2.y - 15, vy: -15, color: p2.color });
            p2.lastShot = Date.now();
        }
    }

    // Deplacement Balles
    bullets.forEach((b, bi) => {
        b.y += b.vy; if (b.y < -20) bullets.splice(bi, 1);
    });

    // Spawn Ennemis
    if (Math.random() < 0.045) {
        enemies.push({
            x: Math.random() * (canvas.width - 60) + 30, y: -30,
            r: 16, hp: 2, speed: 3 + Math.random() * 2, color: '#ff0055'
        });
    }

    // Spawn Pièces tombantes
    if (Math.random() < 0.012) {
        fallingCoins.push({
            x: Math.random() * (canvas.width - 60) + 30, y: -30,
            r: 12, speed: 2 + Math.random() * 1.5
        });
    }

    // Collisions Ennemis
    enemies.forEach((e, ei) => {
        e.y += e.speed;
        bullets.forEach((b, bi) => {
            if (Math.hypot(b.x - e.x, b.y - e.y) < b.r + e.r) {
                e.hp--; bullets.splice(bi, 1);
                if (e.hp <= 0) {
                    audio.playExplosion();
                    score += 100;
                    document.getElementById('score-val').textContent = score;
                    enemies.splice(ei, 1);
                }
            }
        });

        players.forEach(p => {
            if (p.hp > 0 && Math.hypot(p.x - e.x, p.y - e.y) < p.r + e.r) {
                audio.playExplosion();
                p.hp -= 30; updateHealthUI();
                enemies.splice(ei, 1);
            }
        });

        if (e.y > canvas.height + 40) enemies.splice(ei, 1);
    });

    // Collisions Pièces
    fallingCoins.forEach((c, ci) => {
        c.y += c.speed;
        players.forEach(p => {
            if (p.hp > 0 && Math.hypot(p.x - c.x, p.y - c.y) < p.r + c.r) {
                saveData.coins++; saveGame();
                document.getElementById('coins-val').textContent = saveData.coins;
                fallingCoins.splice(ci, 1);
            }
        });
        if (c.y > canvas.height + 40) fallingCoins.splice(ci, 1);
    });

    // Défaite
    if (players.every(p => p.hp <= 0)) triggerReviveMenu();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Tirs
    bullets.forEach(b => {
        ctx.shadowBlur = 10; ctx.shadowColor = b.color; ctx.fillStyle = b.color;
        ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
    });

    // Ennemis
    enemies.forEach(e => {
        ctx.shadowBlur = 12; ctx.shadowColor = e.color; ctx.fillStyle = e.color;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
    });

    // Pièces tombantes
    fallingCoins.forEach(c => {
        ctx.shadowBlur = 12; ctx.shadowColor = '#fffe00'; ctx.fillStyle = '#fffe00';
        ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill();
    });

    // Joueurs
    players.forEach(p => {
        if (p.hp > 0) {
            ctx.shadowBlur = 15; ctx.shadowColor = p.color; ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - p.r); ctx.lineTo(p.x - p.r, p.y + p.r); ctx.lineTo(p.x + p.r, p.y + p.r);
            ctx.closePath(); ctx.fill();
        }
    });
}

function gameLoop() {
    if (!isPlaying) return;
    update(); draw(); requestAnimationFrame(gameLoop);
}

// MENU SYSTEM REVIVE
function triggerReviveMenu() {
    isPlaying = false;
    document.getElementById('btn-pay-coins').disabled = saveData.coins < 25;
    document.getElementById('revive-menu').style.display = 'flex';
    focusedBtnIndex = 0; updateButtonFocus();
}

function reviveWithCoins() {
    if (saveData.coins >= 25) {
        saveData.coins -= 25; saveGame();
        document.getElementById('coins-val').textContent = saveData.coins;
        applyRevive();
    }
}

function openAdModal() {
    document.getElementById('ad-modal').style.display = 'flex';
    document.getElementById('ad-iframe').src = 'https://blocplay-beta.github.io/app/launch/ad/index.html';
    
    let timer = 10;
    const btn = document.getElementById('ad-close-btn');
    const txt = document.getElementById('ad-timer-text');
    btn.disabled = true; btn.style.opacity = '0.5';
    
    const interval = setInterval(() => {
        timer--;
        if (timer > 0) {
            txt.textContent = `Attente : ${timer}s...`;
        } else {
            clearInterval(interval);
            txt.textContent = "Publicité terminée !";
            btn.disabled = false; btn.style.opacity = '1';
            focusedBtnIndex = 0; updateButtonFocus();
        }
    }, 1000);
}

function reviveFromAd() {
    document.getElementById('ad-modal').style.display = 'none';
    document.getElementById('ad-iframe').src = '';
    applyRevive();
}

function applyRevive() {
    players.forEach(p => p.hp = p.maxHp);
    updateHealthUI();
    document.getElementById('revive-menu').style.display = 'none';
    isPlaying = true;
    requestAnimationFrame(gameLoop);
}

function closeGameOver() {
    document.getElementById('revive-menu').style.display = 'none';
    document.getElementById('hud-top').style.display = 'none';
    document.getElementById('hud-p1').style.display = 'none';
    document.getElementById('hud-p2').style.display = 'none';
    document.getElementById('menu').style.display = 'flex';
    focusedBtnIndex = 0; updateButtonFocus();
}
</script>
