<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Overdrive</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&display=swap');

        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #030308;
            font-family: 'Orbitron', sans-serif; user-select: none;
        }

        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }

        /* HUD */
        .hud {
            position: absolute; top: 15px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; z-index: 5; color: #fff; text-shadow: 0 0 10px #00f2fe;
        }
        .stats-group { display: flex; gap: 20px; align-items: center; }
        .coin-count { color: #fffe00; text-shadow: 0 0 10px #fffe00; }

        /* MENUS & OVERLAYS */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 8, 0.92); backdrop-filter: blur(8px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
        }

        h1 {
            font-size: 3.8rem; margin: 0 0 5px 0; letter-spacing: 3px;
            color: #00f2fe; text-shadow: 0 0 30px #00f2fe, 0 0 60px #00f2fe;
            text-align: center; font-weight: 900;
        }

        .btn-group { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }

        .btn {
            background: #ff007f; color: #fff; border: none;
            padding: 14px 40px; font-size: 1.2rem; font-weight: 900;
            border-radius: 30px; cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
            font-family: 'Orbitron', sans-serif; text-transform: uppercase;
        }
        .btn:hover { transform: scale(1.08); background: #ff3399; box-shadow: 0 0 35px rgba(255, 0, 127, 0.8); }
        .btn-blue { background: #00f2fe; box-shadow: 0 0 20px rgba(0, 242, 254, 0.5); color: #000; }
        .btn-blue:hover { background: #66fcf1; box-shadow: 0 0 35px rgba(0, 242, 254, 0.8); }

        /* MODAL BOUTIQUE */
        .shop-modal {
            display: none; background: #0c0d1b; border: 2px solid #00f2fe;
            border-radius: 15px; padding: 25px; width: 90%; max-width: 550px;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3); color: #fff;
            flex-direction: column; gap: 15px; z-index: 11;
        }
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.05); padding: 12px 18px; border-radius: 10px;
        }
        .shop-item-btn {
            background: #fffe00; color: #000; border: none; padding: 8px 18px;
            border-radius: 20px; font-weight: 900; cursor: pointer; font-family: 'Orbitron';
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas"></canvas>

    <div class="hud" id="hud" style="display:none;">
        <div class="stats-group">
            <div>SCORE: <span id="score-val" style="color:#ff007f;">0</span></div>
            <div class="coin-count">🪙 <span id="coins-val">0</span></div>
        </div>
    </div>

    <div id="menu" class="overlay">
        <h1 id="main-title">Neon Overdrive</h1>
        
        <div class="btn-group">
            <button class="btn" onclick="startGame(1)">Solo</button>
            <button class="btn btn-blue" onclick="startGame(2)">Multijoueur</button>
                            <button class="btn" style="background:#fffe00; color:#000;" onclick="openShop()">Boutique</button>
        </div>
    </div>

    <div id="shop-modal" class="overlay" style="display:none;">
        <div class="shop-modal" style="display:flex;">
            <h2 style="margin:0; text-align:center; color:#fffe00;">BOUTIQUE NEON</h2>
            <div style="text-align:center; margin-bottom:10px;">Tes Pièces : <span id="shop-coins" class="coin-count">0</span> 🪙</div>

            <div class="shop-item">
                <div><b>Tir Rapide</b><br><small style="color:#aaa">Augmente la cadence</small></div>
                <button class="shop-item-btn" id="buy-fire" onclick="buyUpgrade('fireRate', 50)">50 🪙</button>
            </div>
            <div class="shop-item">
                <div><b>Coque Renforcée</b><br><small style="color:#aaa">+25 PV Max</small></div>
                <button class="shop-item-btn" id="buy-hp" onclick="buyUpgrade('maxHp', 75)">75 🪙</button>
            </div>
            <div class="shop-item">
                <div><b>Skin Doré</b><br><small style="color:#aaa">Style personnalisé</small></div>
                <button class="shop-item-btn" id="buy-skin" onclick="buyUpgrade('goldSkin', 150)">150 🪙</button>
            </div>

            <button class="btn" style="margin-top:10px; align-self:center;" onclick="closeShop()">RETOUR</button>
        </div>
    </div>
</div>

<script>
// --- AUDIO SYNTH (Web Audio API) ---
class SoundSystem {
    constructor() { this.ctx = null; }
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    
    playShoot() {
        if (!this.ctx) return;
        let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.1);
    }
    playExplosion() {
        if (!this.ctx) return;
        let dur = 0.25, bufferSize = this.ctx.sampleRate * dur, buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        let data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        let noise = this.ctx.createBufferSource(); noise.buffer = buffer;
        let filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass';
        filter.frequency.setValueAtTime(600, this.ctx.currentTime); filter.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + dur);
        let gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.3, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
        noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
        noise.start(); noise.stop(this.ctx.currentTime + dur);
    }
}
const audio = new SoundSystem();

// --- SAVES & SHOP SYSTEM ---
let saveData = JSON.parse(localStorage.getItem('neon_overdrive_save')) || {
    coins: 0, fireRateLevel: 0, hpLevel: 0, goldSkin: false
};
function saveGame() { localStorage.setItem('neon_overdrive_save', JSON.stringify(saveData)); }

function openShop() {
    document.getElementById('shop-coins').textContent = saveData.coins;
    document.getElementById('buy-fire').textContent = saveData.fireRateLevel >= 3 ? "MAX" : (50 * (saveData.fireRateLevel + 1)) + " 🪙";
    document.getElementById('buy-hp').textContent = saveData.hpLevel >= 3 ? "MAX" : (75 * (saveData.hpLevel + 1)) + " 🪙";
    document.getElementById('buy-skin').textContent = saveData.goldSkin ? "POSSÉDÉ" : "150 🪙";
    document.getElementById('shop-modal').style.display = 'flex';
}
function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }

function buyUpgrade(type, baseCost) {
    if (type === 'fireRate' && saveData.fireRateLevel < 3) {
        let cost = 50 * (saveData.fireRateLevel + 1);
        if (saveData.coins >= cost) { saveData.coins -= cost; saveData.fireRateLevel++; }
    } else if (type === 'maxHp' && saveData.hpLevel < 3) {
        let cost = 75 * (saveData.hpLevel + 1);
        if (saveData.coins >= cost) { saveData.coins -= cost; saveData.hpLevel++; }
    } else if (type === 'goldSkin' && !saveData.goldSkin && saveData.coins >= 150) {
        saveData.coins -= 150; saveData.goldSkin = true;
    }
    saveGame(); openShop();
}

// --- ENGINE & SETUP ---
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let isPlaying = false, score = 0, screenShake = 0, modePlayers = 1;

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

let players = [], bullets = [], enemies = [], particles = [], coins = [];
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function createExplosion(x, y, color, count = 15) {
    for (let i = 0; i < count; i++) {
        let angle = Math.random() * Math.PI * 2, speed = 2 + Math.random() * 5;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1, decay: 0.03, color, r: 2 + Math.random() * 3 });
    }
}

function startGame(nbPlayers) {
    audio.init(); modePlayers = nbPlayers;
    players = [];
    
    // Joueur 1
    players.push({
        id: 1, x: canvas.width * (nbPlayers === 2 ? 0.35 : 0.5), y: canvas.height * 0.8,
        r: 18, hp: 100 + saveData.hpLevel * 25, color: saveData.goldSkin ? '#fffe00' : '#00f2fe',
        lastShot: 0, fireDelay: Math.max(70, 130 - saveData.fireRateLevel * 20)
    });

    // Joueur 2
    if (nbPlayers === 2) {
        players.push({
            id: 2, x: canvas.width * 0.65, y: canvas.height * 0.8,
            r: 18, hp: 100, color: '#ff007f', lastShot: 0, fireDelay: 130
        });
    }

    bullets = []; enemies = []; particles = []; coins = []; score = 0;
    document.getElementById('menu').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    document.getElementById('coins-val').textContent = saveData.coins;
    isPlaying = true;
    requestAnimationFrame(gameLoop);
}

function update() {
    // Déplacements & Tirs J1
    let p1 = players[0];
    if (p1 && p1.hp > 0) {
        if ((keys['KeyA'] || keys['KeyQ']) && p1.x > p1.r) p1.x -= 7;
        if (keys['KeyD'] && p1.x < canvas.width - p1.r) p1.x += 7;
        if ((keys['KeyW'] || keys['KeyZ']) && p1.y > p1.r) p1.y -= 7;
        if (keys['KeyS'] && p1.y < canvas.height - p1.r) p1.y += 7;
        if (keys['Space'] && Date.now() - p1.lastShot > p1.fireDelay) {
            audio.playShoot();
            bullets.push({ x: p1.x, y: p1.y - 15, vy: -16, color: p1.color });
            p1.lastShot = Date.now();
        }
    }

    // Déplacements & Tirs J2
    let p2 = players[1];
    if (p2 && p2.hp > 0) {
        if (keys['ArrowLeft'] && p2.x > p2.r) p2.x -= 7;
        if (keys['ArrowRight'] && p2.x < canvas.width - p2.r) p2.x += 7;
        if (keys['ArrowUp'] && p2.y > p2.r) p2.y -= 7;
        if (keys['ArrowDown'] && p2.y < canvas.height - p2.r) p2.y += 7;
        if (keys['Enter'] && Date.now() - p2.lastShot > p2.fireDelay) {
            audio.playShoot();
            bullets.push({ x: p2.x, y: p2.y - 15, vy: -16, color: p2.color });
            p2.lastShot = Date.now();
        }
    }

    // Bullets
    bullets.forEach((b, bi) => {
        b.y += b.vy; if (b.y < -20) bullets.splice(bi, 1);
    });

    // Spawn Ennemis
    if (Math.random() < 0.04) {
        enemies.push({
            x: Math.random() * (canvas.width - 60) + 30, y: -30,
            r: 18, hp: 2, speed: 3 + Math.random() * 2, color: '#ff0055'
        });
    }

    // Collisions Ennemis
    enemies.forEach((e, ei) => {
        e.y += e.speed;
        
        bullets.forEach((b, bi) => {
            if (Math.hypot(b.x - e.x, b.y - e.y) < b.vy ? 8 : 18) {
                e.hp--; bullets.splice(bi, 1);
                if (e.hp <= 0) {
                    audio.playExplosion(); createExplosion(e.x, e.y, e.color);
                    if (Math.random() < 0.6) coins.push({ x: e.x, y: e.y, vy: 2 });
                    score += 100; document.getElementById('score-val').textContent = score;
                    enemies.splice(ei, 1);
                }
            }
        });

        players.forEach(p => {
            if (p.hp > 0 && Math.hypot(p.x - e.x, p.y - e.y) < p.r + e.r) {
                audio.playExplosion(); createExplosion(e.x, e.y, '#ff0055');
                p.hp -= 30; enemies.splice(ei, 1);
            }
        });

        if (e.y > canvas.height + 40) enemies.splice(ei, 1);
    });

    // Pièces Néon
    coins.forEach((c, ci) => {
        c.y += c.vy;
        players.forEach(p => {
            if (p.hp > 0 && Math.hypot(p.x - c.x, p.y - c.y) < p.r + 15) {
                saveData.coins++; saveGame();
                document.getElementById('coins-val').textContent = saveData.coins;
                coins.splice(ci, 1);
            }
        });
    });

    // Verification fin de partie
    if (players.every(p => p.hp <= 0)) gameOver();

    // Particules
    particles.forEach((p, pi) => {
        p.x += p.vx; p.y += p.vy; p.life -= p.decay;
        if (p.life <= 0) particles.splice(pi, 1);
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Dessin Particules
    particles.forEach(p => {
        ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Pièces
    coins.forEach(c => {
        ctx.shadowBlur = 10; ctx.shadowColor = '#fffe00'; ctx.fillStyle = '#fffe00';
        ctx.beginPath(); ctx.arc(c.x, c.y, 6, 0, Math.PI * 2); ctx.fill();
    });

    // Tirs
    bullets.forEach(b => {
        ctx.shadowBlur = 10; ctx.shadowColor = b.color; ctx.fillStyle = b.color;
        ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
    });

    // Ennemis
    enemies.forEach(e => {
        ctx.shadowBlur = 12; ctx.shadowColor = e.color; ctx.fillStyle = e.color;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
    });

    // Joueurs
    players.forEach(p => {
        if (p.hp > 0) {
            ctx.shadowBlur = 15; ctx.shadowColor = p.color; ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - p.r); ctx.lineTo(p.x - p.r, p.y + p.r); ctx.lineTo(p.x + p.r, p.y + p.r);
            ctx.closePath(); ctx.fill();
        }
    });
}

function gameLoop() {
    if (!isPlaying) return;
    update(); draw(); requestAnimationFrame(gameLoop);
}

function gameOver() {
    isPlaying = false;
    document.getElementById('main-title').textContent = "Perdu";
    document.getElementById('menu').style.display = 'flex';
}
</script>
</body>
</html>
