<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rider - Play.Works Edition</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #020307;
            color: #fff; font-family: monospace; user-select: none;
        }

        #game-container {
            position: relative; width: 100vw; height: 100vh;
        }

        canvas { display: block; width: 100%; height: 100%; }

        .hud {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
            font-size: 1.5rem; font-weight: bold; pointer-events: none;
            z-index: 5;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px; border-radius: 6px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.1);
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 3, 7, 0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
        }

        h1 { font-size: 4.5rem; margin: 0 0 20px 0; letter-spacing: 5px; color: #00f2fe; text-shadow: 0 0 25px #00f2fe; }
        
        button {
            background: transparent; color: #00f2fe; border: 2px solid #00f2fe;
            padding: 15px 60px; font-size: 1.3rem; font-weight: bold; cursor: pointer;
            border-radius: 4px; transition: 0.2s; font-family: monospace;
        }
        button:hover { background: #00f2fe; color: #000; box-shadow: 0 0 25px #00f2fe; }

        .controls-tip {
            position: absolute; bottom: 25px; width: 100%; text-align: center;
            color: #4b5563; font-size: 1rem; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="neonCanvas"></canvas>
    
    <div class="hud">
        <div class="hud-item" style="color: #00f2fe;">SCORE: <span id="score">0</span></div>
        <div class="hud-item" style="color: #fffe00;">BEST: <span id="best">0</span></div>
    </div>

    <div id="game-overlay" class="overlay">
        <h1 id="menu-title">NEON RIDER</h1>
        <button id="actionBtn">START RIDE</button>
    </div>

    <div class="controls-tip">
        <strong style="color: #00f2fe;">[Z / W]</strong> Accélérer | <strong style="color: #00f2fe;">[Q / D] ou [FLÈCHES GAUCHE / DROITE]</strong> Flips & Équilibre
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
    authDomain: "blocplay-a9417.firebaseapp.com",
    projectId: "blocplay-a9417",
    storageBucket: "blocplay-a9417.firebasestorage.app",
    messagingSenderId: "540161549188",
    appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let uId = null, highscore = 0;

onAuthStateChanged(auth, (u) => {
    if (u) {
        uId = u.uid;
        get(child(ref(db), `neon_rider_playworks/${uId}`)).then((s) => {
            if (s.exists()) {
                highscore = s.val().best || 0;
                document.getElementById('best').textContent = highscore;
            }
        });
    }
});

const canvas = document.getElementById('neonCanvas');
const ctx = canvas.getContext('2d');

let isPlaying = false;
let score = 0;
let cameraX = 0, cameraY = 0;
let tracks = [];

const bike = {
    x: 100, y: 300,
    vx: 0, vy: 0,
    speed: 0,
    maxSpeed: 13,       // Vitesse arcade Play.Works
    accel: 0.28,
    friction: 0.99,
    gravity: 0.26,      // Gravité lissée pour de longs sauts
    angle: 0,
    isGrounded: false,
    radius: 12,
    flipTracker: 0
};

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Génération de pistes fluides (Grandes lignes droites, montées, sauts et réceptions amples)
function generateTracks() {
    tracks = [];
    let cx = 0, cy = canvas.height * 0.65;

    // Départ
    tracks.push({ x1: cx, y1: cy, x2: cx + 600, y2: cy });
    cx += 600;

    for(let i = 0; i < 30; i++) {
        // Zone de vitesse au sol
        let flatLength = 500 + Math.random() * 300;
        let nextY = cy + (Math.random() * 60 - 30);
        if (nextY > canvas.height * 0.8 || nextY < canvas.height * 0.4) nextY = canvas.height * 0.65;
        
        tracks.push({ x1: cx, y1: cy, x2: cx + flatLength, y2: nextY });
        cx += flatLength; cy = nextY;

        // Tremplin incliné
        let rampX = cx + 150;
        let rampY = cy - 60;
        tracks.push({ x1: cx, y1: cy, x2: rampX, y2: rampY });
        cx = rampX; cy = rampY;

        // Grand espace vide pour caler des flips
        let gap = 250 + Math.random() * 100;
        cx += gap;
        cy += 140; // Réception plus basse sécurisée

        // Zone de réception longue
        tracks.push({ x1: cx, y1: cy, x2: cx + 400, y2: cy });
        cx += 400;
    }
    // Ligne infinie
    tracks.push({ x1: cx, y1: cy, x2: cx + 5000, y2: cy });
}

const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function start() {
    generateTracks();
    bike.x = 150; bike.y = canvas.height * 0.4;
    bike.vx = 4; bike.vy = 0; bike.speed = 3;
    bike.angle = 0; bike.isGrounded = false;
    score = 0;
    
    document.getElementById('game-overlay').style.display = 'none';
    isPlaying = true;
    loop();
}

function updatePhysics() {
    // Accélération (Z ou W)
    if (keys['KeyW'] || keys['KeyZ']) {
        bike.speed = Math.min(bike.speed + bike.accel, bike.maxSpeed);
    } else {
        bike.speed *= bike.friction;
    }

    // Sensibilité des Flips (Flèches ou Q/D ou A/D)
    if (!bike.isGrounded) {
        if (keys['KeyA'] || keys['KeyQ'] || keys['ArrowLeft']) {
            bike.angle -= 0.10;
            bike.flipTracker -= 0.10;
        }
        if (keys['KeyD'] || keys['ArrowRight']) {
            bike.angle += 0.10;
            bike.flipTracker += 0.10;
        }

        // Détection flip complet
        if (Math.abs(bike.flipTracker) >= Math.PI * 2) {
            score += 1000;
            bike.flipTracker = 0;
        }
    } else {
        bike.flipTracker = 0;
    }

    if (bike.isGrounded) {
        bike.vx = Math.cos(bike.angle) * bike.speed;
        bike.vy = Math.sin(bike.angle) * bike.speed;
    } else {
        bike.vy += bike.gravity;
    }

    bike.x += bike.vx;
    bike.y += bike.vy;

    // Collisions
    let matchSurface = null;
    for (let t of tracks) {
        if (bike.x >= t.x1 && bike.x <= t.x2) {
            let pct = (bike.x - t.x1) / (t.x2 - t.x1);
            let yOnTrack = t.y1 + pct * (t.y2 - t.y1);
            
            if (bike.y + bike.radius >= yOnTrack && bike.vy >= -0.1 && bike.y - bike.radius <= yOnTrack + 12) {
                matchSurface = { y: yOnTrack, angle: Math.atan2(t.y2 - t.y1, t.x2 - t.x1) };
                break;
            }
        }
    }

    if (matchSurface) {
        let diff = bike.angle - matchSurface.angle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;

        if (!bike.isGrounded && Math.abs(diff) > 1.2) {
            crash();
            return;
        }

        bike.y = matchSurface.y - bike.radius;
        bike.isGrounded = true;
        bike.angle = bike.angle * 0.2 + matchSurface.angle * 0.8; // Alignement propre
    } else {
        bike.isGrounded = false;
    }

    cameraX = bike.x - (canvas.width * 0.3);
    cameraY = cameraY * 0.88 + (bike.y - (canvas.height * 0.6)) * 0.12;

    score += bike.vx * 0.12;
    document.getElementById('score').textContent = Math.floor(score);

    if (bike.y > canvas.height + 500) crash();
}

function draw() {
    ctx.fillStyle = '#020307';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, -cameraY);

    // Tracé de la piste unique bleu néon
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#00f2fe';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f2fe';
    ctx.beginPath();
    tracks.forEach((t, index) => {
        if (index === 0) ctx.moveTo(t.x1, t.y1);
        ctx.lineTo(t.x2, t.y2);
    });
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Rendu de la Cyber-Bike (Bloc de profil original)
    ctx.save();
    ctx.translate(bike.x, bike.y);
    ctx.rotate(bike.angle);

    ctx.fillStyle = '#00f2fe';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f2fe';

    // Forme bloc du véhicule original
    ctx.beginPath();
    ctx.moveTo(-18, 5);
    ctx.lineTo(-22, -5);
    ctx.lineTo(12, -5);
    ctx.lineTo(20, 5);
    ctx.closePath();
    ctx.fill();

    // Vitre blanche
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(-2, -5); ctx.lineTo(8, -5); ctx.lineTo(4, -10); ctx.lineTo(-4, -10);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
    ctx.restore();
}

function loop() {
    if (!isPlaying) return;
    updatePhysics();
    draw();
    requestAnimationFrame(loop);
}

function crash() {
    isPlaying = false;
    document.getElementById('menu-title').textContent = "CRASH !";
    document.getElementById('actionBtn').textContent = "RETRY RUN";
    document.getElementById('game-overlay').style.display = 'flex';

    if (score > highscore) {
        highscore = Math.floor(score);
        document.getElementById('best').textContent = highscore;
    }
    if (uId) set(ref(db, `neon_rider_playworks/${uId}`), { best: highscore });
}

document.getElementById('actionBtn').addEventListener('click', start);
</script>
</body>
</html>
