<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rider - Pro Physics Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #02040a;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 960px;
            height: 540px;
            background: #060913;
            border: 3px solid #fe0979;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(254, 9, 121, 0.25);
        }

        canvas {
            display: block;
        }

        .hud {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-family: monospace;
            font-size: 1.3rem;
            font-weight: bold;
            z-index: 5;
        }

        .hud-item {
            background: rgba(6, 9, 19, 0.85);
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 4, 10, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            z-index: 10;
        }

        h1 {
            font-size: 3.8rem;
            color: #00f2fe;
            text-shadow: 0 0 25px #00f2fe;
            margin: 0 0 15px 0;
            letter-spacing: 2px;
        }

        button {
            background: transparent;
            color: #fe0979;
            border: 2px solid #fe0979;
            padding: 12px 45px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(254, 9, 121, 0.2);
            transition: all 0.2s ease;
        }

        button:hover {
            background: #fe0979;
            color: #000;
            box-shadow: 0 0 25px #fe0979;
            transform: scale(1.05);
        }

        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #475569;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="neonCanvas" width="960" height="540"></canvas>
    
    <div class="hud">
        <div class="hud-item" style="color: #fe0979;">SCORE: <span id="score">0</span></div>
        <div class="hud-item" style="color: #00f2fe;">💎 <span id="gems">0</span></div>
        <div class="hud-item" style="color: #fffe00;">BEST: <span id="best">0</span></div>
    </div>

    <div id="game-overlay" class="overlay">
        <h1 id="menu-title">NEON RIDER</h1>
        <button id="actionBtn">RIDE</button>
    </div>

    <div class="controls">
        [Flèche Haut / Z] Accélérer | [Flèches Gauche - Droite / Q - D] Contrôle aérien sensible (Flips)
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// --- SYSTEME CLOUD FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
    authDomain: "blocplay-a9417.firebaseapp.com",
    projectId: "blocplay-a9417",
    storageBucket: "blocplay-a9417.firebasestorage.app",
    messagingSenderId: "540161549188",
    appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let uId = null, highscore = 0, totalGems = 0;

onAuthStateChanged(auth, (u) => {
    if (u) {
        uId = u.uid;
        get(child(ref(db), `neon_rider_v4/${uId}`)).then((s) => {
            if (s.exists()) {
                highscore = s.val().best || 0;
                totalGems = s.val().gems || 0;
                document.getElementById('best').textContent = highscore;
                document.getElementById('gems').textContent = totalGems;
            }
        });
    }
});

// --- CORE GAME ENGINE ---
const canvas = document.getElementById('neonCanvas');
const ctx = canvas.getContext('2d');

let isPlaying = false;
let score = 0;
let cameraX = 0, cameraY = 0;
let segments = [];
let diamonds = [];
let particles = [];

// Moto ultra-réactive
const bike = {
    x: 100, y: 200,
    vx: 0, vy: 0,
    speed: 0,
    maxSpeed: 8.5,
    accel: 0.22,
    friction: 0.985,
    gravity: 0.32,
    angle: 0,
    angularVelocity: 0,
    sensitivity: 0.095, // Sensibilité augmentée pour des flips nerveux
    isGrounded: false,
    radius: 14,
    flipTracker: 0
};

const themeColors = ['#00f2fe', '#fe0979', '#fffe00', '#00ff66'];
let activeColor = themeColors[0];

// Génération de terrain par segments disjoints (Trous et Grands Espaces)
function buildMap() {
    segments = [];
    diamonds = [];
    
    let currentX = 0;
    let currentY = 380;

    // Segment de départ sécurisé et plat
    segments.push({ x1: currentX, y1: currentY, x2: 400, y2: currentY });
    currentX = 400;

    for (let i = 0; i < 60; i++) {
        let type = Math.random();
        let segLength = 250 + Math.random() * 150;
        let nextX = currentX + segLength;
        let nextY = currentY;

        if (type < 0.35) {
            // Tremplin / Rampe de lancement agressive
            nextY = currentY - (70 + Math.random() * 50);
            segments.push({ x1: currentX, y1: currentY, x2: nextX, y2: nextY });
            
            // Grand espace (Trou) juste après le tremplin pour les galipettes
            let gapWidth = 180 + Math.random() * 140;
            
            // Pièces rabaissées situées pile sur l'arc de saut parabolique
            diamonds.push({ x: nextX + gapWidth / 2, y: nextY + 10, picked: false });
            
            currentX = nextX + gapWidth;
            currentY = nextY + 60; // Réception légèrement plus basse
        } else if (type < 0.7) {
            // Descente raide suivit d'un plat
            nextY = currentY + (50 + Math.random() * 40);
            if (nextY > 460) nextY = 420; // Anti-hors-limite
            segments.push({ x1: currentX, y1: currentY, x2: nextX, y2: nextY });
            
            // Pièce juste au-dessus du sol
            diamonds.push({ x: nextX - segLength / 2, y: (currentY + nextY) / 2 - 20, picked: false });
            currentX = nextX;
            currentY = nextY;
        } else {
            // Zone plate standard avec un trou classique au milieu
            segments.push({ x1: currentX, y1: currentY, x2: nextX, y2: nextY });
            diamonds.push({ x: nextX - segLength / 2, y: currentY - 20, picked: false });
            
            let simpleGap = 120 + Math.random() * 60;
            currentX = nextX + simpleGap;
        }
    }
    // Segment de fin virtuel de secours
    segments.push({ x1: currentX, y1: currentY, x2: currentX + 2000, y2: currentY });
}

const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function start() {
    activeColor = themeColors[Math.floor(Math.random() * themeColors.length)];
    buildMap();
    
    bike.x = 150; bike.y = 300;
    bike.vx = 3; bike.vy = 0; bike.speed = 0;
    bike.angle = 0; bike.angularVelocity = 0;
    bike.isGrounded = false;
    bike.flipTracker = 0;
    score = 0;
    particles = [];
    
    document.getElementById('game-overlay').style.display = 'none';
    isPlaying = true;
    engineLoop();
}

// Détection précise de collision par segment
function getSurface(x) {
    for (let seg of segments) {
        if (x >= seg.x1 && x <= seg.x2) {
            let t = (x - seg.x1) / (seg.x2 - seg.x1);
            let y = seg.y1 + t * (seg.y2 - seg.y1);
            let angle = Math.atan2(seg.y2 - seg.y1, seg.x2 - seg.x1);
            return { y, angle };
        }
    }
    return null; // On survole un trou (vide)
}

function update() {
    // 1. Propulsion mécanique
    if (keys['ArrowUp'] || keys['KeyW']) {
        bike.speed = Math.min(bike.speed + bike.accel, bike.maxSpeed);
    } else {
        bike.speed *= bike.friction;
    }

    // 2. Maniabilité & Sensibilité aérienne (Flips)
    if (!bike.isGrounded) {
        if (keys['ArrowLeft'] || keys['KeyA']) bike.angularVelocity = -bike.sensitivity;
        else if (keys['ArrowRight'] || keys['KeyD']) bike.angularVelocity = bike.sensitivity;
        else bike.angularVelocity *= 0.88; // Amortissement pour stopper net la rotation
        
        bike.angle += bike.angularVelocity;
        bike.flipTracker += bike.angularVelocity;

        // Validation d'une figure
        if (Math.abs(bike.flipTracker) >= Math.PI * 2) {
            score += 1200;
            bike.flipTracker = 0;
            for(let i=0; i<12; i++) {
                particles.push({ x: bike.x, y: bike.y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6, size: 3, color: '#00ff66', life: 1 });
            }
        }
    } else {
        bike.flipTracker = 0;
    }

    // Application des forces vectorielles
    if (bike.isGrounded) {
        bike.vx = Math.cos(bike.angle) * bike.speed;
        bike.vy = Math.sin(bike.angle) * bike.speed;
    } else {
        bike.vy += bike.gravity; // Gravité pure en plein vol
    }

    bike.x += bike.vx;
    bike.y += bike.vy;

    // Contact avec les segments physiques
    let surface = getSurface(bike.x);
    if (surface) {
        if (bike.y + bike.radius >= surface.y && bike.vy >= 0) {
            
            // Calcul de l'angle critique d'impact pour la bécane
            let diff = Math.abs(normalizeAngle(bike.angle - surface.angle));
            if (!bike.isGrounded && diff > 1.25) {
                crash();
                return;
            }

            bike.y = surface.y - bike.radius;
            bike.isGrounded = true;
            bike.angle = bike.angle * 0.45 + surface.angle * 0.55; // Alignement fluide
        } else {
            bike.isGrounded = false;
        }
    } else {
        bike.isGrounded = false; // La moto vole au-dessus d'un trou !
    }

    // Collecte des cristaux rabaissés
    diamonds.forEach(d => {
        if (!d.picked && Math.hypot(bike.x - d.x, bike.y - d.y) < bike.radius + 16) {
            d.picked = true;
            totalGems++;
            score += 200;
            document.getElementById('gems').textContent = totalGems;
        }
    });

    // Effet de traînée d'échappement (Particules)
    if (Math.random() > 0.3) {
        particles.push({
            x: bike.x - Math.cos(bike.angle)*15,
            y: bike.y - Math.sin(bike.angle)*5,
            vx: -bike.vx * 0.3 + (Math.random()-0.5),
            vy: (Math.random()-0.5),
            size: Math.random()*3 + 1,
            color: activeColor,
            life: 1
        });
    }

    particles.forEach((p, index) => {
        p.x += p.vx || 0; p.y += p.vy;
        p.life -= 0.03;
        if(p.life <= 0) particles.splice(index, 1);
    });

    // Caméra dynamique réajustée
    cameraX = bike.x - 220;
    cameraY = cameraY * 0.88 + (bike.y - 280) * 0.12;

    score += bike.vx * 0.12;
    document.getElementById('score').textContent = Math.floor(score);

    // Chute fatale au fond d'un trou
    if (bike.y > 650) crash();
}

function draw() {
    ctx.fillStyle = '#04060e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, -cameraY);

    // 1. Tracé des segments de terrain néon
    ctx.lineWidth = 5;
    ctx.strokeStyle = activeColor;
    ctx.shadowBlur = 14;
    ctx.shadowColor = activeColor;
    
    segments.forEach(seg => {
        // Optimisation : Ne dessiner que ce qui est visible à l'écran
        if (seg.x2 >= cameraX - 50 && seg.x1 <= cameraX + canvas.width + 50) {
            ctx.beginPath();
            ctx.moveTo(seg.x1, seg.y1);
            ctx.lineTo(seg.x2, seg.y2);
            ctx.stroke();
        }
    });
    ctx.shadowBlur = 0;

    // 2. Rendu des pièces de monnaie (Losanges)
    diamonds.forEach(d => {
        if (d.picked) return;
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.fillStyle = '#00f2fe';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#00f2fe';
        ctx.beginPath();
        ctx.moveTo(0, -9); ctx.lineTo(6, 0); ctx.lineTo(0, 9); ctx.lineTo(-6, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    });
    ctx.shadowBlur = 0;

    // 3. Rendu des effets de particules
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1.0;

    // 4. Rendu précis de la Moto de profil
    ctx.save();
    ctx.translate(bike.x, bike.y);
    ctx.rotate(bike.angle);

    ctx.shadowBlur = 10;
    ctx.shadowColor = activeColor;
    ctx.fillStyle = activeColor;

    // Deux roues de moto distinctes
    ctx.beginPath(); ctx.arc(-16, 5, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(16, 5, 8, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    // Cadre de la moto sportive
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-16, 5); ctx.lineTo(-4, -6); ctx.lineTo(8, -6); ctx.lineTo(16, 5);
    ctx.moveTo(-4, -6); ctx.lineTo(3, -13); ctx.lineTo(8, -6); // Guidon réhaussé
    ctx.stroke();

    ctx.restore();
    ctx.restore();
}

function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
}

function engineLoop() {
    if (!isPlaying) return;
    update();
    draw();
    requestAnimationFrame(engineLoop);
}

function crash() {
    isPlaying = false;
    document.getElementById('menu-title').textContent = "CRASH TOTAL";
    document.getElementById('actionBtn').textContent = "RE-RIDE";
    document.getElementById('game-overlay').style.display = 'flex';

    if (score > highscore) {
        highscore = Math.floor(score);
        document.getElementById('best').textContent = highscore;
    }
    if (uId) {
        set(ref(db, `neon_rider_v4/${uId}`), { best: highscore, gems: totalGems });
    }
}

document.getElementById('actionBtn').addEventListener('click', start);
</script>
</body>
</html>
