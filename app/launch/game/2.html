<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEAVE</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #010205;
            color: #fff; font-family: monospace; user-select: none;
        }

        #game-container {
            position: relative; width: 100vw; height: 100vh;
        }

        canvas { display: block; width: 100%; height: 100%; }

        .hud {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
            font-size: 1.5rem; font-weight: bold; pointer-events: none;
            z-index: 5;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px; border-radius: 4px;
            border: 1px solid #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 2, 5, 0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
        }

        h1 { font-size: 4.5rem; margin: 0 0 20px 0; letter-spacing: 5px; color: #00f2fe; text-shadow: 0 0 25px #00f2fe; }
        
        button {
            background: transparent; color: #00f2fe; border: 2px solid #00f2fe;
            padding: 15px 60px; font-size: 1.3rem; font-weight: bold; cursor: pointer;
            transition: 0.2s; font-family: monospace;
        }
        button:hover { background: #00f2fe; color: #000; box-shadow: 0 0 25px #00f2fe; }

        .controls-tip {
            position: absolute; bottom: 25px; width: 100%; text-align: center;
            color: #4b5563; font-size: 1rem; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="neonCanvas"></canvas>
    
    <div class="hud">
        <div class="hud-item" style="color: #00f2fe;">SCORE: <span id="score">LEAVE</span></div>
        <div class="hud-item" style="color: #fffe00;">💎: <span id="gems">LEAVE</span></div>
        <div class="hud-item" style="color: #fffe00;">BEST: <span id="best">LEAVE</span></div>
    </div>

    <div id="game-overlay" class="overlay">
        <h1 id="menu-title">LEAVE</h1>
        <button id="actionBtn">LEAVE</button>
    </div>

    <div class="controls-tip">
        <strong style="color: #00f2fe;">[Z / S] ou [HAUT / BAS]</strong> Avancer / Reculer au bord | <strong style="color: #00f2fe;">[Q / D] ou [GAUCHE / DROITE]</strong> Flips Réactifs
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
    authDomain: "blocplay-a9417.firebaseapp.com",
    projectId: "blocplay-a9417",
    storageBucket: "blocplay-a9417.firebasestorage.app",
    messagingSenderId: "540161549188",
    appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let uId = null, highscore = 0, totalGems = 0;

onAuthStateChanged(auth, (u) => {
    if (u) {
        uId = u.uid;
        get(child(ref(db), `neon_rider_fixed/${uId}`)).then((s) => {
            if (s.exists()) {
                highscore = s.val().best || 0;
                totalGems = s.val().gems || 0;
                document.getElementById('best').textContent = highscore;
                document.getElementById('gems').textContent = totalGems;
            }
        });
    }
});

const canvas = document.getElementById('neonCanvas');
const ctx = canvas.getContext('2d');

let isPlaying = false;
let score = 0;
let cameraX = 0, cameraY = 0;
let tracks = [];
let diamonds = [];

const bike = {
    x: 150, y: 300,
    vx: 0, vy: 0,
    speed: 0,
    maxSpeed: 13,
    maxReverse: -4,
    accel: 0.35,
    decel: 0.25,
    friction: 0.985,
    gravity: 0.42,      // Gravité équilibrée
    angle: 0,
    isGrounded: false,
    radius: 12,
    flipTracker: 0
};

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function generateTracks() {
    tracks = [];
    diamonds = [];
    let cx = 0, cy = canvas.height * 0.7;

    // Zone de départ (permet de reculer)
    tracks.push({ x1: -300, y1: cy, x2: 700, y2: cy });
    cx = 700;

    for(let i = 0; i < 40; i++) {
        // Ligne droite au sol
        let flatLength = 500 + Math.random() * 150;
        let nextY = cy + (Math.random() * 40 - 20);
        if (nextY > canvas.height * 0.85 || nextY < canvas.height * 0.5) nextY = canvas.height * 0.7;
        
        tracks.push({ x1: cx, y1: cy, x2: cx + flatLength, y2: nextY });
        cx += flatLength; cy = nextY;

        // Losanges au sol
        for (let j = 1; j <= 3; j++) {
            diamonds.push({ x: cx - (j * 100), y: cy - 20, picked: false });
        }

        // Tremplin d'élan
        let rampX = cx + 100;
        let rampY = cy - 60;
        tracks.push({ x1: cx, y1: cy, x2: rampX, y2: rampY });
        cx = rampX; cy = rampY;

        // ESPACE CORRIGÉ : Trous moins larges, sauts plus accessibles
        let gap = 240 + Math.random() * 80;
        
        // Losanges dans le vide
        diamonds.push({ x: cx + (gap * 0.5), y: cy + 30, picked: false });

        cx += gap;
        cy += 100; // Réception un peu plus basse pour assurer le coup

        // Plateforme de réception
        tracks.push({ x1: cx, y1: cy, x2: cx + 450, y2: cy });
        cx += 450;
    }
    tracks.push({ x1: cx, y1: cy, x2: cx + 5000, y2: cy });
}

const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function start() {
    generateTracks();
    bike.x = 100; bike.y = canvas.height * 0.5;
    bike.vx = 0; bike.vy = 0; bike.speed = 0;
    bike.angle = 0; bike.isGrounded = false;
    score = 0;
    
    document.getElementById('game-overlay').style.display = 'none';
    isPlaying = true;
    loop();
}

function updatePhysics() {
    if (keys['KeyW'] || keys['KeyZ'] || keys['ArrowUp']) {
        bike.speed = Math.min(bike.speed + bike.accel, bike.maxSpeed);
    } else if (keys['KeyS'] || keys['ArrowDown']) {
        bike.speed = Math.max(bike.speed - bike.decel, bike.maxReverse);
    } else {
        bike.speed *= bike.friction;
        if (Math.abs(bike.speed) < 0.05) bike.speed = 0;
    }

    if (!bike.isGrounded) {
        if (keys['KeyA'] || keys['KeyQ'] || keys['ArrowLeft']) {
            bike.angle -= 0.12;
            bike.flipTracker -= 0.12;
        }
        if (keys['KeyD'] || keys['ArrowRight']) {
            bike.angle += 0.12;
            bike.flipTracker += 0.12;
        }

        if (Math.abs(bike.flipTracker) >= Math.PI * 2) {
            score += 1000;
            bike.flipTracker = 0;
        }
    } else {
        bike.flipTracker = 0;
    }

    if (bike.isGrounded) {
        bike.vx = Math.cos(bike.angle) * bike.speed;
        bike.vy = Math.sin(bike.angle) * bike.speed;
    } else {
        bike.vy += bike.gravity;
    }

    bike.x += bike.vx;
    bike.y += bike.vy;

    // Frotter le bord gauche de l'écran sans bugger
    let minScreenX = cameraX + 20;
    if (bike.x < minScreenX) {
        bike.x = minScreenX;
        if (bike.vx < 0) bike.vx = 0;
        if (bike.speed < 0) bike.speed = 0;
    }

    // Système de collision strict (Segment par segment)
    let matchSurface = null;
    for (let t of tracks) {
        if (bike.x >= t.x1 && bike.x <= t.x2) {
            let pct = (bike.x - t.x1) / (t.x2 - t.x1);
            let yOnTrack = t.y1 + pct * (t.y2 - t.y1);
            
            if (bike.y + bike.radius >= yOnTrack && bike.vy >= -0.5 && bike.y - bike.radius <= yOnTrack + 12) {
                matchSurface = { y: yOnTrack, angle: Math.atan2(t.y2 - t.y1, t.x2 - t.x1) };
                break;
            }
        }
    }

    if (matchSurface) {
        let diff = bike.angle - matchSurface.angle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;

        if (!bike.isGrounded && Math.abs(diff) > 1.3) {
            crash();
            return;
        }

        bike.y = matchSurface.y - bike.radius;
        bike.isGrounded = true;
        bike.angle = bike.angle * 0.15 + matchSurface.angle * 0.85; 
    } else {
        bike.isGrounded = false;
    }

    diamonds.forEach(d => {
        if (!d.picked && Math.hypot(bike.x - d.x, bike.y - d.y) < bike.radius + 22) {
            d.picked = true;
            totalGems++;
            score += 200;
            document.getElementById('gems').textContent = totalGems;
        }
    });

    cameraX = Math.max(0, bike.x - (canvas.width * 0.25));
    cameraY = cameraY * 0.85 + (bike.y - (canvas.height * 0.6)) * 0.15;

    if (bike.vx > 0) score += bike.vx * 0.1;
    document.getElementById('score').textContent = Math.floor(score);

    if (bike.y > canvas.height + 600) crash();
}

function draw() {
    ctx.fillStyle = '#010205';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, -cameraY);

    // FIX : On lève le stylo entre chaque segment pour éviter les lignes fantômes
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#00f2fe';
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#00f2fe';
    
    tracks.forEach(t => {
        ctx.beginPath();
        ctx.moveTo(t.x1, t.y1);
        ctx.lineTo(t.x2, t.y2);
        ctx.stroke();
    });
    ctx.shadowBlur = 0;

    // Rendu des Losanges
    diamonds.forEach(d => {
        if (d.picked) return;
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.fillStyle = '#fffe00';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#fffe00';
        ctx.beginPath();
        ctx.moveTo(0, -10); ctx.lineTo(7, 0); ctx.lineTo(0, 10); ctx.lineTo(-7, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    });
    ctx.shadowBlur = 0;

    // Rendu de la Cyber-Bike
    ctx.save();
    ctx.translate(bike.x, bike.y);
    ctx.rotate(bike.angle);

    ctx.fillStyle = '#00f2fe';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f2fe';

    ctx.beginPath();
    ctx.moveTo(-18, 5);
    ctx.lineTo(-22, -5);
    ctx.lineTo(12, -5);
    ctx.lineTo(20, 5);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(-2, -5); ctx.lineTo(8, -5); ctx.lineTo(4, -10); ctx.lineTo(-4, -10);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
    ctx.restore();
}

function loop() {
    if (!isPlaying) return;
    updatePhysics();
    draw();
    requestAnimationFrame(loop);
}

function crash() {
    isPlaying = false;
    document.getElementById('menu-title').textContent = "LEAVE";
    document.getElementById('actionBtn').textContent = "LEAVE";
    document.getElementById('game-overlay').style.display = 'flex';

    if (score > highscore) {
        highscore = Math.floor(score);
        document.getElementById('best').textContent = highscore;
    }
    if (uId) set(ref(db, `neon_rider_fixed/${uId}`), { best: highscore, gems: totalGems });
}

document.getElementById('actionBtn').addEventListener('click', start);
</script>
</body>
</html>
