<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rider - Real Physics Edition</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #070b10;
            color: #fff; font-family: monospace; user-select: none;
        }

        #game-container {
            position: relative; width: 100vw; height: 100vh;
        }

        canvas { display: block; width: 100%; height: 100%; }

        .hud {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
            font-size: 1.8rem; font-weight: bold; pointer-events: none;
            z-index: 5;
        }

        .hud-item {
            background: rgba(7, 11, 16, 0.9);
            padding: 10px 20px; border-radius: 4px;
            border: 2px solid #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 11, 16, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
        }

        h1 { font-size: 5rem; margin: 0 0 10px 0; letter-spacing: 6px; color: #ff007f; text-shadow: 0 0 30px #ff007f; }
        p { font-size: 1.2rem; color: #a0aec0; margin-bottom: 30px; }
        
        button {
            background: transparent; color: #00f2fe; border: 3px solid #00f2fe;
            padding: 15px 60px; font-size: 1.5rem; font-weight: bold; cursor: pointer;
            transition: 0.2s; border-radius: 4px;
        }
        button:hover { background: #00f2fe; color: #000; box-shadow: 0 0 35px #00f2fe; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="neonCanvas"></canvas>
    
    <div class="hud">
        <div class="hud-item" style="color: #fff;">SCORE: <span id="score">0</span></div>
        <div class="hud-item" style="color: #ff007f;">💎: <span id="gems">0</span></div>
    </div>

    <div id="game-overlay" class="overlay">
        <h1 id="menu-title">NEON RIDER</h1>
        <p>Contrôles uniques : Utilisez uniquement les Flèches ou ZQSD / WASD</p>
        <button id="actionBtn">RIDE</button>
    </div>
</div>

<script>
const canvas = document.getElementById('neonCanvas');
const ctx = canvas.getContext('2d');

let isPlaying = false;
let score = 0;
let gemsCollected = 0;
let cameraX = 0, cameraY = 0;
let trackPoints = [];
let diamonds = [];
let obstacles = [];

const bike = {
    x: 200, y: 300,
    vx: 0, vy: 0,
    speed: 0,
    maxSpeed: 12,
    maxReverse: -4,
    accel: 0.3,
    decel: 0.25,
    friction: 0.985,
    gravity: 0.5,       // Physique lourde et réaliste
    angle: 0,
    angularVelocity: 0,
    isGrounded: false,
    radius: 16,         // Roues plus larges pour les calculs de collision réalistes
    flipTracker: 0
};

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function generateTrack() {
    trackPoints = [];
    diamonds = [];
    obstacles = [];

    let cx = 0;
    let cy = canvas.height * 0.65;
    
    trackPoints.push({ x: -600, y: cy });
    trackPoints.push({ x: 600, y: cy });
    cx = 600;

    for (let i = 0; i < 50; i++) {
        let type = Math.random();

        if (type < 0.4) {
            let len = 400 + Math.random() * 200;
            let targetY = cy + (Math.random() * 60 - 30);
            for(let j = 1; j <= 3; j++) {
                diamonds.push({ x: cx + (len * (j/4)), y: cy - 30, picked: false });
            }
            cx += len; cy = targetY;
            trackPoints.push({ x: cx, y: cy });
        } else {
            // Tremplin et zone aérienne pour les galipettes induites par la vitesse
            let launchLen = 180;
            let gap = 240 + Math.random() * 80;
            
            cx += launchLen; cy -= 50;
            trackPoints.push({ x: cx, y: cy });

            // Scie positionnée stratégiquement par rapport au saut
            obstacles.push({ x: cx + (gap / 2), y: cy + 30, radius: 26, rotation: 0 });
            diamonds.push({ x: cx + (gap / 2), y: cy - 50, picked: false });

            cx += gap; cy += 90;
            trackPoints.push({ x: cx, y: cy });

            cx += 300;
            trackPoints.push({ x: cx, y: cy });
        }
    }
    trackPoints.push({ x: cx + 5000, y: cy });
}

const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function start() {
    generateTrack();
    bike.x = 200; bike.y = canvas.height * 0.5;
    bike.vx = 0; bike.vy = 0; bike.speed = 0; bike.angle = 0;
    score = 0; gemsCollected = 0;
    document.getElementById('gems').textContent = gemsCollected;
    document.getElementById('game-overlay').style.display = 'none';
    isPlaying = true;
    loop();
}

function updatePhysics() {
    // --- CONTROLES PAR FLÈCHES UNIQUES (DÉPLACEMENT + ROTATION EN AIR) ---
    const goForward = keys['ArrowUp'] || keys['KeyW'] || keys['KeyZ'];
    const goBackward = keys['ArrowDown'] || keys['KeyS'];
    const rotateLeft = keys['ArrowLeft'] || keys['ArrowA'] || keys['KeyQ'];
    const rotateRight = keys['ArrowRight'] || keys['ArrowD'];

    if (bike.isGrounded) {
        // Au sol : Les flèches appliquent la traction mécanique
        if (goForward) bike.speed = Math.min(bike.speed + bike.accel, bike.maxSpeed);
        else if (goBackward) bike.speed = Math.max(bike.speed - bike.decel, bike.maxReverse);
        else bike.speed *= bike.friction;

        bike.vx = Math.cos(bike.angle) * bike.speed;
        bike.vy = Math.sin(bike.angle) * bike.speed;
        bike.angularVelocity = 0;
        bike.flipTracker = 0;
    } else {
        // En l'air : Les mêmes touches déclenchent les galipettes (flips)
        if (rotateLeft) bike.angularVelocity = -0.09;
        else if (rotateRight) bike.angularVelocity = 0.09;
        else bike.angularVelocity *= 0.9; // Stabilisation naturelle

        bike.angle += bike.angularVelocity;
        bike.flipTracker += bike.angularVelocity;
        bike.vy += bike.gravity;
        bike.vx *= 0.995; // Résistance de l'air réaliste

        // Calcul des points si flip complet réussi en l'air
        if (Math.abs(bike.flipTracker) >= Math.PI * 2) {
            score += 1000;
            bike.flipTracker = 0;
        }
    }

    bike.x += bike.vx;
    bike.y += bike.vy;

    // Freinage et butée réaliste contre la bordure gauche de la caméra
    let borderLeft = cameraX + 40;
    if (bike.x < borderLeft) {
        bike.x = borderLeft;
        if (bike.vx < 0) { bike.vx = 0; bike.speed = 0; }
    }

    // Gestion stricte des collisions continues sur la ligne
    let matchSurface = null;
    for (let i = 0; i < trackPoints.length - 1; i++) {
        let p1 = trackPoints[i]; let p2 = trackPoints[i+1];
        if (bike.x >= p1.x && bike.x <= p2.x) {
            let pct = (bike.x - p1.x) / (p2.x - p1.x);
            let yOnTrack = p1.y + pct * (p2.y - p1.y);
            
            if (bike.y + bike.radius >= yOnTrack && bike.y - bike.radius <= yOnTrack + 12 && bike.vy >= -1) {
                matchSurface = { y: yOnTrack, angle: Math.atan2(p2.y - p1.y, p2.x - p1.x) };
                break;
            }
        }
    }

    if (matchSurface) {
        let diff = bike.angle - matchSurface.angle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;

        // Crash réaliste si l'angle d'impact au sol est inversé (dos ou tête la première)
        if (!bike.isGrounded && Math.abs(diff) > 1.4) {
            crash("CRASH ! Mauvais angle de réception");
            return;
        }

        bike.y = matchSurface.y - bike.radius;
        bike.vy = 0;
        if (!bike.isGrounded) {
            bike.isGrounded = true;
            bike.angle = matchSurface.angle; // Plaquage des roues immédiat
        } else {
            bike.angle = bike.angle * 0.2 + matchSurface.angle * 0.8;
        }
    } else {
        bike.isGrounded = false;
    }

    // Pièges (scies motorisées)
    obstacles.forEach(obs => {
        obs.rotation += 0.12;
        if (Math.hypot(bike.x - obs.x, bike.y - obs.y) < obs.radius + bike.radius - 4) {
            crash("DÉTRUIT ! Obstacle percuté");
        }
    });

    // Collecte des cristaux
    diamonds.forEach(d => {
        if (!d.picked && Math.hypot(bike.x - d.x, bike.y - d.y) < bike.radius + 18) {
            d.picked = true;
            gemsCollected++;
            document.getElementById('gems').textContent = gemsCollected;
        }
    });

    // Tracking caméra cinématique
    cameraX = bike.x - (canvas.width * 0.35);
    cameraY = cameraY * 0.88 + (bike.y - (canvas.height * 0.6)) * 0.12;

    if (bike.vx > 0) score += bike.vx * 0.08;
    document.getElementById('score').textContent = Math.floor(score);

    if (bike.y > canvas.height + 500) crash("GAME OVER ! Chute dans le vide");
}

function draw() {
    ctx.fillStyle = '#070b10';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, -cameraY);

    // Ligne continue lumineuse
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#00f2fe';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f2fe';
    ctx.beginPath();
    trackPoints.forEach((p, idx) => {
        if (idx === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Cristaux roses
    diamonds.forEach(d => {
        if (d.picked) return;
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.fillStyle = '#ff007f';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff007f';
        ctx.beginPath();
        ctx.moveTo(0, -12); ctx.lineTo(8, 0); ctx.lineTo(0, 12); ctx.lineTo(-8, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    });
    ctx.shadowBlur = 0;

    // Obstacles scies
    obstacles.forEach(obs => {
        ctx.save();
        ctx.translate(obs.x, obs.y);
        ctx.rotate(obs.rotation);
        ctx.fillStyle = '#ff2a2a';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff2a2a';
        ctx.beginPath();
        for (let j = 0; j < 12; j++) {
            let angle = (j / 12) * Math.PI * 2;
            ctx.lineTo(Math.cos(angle) * obs.radius, Math.sin(angle) * obs.radius);
            ctx.lineTo(Math.cos(angle + 0.1) * (obs.radius - 6), Math.sin(angle + 0.1) * (obs.radius - 6));
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    });
    ctx.shadowBlur = 0;

    // --- REPRODUCTION DU DESIGN MOTO NÉON FIDÈLE ---
    ctx.save();
    ctx.translate(bike.x, bike.y);
    ctx.rotate(bike.angle);

    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ff007f';

    // Roues néon
    ctx.strokeStyle = '#ff007f';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(-16, 4, 8, 0, Math.PI*2); ctx.stroke(); // Roue arrière
    ctx.beginPath(); ctx.arc(16, 4, 8, 0, Math.PI*2); ctx.stroke();  // Roue avant

    // Châssis compact profilé cyber
    ctx.fillStyle = '#ff007f';
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.lineTo(-6, -10);
    ctx.lineTo(8, -10);
    ctx.lineTo(14, 0);
    ctx.closePath();
    ctx.fill();

    // Verrière cockpit
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(-2, -10); ctx.lineTo(6, -10); ctx.lineTo(3, -15); ctx.lineTo(-1, -15);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
    ctx.restore();
}

function loop() {
    if (!isPlaying) return;
    updatePhysics();
    draw();
    requestAnimationFrame(loop);
}

function crash(msg) {
    isPlaying = false;
    document.getElementById('menu-title').textContent = msg;
    document.getElementById('game-overlay').style.display = 'flex';
}

document.getElementById('actionBtn').addEventListener('click', start);
</script>
</body>
</html>
