<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rider - BlocPlay Edition</title>
    <style>
        :root {
            --bg-dark: #04060f;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 950px;
            height: 550px;
            border: 2px solid #1e293b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
        }

        canvas {
            display: block;
            background: radial-gradient(circle at center, #0f1322 0%, #03050b 100%);
        }

        /* --- INTERFACE HUD --- */
        .hud {
            position: absolute;
            top: 20px;
            left: 25px;
            right: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
            pointer-events: none;
            font-family: monospace;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        .word-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 15px;
            border-radius: 20px;
            letter-spacing: 4px;
            font-size: 1.3rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .word-letter { color: rgba(255,255,255,0.2); }
        .word-letter.collected { color: #00ff66; text-shadow: 0 0 10px #00ff66; }

        .stats-group div { margin-bottom: 4px; }
        .blue-text { color: #00f2fe; text-shadow: 0 0 8px #00f2fe; }

        /* --- INTERFACE DE FIN --- */
        #game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 6, 15, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 3.8rem;
            margin: 0 0 10px 0;
            letter-spacing: 3px;
        }

        button {
            background: transparent;
            border: 2px solid currentColor;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        button:hover {
            background: white;
            color: #000 !important;
        }

        .controls-guide {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: #475569;
            text-align: center;
            line-height: 1.5;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="riderCanvas" width="950" height="550"></canvas>
    
    <div class="hud">
        <div class="stats-group">
            <div>SCORE: <span id="score">0</span></div>
            <div>💎 PIÈCES: <span id="diamonds" class="blue-text">0</span></div>
        </div>

        <div class="word-container" id="word-hud">
            <span class="word-letter" id="L-N">N</span>
            <span class="word-letter" id="L-E">E</span>
            <span class="word-letter" id="L-O">O</span>
            <span class="word-letter" id="L-N2">N</span>
        </div>

        <div class="stats-group" style="text-align: right;">
            <div>BEST SCORE: <span id="best-score">0</span></div>
            <div>TOTAL 💎: <span id="total-diamonds" class="blue-text">0</span></div>
        </div>
    </div>

    <div id="game-over">
        <h1 id="go-title">CRASH</h1>
        <p style="color: #94a3b8; margin-bottom: 25px; font-size: 1.2rem;">Score de la session: <span id="final-score">0</span></p>
        <button id="restartBtn">Relancer un Ride</button>
    </div>

    <div class="controls-guide">
        MOTO : <strong>Flèche Gauche / Droite</strong> pour gérer les galipettes (Flips) en l'air<br>
        VITESSE : La moto accélère automatiquement. Restez droit pour ne pas crasher la tête !
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// --- FIREBASE INFRA ---
const firebaseConfig = {
    apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
    authDomain: "blocplay-a9417.firebaseapp.com",
    projectId: "blocplay-a9417",
    storageBucket: "blocplay-a9417.firebasestorage.app",
    messagingSenderId: "540161549188",
    appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let userUID = null;
let cloudBestScore = 0;
let cloudTotalDiamonds = 0;

onAuthStateChanged(auth, (user) => {
    if (user) {
        userUID = user.uid;
        get(child(ref(db), `neon_rider_v2/${userUID}`)).then((snap) => {
            if (snap.exists()) {
                const data = snap.val();
                cloudBestScore = data.bestScore || 0;
                cloudTotalDiamonds = data.totalDiamonds || 0;
                document.getElementById('best-score').textContent = cloudBestScore;
                document.getElementById('total-diamonds').textContent = cloudTotalDiamonds;
            }
        });
    }
});

function syncToCloud() {
    if (!userUID) return;
    set(ref(db, `neon_rider_v2/${userUID}`), {
        bestScore: cloudBestScore,
        totalDiamonds: cloudTotalDiamonds
    });
}

// --- CONTEXTE DU MOTEUR DE JEU ---
const canvas = document.getElementById('riderCanvas');
const ctx = canvas.getContext('2d');

// Palettes thématiques globales pour changer toute la charte graphique à chaque reset
const themes = [
    { name: 'Cyan Vortex', color: '#00f2fe' },
    { name: 'Pink Cyber', color: '#fe0979' },
    { name: 'Volt Yellow', color: '#fffe00' },
    { name: 'Acid Green', color: '#00ff66' },
    { name: 'Plasma Purple', color: '#a855f7' }
];

let currentTheme = themes[0];
let gameActive = true;
let score = 0;
let sessionDiamonds = 0;
let cameraX = 0;

// Gestion du mot bonus "NEON"
let wordStatus = { N: false, E: false, O: false, N2: false };

// Physique de la Moto
const bike = {
    x: 100, y: 200,
    vx: 4.5, vy: 0,
    radius: 14,
    angle: 0,
    angularVelocity: 0,
    gravity: 0.35,
    isGrounded: false,
    airRotationAccumulator: 0 // Permet de compter les 360° pour les figures
};

// Objets sur la piste
let items = [];

// Fonction mathématique pour générer des collines fluides et des rampes de saut
function getTerrainY(x) {
    // Crée une alternance naturelle de plats, de descentes et de tremplins
    let base = 380;
    let hill1 = Math.sin(x * 0.004) * 70;
    let hill2 = Math.cos(x * 0.0015) * 40;
    // Ajout de tremplins abrupts spécifiques à intervalles réguliers
    let ramp = 0;
    if (x % 800 > 550 && x % 800 < 650) {
        ramp = -Math.sin(((x % 800) - 550) * (Math.PI / 100)) * 60;
    }
    return base + hill1 + hill2 + ramp;
}

// Génération procédurale des collectibles (losanges bleus et lettres) autour de la piste
function generateItemsForRange(startX, endX) {
    for (let x = startX; x < endX; x += 130) {
        if (Math.random() > 0.4) {
            let type = 'diamond';
            let label = '';
            
            // 10% de chance de faire apparaître une lettre à la place d'un losange
            if (Math.random() < 0.15) {
                type = 'letter';
                const pool = ['N', 'E', 'O', 'N2'];
                label = pool[Math.floor(Math.random() * pool.length)];
            }

            items.push({
                x: x,
                y: getTerrainY(x) - 45 - (Math.random() * 30),
                type: type,
                label: label,
                collected: false
            });
        }
    }
}

// Touches enfoncées
const keys = {};
window.addEventListener('keydown', (e) => { keys[e.key] = true; });
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

// Initialisation et choix aléatoire du thème visuel uniforme
function initGame() {
    // 1. Choix du thème graphique pour TOUTE la piste et le véhicule
    currentTheme = themes[Math.floor(Math.random() * themes.length)];
    
    // 2. Reset des paramètres de jeu
    gameActive = true;
    score = 0;
    sessionDiamonds = 0;
    cameraX = 0;
    wordStatus = { N: false, E: false, O: false, N2: false };
    
    bike.x = 100; bike.y = 150;
    bike.vx = 4.5; bike.vy = 0;
    bike.angle = 0; bike.angularVelocity = 0;
    bike.airRotationAccumulator = 0;
    
    items = [];
    generateItemsForRange(200, 3000);
    
    // Rafraîchir l'interface
    document.getElementById('game-over').style.display = 'none';
    document.getElementById('diamonds').textContent = "0";
    
    // Reset graphique des lettres du HUD
    document.querySelectorAll('.word-letter').forEach(el => el.classList.remove('collected'));
    
    loop();
}

function updatePhysics() {
    // Avancement et cinématique de la caméra de suivi
    bike.x += bike.vx;
    cameraX = bike.x - 180;

    // Application de la gravité en l'air
    bike.vy += bike.gravity;
    bike.y += bike.vy;

    let groundY = getTerrainY(bike.x);

    // Système d'évaluation des rotations en plein vol (Galipettes)
    if (!bike.isGrounded) {
        if (keys['ArrowLeft']) bike.angularVelocity = -0.07;
        else if (keys['ArrowRight']) bike.angularVelocity = 0.07;
        else bike.angularVelocity *= 0.92; // Léger amorti de rotation

        bike.angle += bike.angularVelocity;
        bike.airRotationAccumulator += bike.angularVelocity;

        // Détection d'un flip complet (360° = ~6.28 radians)
        if (Math.abs(bike.airRotationAccumulator) >= Math.PI * 2) {
            score += 500; // Bonus grosse figure !
            bike.airRotationAccumulator = 0; // Reset pour le enchaînements
            createFloatingText("BACKFLIP BONUS ! +500", bike.x, bike.y - 40, "#00ff66");
        }
    } else {
        bike.airRotationAccumulator = 0; // Au sol, on ne charge pas de figure
    }

    // Gestion de l'impact au sol
    if (bike.y + bike.radius >= groundY) {
        bike.y = groundY - bike.radius;
        bike.vy = 0;

        // Calcul de la pente du terrain pour aligner la moto
        let slope = (getTerrainY(bike.x + 4) - getTerrainY(bike.x - 4)) / 8;
        let targetAngle = Math.atan(slope);

        // VÉRIFICATION DU CRASH : Si l'angle d'impact de la tête ou du châssis est trop violent
        let angleDiff = Math.abs(normalizeAngle(bike.angle - targetAngle));
        if (!bike.isGrounded && angleDiff > Math.PI / 2.2) {
            triggerGameOver("CRASH ASSIETTE");
            return;
        }

        bike.isGrounded = true;
        // Alignement fluide à la ligne de la piste
        bike.angle = bike.angle * 0.4 + targetAngle * 0.6;
    } else {
        bike.isGrounded = false;
    }

    // Génération continue de la piste à l'infini
    if (bike.x > items[items.length - 10].x) {
        let lastX = items[items.length - 1].x;
        generateItemsForRange(lastX + 130, lastX + 2500);
    }

    // Traitement des collisions avec les losanges et les lettres
    items.forEach(item => {
        if (!item.collected && Math.hypot(bike.x - item.x, bike.y - item.y) < bike.radius + 18) {
            item.collected = true;
            if (item.type === 'diamond') {
                sessionDiamonds++;
                cloudTotalDiamonds++;
                score += 100;
                document.getElementById('diamonds').textContent = sessionDiamonds;
                document.getElementById('total-diamonds').textContent = cloudTotalDiamonds;
            } else if (item.type === 'letter') {
                score += 300;
                if (item.label === 'N' && !wordStatus.N) { wordStatus.N = true; document.getElementById('L-N').classList.add('collected'); }
                else if (item.label === 'E' && !wordStatus.E) { wordStatus.E = true; document.getElementById('L-E').classList.add('collected'); }
                else if (item.label === 'O' && !wordStatus.O) { wordStatus.O = true; document.getElementById('L-O').classList.add('collected'); }
                else if (item.label === 'N2' && !wordStatus.N2) { wordStatus.N2 = true; document.getElementById('L-N2').classList.add('collected'); }
                
                // Si le mot complet NEON est validé
                if (wordStatus.N && wordStatus.E && wordStatus.O && wordStatus.N2) {
                    score += 2000;
                    createFloatingText("MOT COMPLET ! +2000", bike.x, bike.y - 50, "#fffe00");
                    // Reset pour pouvoir le refaire plus loin
                    wordStatus = { N: false, E: false, O: false, N2: false };
                    setTimeout(() => {
                        document.querySelectorAll('.word-letter').forEach(el => el.classList.remove('collected'));
                    }, 1000);
                }
            }
        }
    });

    // Score passif basé sur la distance parcourue
    score += 1;
    document.getElementById('score').textContent = Math.floor(score);
}

// Utilitaire pour normaliser les angles entre -PI et +PI
function normalizeAngle(angle) {
    while (angle > Math.PI) angle -= Math.PI * 2;
    while (angle < -Math.PI) angle += Math.PI * 2;
    return angle;
}

// Effet de texte flottant lors des bonus
let floatingTexts = [];
function createFloatingText(txt, x, y, col) {
    floatingTexts.push({ text: txt, x: x, y: y, color: col, timer: 50 });
}

function drawElements() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, 0);

    // 1. DESSIN DE LA PISTE (Prend la couleur globale du run)
    ctx.shadowBlur = 12;
    ctx.shadowColor = currentTheme.color;
    ctx.strokeStyle = currentTheme.color;
    ctx.lineWidth = 5;
    ctx.beginPath();
    
    let startViewX = cameraX - 50;
    let endViewX = cameraX + canvas.width + 50;
    
    ctx.moveTo(startViewX, getTerrainY(startViewX));
    for (let x = startViewX; x < endViewX; x += 6) {
        ctx.lineTo(x, getTerrainY(x));
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 2. DESSIN DES COLLECTIBLES (Losanges Bleus & Lettres)
    items.forEach(item => {
        if (item.collected || item.x < startViewX || item.x > endViewX) return;

        ctx.save();
        ctx.translate(item.x, item.y);

        if (item.type === 'diamond') {
            // Losange Bleu Lumineux (Identitaire)
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00f2fe';
            ctx.fillStyle = '#00f2fe';
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(7, 0);
            ctx.lineTo(0, 10);
            ctx.lineTo(-7, 0);
            ctx.closePath();
            ctx.fill();
        } else {
            // Lettres de mots
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#fffe00';
            ctx.fillStyle = '#fffe00';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(item.label.replace('2',''), 0, 6);
        }
        ctx.restore();
    });
    ctx.shadowBlur = 0;

    // 3. DESSIN DE LA MOTO (Prend la couleur globale du run)
    ctx.save();
    ctx.translate(bike.x, bike.y);
    ctx.rotate(bike.angle);

    ctx.shadowBlur = 15;
    ctx.shadowColor = currentTheme.color;
    ctx.fillStyle = currentTheme.color;

    // Roues lumineuses
    ctx.beginPath();
    ctx.arc(-16, 6, 8, 0, Math.PI * 2);
    ctx.arc(16, 6, 8, 0, Math.PI * 2);
    ctx.fill();

    // Châssis néon de la moto
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-16, 6);
    ctx.lineTo(-4, -6);
    ctx.lineTo(12, -6);
    ctx.lineTo(16, 6);
    ctx.closePath();
    ctx.stroke();

    ctx.restore();
    ctx.shadowBlur = 0;

    // Dessin des textes flottants
    floatingTexts.forEach((ft, index) => {
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 14px monospace';
        ctx.fillText(ft.text, ft.x, ft.y);
        ft.y -= 1;
        ft.timer--;
        if (ft.timer <= 0) floatingTexts.splice(index, 1);
    });

    ctx.restore();
}

function loop() {
    if (!gameActive) return;
    updatePhysics();
    drawElements();
    requestAnimationFrame(loop);
}

function triggerGameOver(reason) {
    gameActive = false;
    
    const goScreen = document.getElementById('game-over');
    const goTitle = document.getElementById('go-title');
    
    goTitle.style.color = currentTheme.color;
    goTitle.style.textShadow = `0 0 20px ${currentTheme.color}`;
    document.getElementById('final-score').textContent = Math.floor(score);
    
    goScreen.style.display = 'flex';

    // Sauvegarde Cloud si le score bat le record
    if (score > cloudBestScore) {
        cloudBestScore = Math.floor(score);
        document.getElementById('best-score').textContent = cloudBestScore;
    }
    syncToCloud();
}

document.getElementById('restartBtn').addEventListener('click', initGame);

// Lancement automatique du premier Ride
initGame();
</script>

</body>
</html>
