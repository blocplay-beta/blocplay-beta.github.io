<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rider - Real Bike Physics</title>
    <style>
        body {
            margin: 0;
            background-color: #030712;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 960px;
            height: 540px;
            background: #0b0f19;
            border: 3px solid #00f2fe;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
        }

        canvas {
            display: block;
        }

        .hud {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-family: monospace;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .hud-item {
            background: rgba(11, 15, 25, 0.8);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            color: #fe0979;
            text-shadow: 0 0 20px #fe0979;
            margin: 0 0 20px 0;
        }

        button {
            background: transparent;
            color: #00f2fe;
            border: 2px solid #00f2fe;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            transition: 0.2s ease;
        }

        button:hover {
            background: #00f2fe;
            color: #000;
            box-shadow: 0 0 25px #00f2fe;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #4b5563;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="bikeCanvas" width="960" height="540"></canvas>
    
    <div class="hud">
        <div class="hud-item" style="color: #00f2fe;">SCORE: <span id="score">0</span></div>
        <div class="hud-item" style="color: #38bdf8;">💎 <span id="gems">0</span></div>
        <div class="hud-item" style="color: #fffe00;">BEST: <span id="best">0</span></div>
    </div>

    <div id="menu-overlay" class="overlay">
        <h1 id="menu-title">NEON RIDER</h1>
        <button id="startBtn">LANCER LE RIDE</button>
    </div>

    <div class="instructions">
        [Flèche Haut / Z] Accélérer | [Flèches Gauche - Droite / Q - D] Équilibre & Flips en l'air
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// --- CONFIGURATION CLOUD FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
    authDomain: "blocplay-a9417.firebaseapp.com",
    projectId: "blocplay-a9417",
    storageBucket: "blocplay-a9417.firebasestorage.app",
    messagingSenderId: "540161549188",
    appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let uId = null, highscore = 0, totalGems = 0;

onAuthStateChanged(auth, (u) => {
    if (u) {
        uId = u.uid;
        get(child(ref(db), `neon_rider_v3/${uId}`)).then((s) => {
            if (s.exists()) {
                highscore = s.val().best || 0;
                totalGems = s.val().gems || 0;
                document.getElementById('best').textContent = highscore;
                document.getElementById('gems').textContent = totalGems;
            }
        });
    }
});

// --- MOTEUR DU JEU ---
const canvas = document.getElementById('bikeCanvas');
const ctx = canvas.getContext('2d');

let isPlaying = false;
let score = 0;
let cameraX = 0, cameraY = 0;
let trackPoints = [];
let diamonds = [];
let bikeTrail = [];

// Définition de la Moto avec vraie physique Newtonienne
const bike = {
    x: 100, y: 200,
    vx: 0, vy: 0,
    speed: 0,
    maxSpeed: 7,
    accel: 0.15,
    friction: 0.98,
    gravity: 0.28,
    angle: 0,
    angularVelocity: 0,
    isGrounded: false,
    radius: 15,
    flipCount: 0
};

// Couleurs aléatoires appliquées à la piste entière à chaque essai
const themeColors = ['#00f2fe', '#fe0979', '#fffe00', '#00ff66', '#a855f7'];
let activeColor = themeColors[0];

// Construction manuelle d'un circuit technique amusant (Lignes droites, creux et vrais tremplins de saut)
function generateMap() {
    trackPoints = [];
    let cx = 0, cy = 380;
    trackPoints.push({x: cx, y: cy});

    // Patterns répétés pour créer un niveau cohérent
    for (let i = 0; i < 80; i++) {
        let r = Math.random();
        if (r < 0.3) { // Ligne droite pour prendre de la vitesse
            cx += 200;
        } else if (r < 0.65) { // Un grand tremplin incliné vers le haut
            cx += 180;
            cy -= 80;
        } else { // Descente pour accélérer
            cx += 220;
            cy += 70;
        }
        trackPoints.push({x: cx, y: cy});
    }

    // Ajout des losanges bleus au-dessus des bosses
    diamonds = [];
    for (let i = 1; i < trackPoints.length; i++) {
        if (Math.random() > 0.4) {
            diamonds.push({
                x: trackPoints[i].x - 80,
                y: trackPoints[i].y - 50 - Math.random() * 60,
                picked: false
            });
        }
    }
}

// Clavier
const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function startRun() {
    activeColor = themeColors[Math.floor(Math.random() * themeColors.length)];
    generateMap();
    
    bike.x = 100; bike.y = 250;
    bike.vx = 2; bike.vy = 0; bike.speed = 0;
    bike.angle = 0; bike.angularVelocity = 0;
    bike.isGrounded = false;
    bikeTrail = [];
    score = 0;
    
    document.getElementById('menu-overlay').style.display = 'none';
    isPlaying = true;
    runLoop();
}

// Trouver l'altitude et la pente du sol sous la coordonnée X de la moto
function getTrackAt(x) {
    for (let i = 0; i < trackPoints.length - 1; i++) {
        let p1 = trackPoints[i], p2 = trackPoints[i+1];
        if (x >= p1.x && x <= p2.x) {
            let pct = (x - p1.x) / (p2.x - p1.x);
            let y = p1.y + pct * (p2.y - p1.y);
            let angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
            return { y, angle };
        }
    }
    return null;
}

function updatePhysics() {
    // 1. Gestion des contrôles utilisateurs
    if (keys['ArrowUp'] || keys['KeyW']) {
        bike.speed = Math.min(bike.speed + bike.accel, bike.maxSpeed);
    } else {
        bike.speed *= bike.friction; // Ralentissement naturel
    }

    // Contrôle d'équilibre et figures en l'air (Flips)
    if (!bike.isGrounded) {
        if (keys['ArrowLeft'] || keys['KeyA']) bike.angularVelocity = -0.06;
        else if (keys['ArrowRight'] || keys['KeyD']) bike.angularVelocity = 0.06;
        else bike.angularVelocity *= 0.9;
        
        bike.angle += bike.angularVelocity;
        bike.flipCount += bike.angularVelocity;

        // Détection d'un flip complet réussi
        if (Math.abs(bike.flipCount) >= Math.PI * 2) {
            score += 1000;
            bike.flipCount = 0;
        }
    } else {
        bike.flipCount = 0; // Remise à zéro au sol
    }

    // Traduction des forces physiques (Vitesse en fonction de l'angle de la moto)
    if (bike.isGrounded) {
        bike.vx = Math.cos(bike.angle) * bike.speed;
        bike.vy = Math.sin(bike.angle) * bike.speed;
    } else {
        // En l'air : inertie cinétique + gravité pure
        bike.vy += bike.gravity;
    }

    bike.x += bike.vx;
    bike.y += bike.vy;

    // 2. Détection du sol et de l'envol (Launch Physics)
    let ground = getTrackAt(bike.x);
    if (ground) {
        // La moto ne se plaque au sol QUE si elle tombe dessus par le haut
        if (bike.y + bike.radius >= ground.y && bike.vy >= 0) {
            
            // CRASH CONDITION : Si la moto arrive sur le toit (angle trop inversé)
            let diffAngle = Math.abs(normalizeAngle(bike.angle - ground.angle));
            if (!bike.isGrounded && diffAngle > 1.3) {
                crash();
                return;
            }

            bike.y = ground.y - bike.radius;
            bike.isGrounded = true;
            
            // La moto s'aligne progressivement à la pente du sol
            bike.angle = bike.angle * 0.6 + ground.angle * 0.4;
        } else {
            // Décollage naturel sur le tremplin si la vitesse verticale est plus forte que la pente !
            bike.isGrounded = false;
        }
    }

    // Gestion de la traînée lumineuse (Trail)
    bikeTrail.push({x: bike.x, y: bike.y});
    if (bikeTrail.length > 25) bikeTrail.shift();

    // Ramassage des losanges
    diamonds.forEach(d => {
        if (!d.picked && Math.hypot(bike.x - d.x, bike.y - d.y) < bike.radius + 15) {
            d.picked = true;
            totalGems++;
            score += 250;
            document.getElementById('gems').textContent = totalGems;
        }
    });

    // Déplacement fluide de la caméra
    cameraX = bike.x - 200;
    cameraY = cameraY * 0.9 + (bike.y - 300) * 0.1;

    score += bike.vx * 0.1;
    document.getElementById('score').textContent = Math.floor(score);

    if (bike.y > 1000) crash(); // Chute dans le vide
}

function drawGame() {
    ctx.fillStyle = '#05070f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, -cameraY);

    // 1. Dessiner la traînée lumineuse néon derrière la moto
    if (bikeTrail.length > 1) {
        ctx.beginPath();
        ctx.strokeStyle = activeColor;
        ctx.lineWidth = 4;
        ctx.globalAlpha = 0.4;
        ctx.moveTo(bikeTrail[0].x, bikeTrail[0].y);
        for(let p of bikeTrail) ctx.lineTo(p.x, p.y);
        ctx.stroke();
        ctx.globalAlpha = 1.0;
    }

    // 2. Dessiner le circuit vectoriel fluide
    ctx.beginPath();
    ctx.lineWidth = 6;
    ctx.strokeStyle = activeColor;
    ctx.shadowBlur = 15;
    ctx.shadowColor = activeColor;
    ctx.moveTo(trackPoints[0].x, trackPoints[0].y);
    for (let p of trackPoints) ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 3. Dessiner les Losanges (Gems)
    diamonds.forEach(d => {
        if (d.picked) return;
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.fillStyle = '#38bdf8';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#38bdf8';
        ctx.beginPath();
        ctx.moveTo(0, -10); ctx.lineTo(7, 0); ctx.lineTo(0, 10); ctx.lineTo(-7, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    });
    ctx.shadowBlur = 0;

    // 4. RENDU DE LA MOTO (Design double roues distinctes)
    ctx.save();
    ctx.translate(bike.x, bike.y);
    ctx.rotate(bike.angle);

    ctx.shadowBlur = 12;
    ctx.shadowColor = activeColor;
    ctx.fillStyle = activeColor;

    // Roue Arrière et Roue Avant séparées pour faire VRAIMENT moto
    ctx.beginPath(); ctx.arc(-18, 5, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(18, 5, 8, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    // Corps / Cadre de la moto
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-18, 5);
    ctx.lineTo(-5, -6);
    ctx.lineTo(10, -6);
    ctx.lineTo(18, 5);
    ctx.moveTo(-5, -6);
    ctx.lineTo(2, -14); // Guidon / cockpit de la moto
    ctx.lineTo(10, -6);
    ctx.stroke();

    ctx.restore();
    ctx.restore();
}

function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
}

function runLoop() {
    if (!isPlaying) return;
    updatePhysics();
    drawGame();
    requestAnimationFrame(runLoop);
}

function crash() {
    isPlaying = false;
    document.getElementById('menu-title').textContent = "CRASH !";
    document.getElementById('startBtn').textContent = "RÉESSAYER";
    document.getElementById('menu-overlay').style.display = 'flex';

    if (score > highscore) {
        highscore = Math.floor(score);
        document.getElementById('best').textContent = highscore;
    }
    if (uId) {
        set(ref(db, `neon_rider_v3/${uId}`), { best: highscore, gems: totalGems });
    }
}

document.getElementById('startBtn').addEventListener('click', startRun);
</script>
</body>
</html>
