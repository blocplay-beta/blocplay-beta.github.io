<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker 2.0 - BlocPlay Edition</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-color: #161b22;
            --accent-neon: #58a6ff;
            --accent-pink: #f43f5e;
            --text-color: #c9d1d9;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* En-tête profil */
        .header-profile {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--panel-color);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logout-btn {
            background: #21262d;
            color: var(--accent-pink);
            border: 1px solid #30363d;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .logout-btn:hover { background: #f43f5e22; }

        h1 {
            font-size: 3rem;
            margin: 0 0 5px 0;
            background: linear-gradient(45deg, var(--accent-neon), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(88, 166, 255, 0.2);
        }

        .container {
            display: flex;
            gap: 40px;
            max-width: 900px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Section Clicker */
        .clicker-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--panel-color);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid #30363d;
            position: relative;
        }

        .stats-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .score-val {
            font-size: 3.5rem;
            font-weight: bold;
            color: #ffffff;
            margin: 0;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .sps-val {
            font-size: 1.1rem;
            color: #8b949e;
            margin: 5px 0 0 0;
        }

        #big-cookie {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #1f2937 0%, #111827 100%);
            border: 5px solid var(--accent-neon);
            box-shadow: 0 0 30px rgba(88, 166, 255, 0.3);
            cursor: pointer;
            outline: none;
            transition: transform 0.05s, box-shadow 0.2s;
            position: relative;
        }

        #big-cookie:hover {
            box-shadow: 0 0 40px rgba(88, 166, 255, 0.5);
            transform: scale(1.02);
        }

        #big-cookie:active {
            transform: scale(0.95);
        }

        /* Section Boutique */
        .shop-section {
            width: 320px;
            background: var(--panel-color);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .shop-title {
            font-size: 1.5rem;
            margin: 0 0 10px 0;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            color: #ffffff;
        }

        .shop-item {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .shop-item:hover:not(.disabled) {
            border-color: var(--accent-neon);
            background: #282e38;
        }

        .shop-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .item-info h4 { margin: 0; color: #ffffff; }
        .item-info p { margin: 4px 0 0 0; font-size: 0.85rem; color: #8b949e; }
        
        .item-cost {
            font-weight: bold;
            color: var(--accent-neon);
            text-align: right;
        }
        .item-count {
            font-size: 0.8rem;
            color: #8b949e;
            display: block;
            margin-top: 2px;
        }

        /* Notifications & Autosave */
        #notification-zone {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #238636;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        /* Animation des chiffres flottants */
        .floating-number {
            position: fixed;
            color: var(--accent-neon);
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 9999;
            text-shadow: 0 0 8px rgba(0,0,0,0.6);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(0.8); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="header-profile">
        <span id="user-email">Chargement...</span>
        <button class="logout-btn" id="logout-btn">Quitter</button>
    </div>

    <h1>Clicker 2.0</h1>

    <div class="container">
        <div class="clicker-section">
            <div class="stats-display">
                <div class="score-val" id="score-display">0</div>
                <div class="sps-val" id="sps-display">Par seconde: 0</div>
            </div>
            <button id="big-cookie"></button>
        </div>

        <div class="shop-section">
            <div class="shop-title">💎 Améliorations</div>
            
            <div class="shop-item" id="buy-clicker">
                <div class="item-info">
                    <h4>Super Curseur</h4>
                    <p>+1 par clic</p>
                </div>
                <div>
                    <div class="item-cost" id="cost-clicker">15</div>
                    <span class="item-count" id="count-clicker">Niv. 0</span>
                </div>
            </div>

            <div class="shop-item" id="buy-miner">
                <div class="item-info">
                    <h4>Serveur Auto</h4>
                    <p>+1 score / sec</p>
                </div>
                <div>
                    <div class="item-cost" id="cost-miner">100</div>
                    <span class="item-count" id="count-miner">Qté: 0</span>
                </div>
            </div>
        </div>
    </div>

    <div id="notification-zone">Sauvegarde automatique...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
            authDomain: "blocplay-a9417.firebaseapp.com",
            databaseURL: "https://blocplay-a9417-default-rtdb.firebaseio.com",
            projectId: "blocplay-a9417",
            storageBucket: "blocplay-a9417.firebasestorage.app",
            messagingSenderId: "540161549188",
            appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
        };

        // Init Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // Variables d'état du Jeu
        let game = {
            score: 0,
            clickPower: 1,
            autoPower: 0,
            clickerLevel: 0,
            minerCount: 0,
            clickerCost: 15,
            minerCost: 100
        };

        let currentUser = null;
        let autosaveInterval = null;

        // DOM elements
        const scoreDisplay = document.getElementById("score-display");
        const spsDisplay = document.getElementById("sps-display");
        const cookieBtn = document.getElementById("big-cookie");
        const notifZone = document.getElementById("notification-zone");
        
        const btnClicker = document.getElementById("buy-clicker");
        const costClicker = document.getElementById("cost-clicker");
        const countClicker = document.getElementById("count-clicker");

        const btnMiner = document.getElementById("buy-miner");
        const costMiner = document.getElementById("cost-miner");
        const countMiner = document.getElementById("count-miner");

        // --- AUTHENTIFICATION & REDIRECTION ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // L'utilisateur est connecté, on initialise le jeu
                currentUser = user;
                document.getElementById("user-email").textContent = user.email;
                loadGameData(user.uid);
                
                // Lancer la boucle de clics automatiques (toutes les secondes)
                setInterval(() => {
                    if (game.autoPower > 0) {
                        game.score += game.autoPower;
                        updateUI();
                    }
                }, 1000);

                // Lancer l'AUTOSAVE (toutes les 10 secondes)
                autosaveInterval = setInterval(() => {
                    saveGameData(false); 
                }, 10000);

            } else {
                // REDIRECTION SI NON CONNECTÉ
                window.location.href = "https://blocplay-beta.github.io/login";
            }
        });

        // Déconnexion
        document.getElementById("logout-btn").addEventListener("click", () => {
            clearInterval(autosaveInterval);
            signOut(auth).then(() => {
                window.location.href = "https://blocplay-beta.github.io/login";
            });
        });

        // --- LOGIQUE DU JEU ---

        // Clic sur le gros bouton central
        cookieBtn.addEventListener("click", (e) => {
            game.score += game.clickPower;
            updateUI();
            createFloatingNumber(e.clientX, e.clientY, `+${game.clickPower}`);
        });

        // Achat : Super Curseur
        btnClicker.addEventListener("click", () => {
            if (game.score >= game.clickerCost) {
                game.score -= game.clickerCost;
                game.clickerLevel++;
                game.clickPower += 1;
                game.clickerCost = Math.round(15 * Math.pow(1.5, game.clickerLevel));
                updateUI();
            }
        });

        // Achat : Serveur Automatique
        btnMiner.addEventListener("click", () => {
            if (game.score >= game.minerCost) {
                game.score -= game.minerCost;
                game.minerCount++;
                game.autoPower += 1;
                game.minerCost = Math.round(100 * Math.pow(1.15, game.minerCount));
                updateUI();
            }
        });

        // Mise à jour de l'interface
        function updateUI() {
            scoreDisplay.textContent = Math.floor(game.score);
            spsDisplay.textContent = `Par seconde: ${game.autoPower}`;
            
            costClicker.textContent = game.clickerCost;
            countClicker.textContent = `Niv. ${game.clickerLevel}`;
            
            costMiner.textContent = game.minerCost;
            countMiner.textContent = `Qté: ${game.minerCount}`;

            // Désactivation visuelle des boutons si pas assez de crédits
            if (game.score < game.clickerCost) btnClicker.classList.add("disabled");
            else btnClicker.classList.remove("disabled");

            if (game.score < game.minerCost) btnMiner.classList.add("disabled");
            else btnMiner.classList.remove("disabled");
        }

        // Effet de texte flottant lors du clic
        function createFloatingNumber(x, y, text) {
            const el = document.createElement("div");
            el.className = "floating-number";
            el.style.left = `${x - 10}px`;
            el.style.top = `${y - 20}px`;
            el.textContent = text;
            document.body.appendChild(el);
            
            el.addEventListener("animationend", () => {
                el.remove();
            });
        }

        // Notification d'état rapide
        function triggerNotification(message) {
            notifZone.textContent = message;
            notifZone.style.opacity = "1";
            setTimeout(() => { notifZone.style.opacity = "0"; }, 2000);
        }

        // --- SAUVEGARDE ET CHARGEMENT FIREBASE ---

        // Fonction de sauvegarde (Appelée automatiquement)
        function saveGameData(showNotif = true) {
            if (!currentUser) return;
            
            set(ref(db, 'clicker2_saves/' + currentUser.uid), {
                game: game,
                lastSaved: new Date().toISOString()
            })
            .then(() => {
                if(showNotif) triggerNotification("💾 Sauvegarde automatique effectuée !");
                else {
                    // Petit flash vert discret sur le score ou console pour valider l'autosave discrète
                    console.log("Autosave Firebase synchronisée.");
                }
            })
            .catch((err) => console.error("Erreur d'autosave:", err));
        }

        // Chargement initial des données
        function loadGameData(uid) {
            const dbRef = ref(db);
            get(child(dbRef, `clicker2_saves/${uid}`)).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if(data.game) {
                        game = data.game;
                    }
                    triggerNotification("✅ Progression chargée !");
                } else {
                    console.log("Nouvelle partie pour ce compte.");
                }
                updateUI();
            }).catch((error) => {
                console.error("Erreur de chargement:", error);
                updateUI();
            });
        }

        // Sécurité supplémentaire : Sauvegarder si l'onglet se ferme
        window.addEventListener("beforeunload", () => {
            saveGameData(false);
        });

    </script>
</body>
</html>
