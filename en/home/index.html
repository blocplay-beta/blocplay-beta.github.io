<script>
  (function() {
    const currentPath = window.location.pathname;
    const userLang = navigator.language || navigator.userLanguage;
    const isFrench = userLang.toLowerCase().startsWith('fr');
      
    const targetLang = isFrench ? 'fr' : 'en';
    const targetUrl = `/${targetLang}/home`;
      
    if (!currentPath.startsWith(`/${targetLang}/`)) {
      window.location.replace(targetUrl);
    }
  })();
</script>

<script type="module">

  import {

  const firebaseConfig = {
    apiKey: "AIzaSyAQHLAG_Dvnc-a8LDJ__05oRwMmEtUkn04",
    authDomain: "blocplay-a9417.firebaseapp.com",
    projectId: "blocplay-a9417",
    storageBucket: "blocplay-a9417.firebasestorage.app",
    messagingSenderId: "540161549188",
    appId: "1:540161549188:web:e0ec0350bd044de2f333d1"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  const avatar = document.getElementById("avatar");

  const searchBtn = document.getElementById("searchBtn");

  const searchOverlay = document.getElementById("searchOverlay");

  /* =========================================================
     MENU

  async function renderMenu(user) {

    if (!user) {

      avatar.src =
        "https://ui-avatars.com/api/?name=User&background=111&color=fff&rounded=true&size=64";

      dropdown.innerHTML = `
        <a href="/login">Log in</a>
        <a href="/signup">Create an account</a>
      `;

      return;
    }


    let userData = {};

    try {

      const userRef =
        doc(db, "users", user.uid);

      const userSnap =
        await getDoc(userRef);

      if (userSnap.exists()) {
        userData = userSnap.data();
      }

    } catch (error) {

      console.error(
        "Error loading user:",
        error
      );

    }


    const photo =
      userData.photoURL ||
      userData.avatar ||
      user.photoURL;


    const name =
      userData.username ||
      userData.displayName ||
      user.displayName ||
      "User";


    if (photo) {

      avatar.src = photo;

    } else {

      avatar.src =
        `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=111&color=fff&rounded=true&size=64`;

    }


    dropdown.innerHTML = `
      <a href="/profile">Profile</a>
      <a href="/settings">Settings</a>
      <a href="/rizoplay">RizoPlay</a>
      <a href="#" id="logout">Log out</a>
    `;


    const logout =
      document.getElementById("logout");


    logout.addEventListener(
      "click",
      async (event) => {

        event.preventDefault();

        try {

          await signOut(auth);

          window.location.href = "/";

        } catch (error) {

          console.error(
            "Logout error:",
            error
          );

        }

      }
    );

  }


  /* =========================================================
     PROFILE MENU
  ========================================================= */

      dropdown.classList.toggle("show");

    }

  /* =========================================================
     FRIEND REQUESTS
  ========================================================= */

  function createFriendRequest(
    data,
    senderUid
  ) {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "friend-request-item";


    const info =
      document.createElement("div");

    info.className =
      "friend-request-info";


    const name =
      document.createElement("div");

    name.className =
      "friend-request-name";


    name.textContent =
      data.username ||
      data.displayName ||
      "User";


    const label =
      document.createElement("div");

    label.className =
      "friend-request-label";


    label.textContent =
      "Friend request";


    info.appendChild(name);

    info.appendChild(label);


    const actions =
      document.createElement("div");

    actions.className =
      "friend-request-actions";


    const accept =
      document.createElement("button");

    accept.className =
      "friend-request-accept";

    accept.textContent =
      "Accept";


    const reject =
      document.createElement("button");

    reject.className =
      "friend-request-reject";

    reject.textContent =
      "X";


    accept.dataset.action =
      "accept";

    accept.dataset.senderUid =
      senderUid;


    reject.dataset.action =
      "reject";

    reject.dataset.senderUid =
      senderUid;


    actions.appendChild(accept);

    actions.appendChild(reject);


    wrapper.appendChild(info);

    wrapper.appendChild(actions);


    return wrapper;

  }


  async function loadFriendRequests(uid) {

    const requestsRef =
      collection(
        db,
        "users",
        uid,
        "friendRequests"
      );


    const snapshot =
      await getDocs(requestsRef);


    const requests = [];


    for (
      const requestDoc
      of snapshot.docs
    ) {

      const requestData =
        requestDoc.data();


      if (
        requestData.status !==
        "pending"
      ) {

        continue;

      }


      const senderUid =
        requestData.senderUid ||
        requestDoc.id;


      let senderData = {};


      try {

        const publicRef =
          doc(
            db,
            "publicUsers",
            senderUid
          );


        const publicSnap =
          await getDoc(publicRef);


        if (publicSnap.exists()) {

          senderData =
            publicSnap.data();

        } else {

          const userRef =
            doc(
              db,
              "users",
              senderUid
            );


          const userSnap =
            await getDoc(userRef);


          if (userSnap.exists()) {

            senderData =
              userSnap.data();

          }

        }

      } catch (error) {

        console.error(
          "Error loading friend request sender:",
          error
        );

      }


      requests.push({
        senderUid,
        data: senderData
      });

    }


    return requests;

  }


  async function getUserPublicData(uid) {

    const publicRef =
      doc(
        db,
        "publicUsers",
        uid
      );


    const publicSnap =
      await getDoc(publicRef);


    if (publicSnap.exists()) {

      return publicSnap.data();

    }


    const userRef =
      doc(
        db,
        "users",
        uid
      );


    const userSnap =
      await getDoc(userRef);


    if (userSnap.exists()) {

      return userSnap.data();

    }


    return {};

  }


  async function acceptFriendRequest(
    uid,
    senderUid
  ) {

    const requestRef =
      doc(
        db,
        "users",
        uid,
        "friendRequests",
        senderUid
      );


    const requestSnap =
      await getDoc(requestRef);


    if (!requestSnap.exists()) {

      throw new Error(
        "This friend request no longer exists."
      );

    }


    const requestData =
      requestSnap.data();


    if (
      requestData.senderUid !==
      senderUid
    ) {

      throw new Error(
        "Invalid friend request."
      );

    }


    if (
      requestData.recipientUid &&
      requestData.recipientUid !== uid
    ) {

      throw new Error(
        "Invalid recipient."
      );

    }


    const myData =
      await getUserPublicData(uid);


    const senderData =
      await getUserPublicData(senderUid);


    const myFriendRef =
      doc(
        db,
        "users",
        uid,
        "friends",
        senderUid
      );


    const senderFriendRef =
      doc(
        db,
        "users",
        senderUid,
        "friends",
        uid
      );


    await setDoc(
      myFriendRef,
      {
        uid: senderUid,

        username:
          senderData.username || "",

        displayName:
          senderData.displayName ||
          senderData.username ||
          "User",

        photoURL:
          senderData.photoURL ||
          senderData.avatar ||
          "",

        addedAt:
          serverTimestamp()
      }
    );


    await setDoc(
      senderFriendRef,
      {
        uid,

        username:
          myData.username || "",

        displayName:
          myData.displayName ||
          myData.username ||
          "User",

        photoURL:
          myData.photoURL ||
          myData.avatar ||
          "",

        addedAt:
          serverTimestamp()
      }
    );


    await deleteDoc(
      requestRef
    );

  }


  async function rejectFriendRequest(
    uid,
    senderUid
  ) {

    const requestRef =
      doc(
        db,
        "users",
        uid,
        "friendRequests",
        senderUid
      );


    await deleteDoc(
      requestRef
    );

  }


  async function handleFriendRequestAction(
    button
  ) {

    const senderUid =
      button.dataset.senderUid;


    const action =
      button.dataset.action;


    if (!senderUid || !action) {
      return;
    }


    const container =
      button.closest(
        ".friend-request-item"
      );


    const buttons =
      container.querySelectorAll(
        "button"
      );


    buttons.forEach(
      (item) => {
        item.disabled = true;
      }
    );


    try {

      if (action === "accept") {

        await acceptFriendRequest(
          currentUser.uid,
          senderUid
        );

      }


      if (action === "reject") {

        await rejectFriendRequest(
          currentUser.uid,
          senderUid
        );

      }


      await loadContacts(
        currentUser.uid
      );

    } catch (error) {

      console.error(
        "Friend request error:",
        error
      );


      buttons.forEach(
        (item) => {
          item.disabled = false;
        }
      );


      alert(
        "Unable to process this friend request."
      );

    }

  }


  /* =========================================================
     CONTACTS
  ========================================================= */

  async function loadContacts(uid) {

    const container =
      document.getElementById(
        "contacts"
      );


    container.innerHTML =
      "Loading...";


    try {

      const requests =
        await loadFriendRequests(
          uid
        );


      const friendsRef =
        collection(
          db,
          "users",
          uid,
          "friends"
        );


      const friendsQuery =
        query(
          friendsRef,
          orderBy(
            "addedAt",
            "desc"
          ),
          limit(6)
        );


      const friendsSnapshot =
        await getDocs(
          friendsQuery
        );


      container.innerHTML = "";


      /* FRIEND REQUESTS */

      for (
        const request
        of requests
      ) {

        const requestElement =
          createFriendRequest(
            request.data,
            request.senderUid
          );


        container.appendChild(
          requestElement
        );

      }


      /* FRIENDS */

      for (
        const friendDoc
        of friendsSnapshot.docs
      ) {

        const friend =
          friendDoc.data();


        const friendUid =
          friend.uid ||
          friendDoc.id;


        let friendData =
          friend;


        try {

          const data =
            await getUserPublicData(
              friendUid
            );


          if (
            data &&
            Object.keys(data).length
          ) {

            friendData = {
              ...friend,
              ...data
            };

          }

        } catch (error) {

          console.error(
            "Error loading friend:",
            error
          );

        }


        const friendElement =
          document.createElement(
            "div"
          );


        friendElement.className =
          "item";


        const friendName =
          friendData.username ||
          friendData.displayName ||
          "User";


        friendElement.innerHTML = `
          <a href="/profile#${friendUid}">
            ${friendName}
          </a>
        `;


        container.appendChild(
          friendElement
        );

      }


      if (
        !requests.length &&
        !friendsSnapshot.docs.length
      ) {

        container.innerHTML =
          `<div class="empty">No contacts</div>`;

      }


      container
        .querySelectorAll(
          ".friend-request-actions button"
        )
        .forEach(
          (button) => {

            button.addEventListener(
              "click",
              () => {

                handleFriendRequestAction(
                  button
                );

              }
            );

          }
        );


    } catch (error) {

      console.error(
        "Error loading contacts:",
        error
      );


      container.innerHTML =
        `<div class="empty">Unable to load contacts</div>`;

    }

  }


  /* =========================================================
     GENERIC COLLECTION LOADER
  ========================================================= */

  async function loadCollection(
    uid,
    collectionName,
    elementId,
    emptyText
  ) {

    const container =
      document.getElementById(
        elementId
      );


    container.innerHTML =
      "Loading...";


    try {

      const ref =
        collection(
          db,
          "users",
          uid,
          collectionName
        );


      const snapshot =
        await getDocs(
          ref
        );


      container.innerHTML = "";


      if (snapshot.empty) {

        container.innerHTML =
          `<div class="empty">${emptyText}</div>`;

        return;

      }


      snapshot.forEach(
        (item) => {

          const data =
            item.data();


          const element =
            document.createElement(
              "div"
            );


          element.className =
            "item";


          const name =
            data.name ||
            data.title ||
            data.username ||
            data.displayName ||
            item.id;


          element.innerHTML =
            `<span>${name}</span>`;


          container.appendChild(
            element
          );

        }
      );


    } catch (error) {

      console.error(
        `Error loading ${collectionName}:`,
        error
      );


      container.innerHTML =
        `<div class="empty">${emptyText}</div>`;

    }

  }


  /* =========================================================
     POPULAR COLLECTIONS
  ========================================================= */

  async function loadPopular(
    collectionName,
    elementId,
    emptyText
  ) {

    const container =
      document.getElementById(
        elementId
      );


    container.innerHTML =
      "Loading...";


    try {

      const ref =
        collection(
          db,
          collectionName
        );


      const popularQuery =
        query(
          ref,
          limit(6)
        );


      const snapshot =
        await getDocs(
          popularQuery
        );


      container.innerHTML = "";


      if (snapshot.empty) {

        container.innerHTML =
          `<div class="empty">${emptyText}</div>`;

        return;

      }


      snapshot.forEach(
        (item) => {

          const data =
            item.data();


          const element =
            document.createElement(
              "div"
            );


          element.className =
            "item";


          const name =
            data.name ||
            data.title ||
            data.username ||
            data.displayName ||
            item.id;


          element.innerHTML =
            `<span>${name}</span>`;


          container.appendChild(
            element
          );

        }
      );


    } catch (error) {

      console.error(
        `Error loading ${collectionName}:`,
        error
      );


      container.innerHTML =
        `<div class="empty">${emptyText}</div>`;

    }

  }


  /* =========================================================
     SEARCH
  ========================================================= */

  searchBtn.addEventListener(
    "click",
    () => {

      searchOverlay.classList.add(
        "active"
      );

      searchInput.focus();

    }
  );


  closeSearch.addEventListener(
    "click",
    () => {

      searchOverlay.classList.remove(
        "active"
      );

      searchInput.value = "";

      searchResults.innerHTML = "";

    }
  );


  searchOverlay.addEventListener(
    "click",
    (event) => {

      if (
        event.target ===
        searchOverlay
      ) {

        searchOverlay.classList.remove(
          "active"
        );

      }

    }
  );


  searchInput.addEventListener(
    "keydown",
    async (event) => {

      if (
        event.key !==
        "Enter"
      ) {

        return;

      }


      const search =
        searchInput.value
          .trim()
          .toLowerCase();


      if (!search) {

        searchResults.innerHTML =
          "";

        return;

      }


      searchResults.innerHTML =
        "<div>Searching...</div>";


      try {

        const results = [];


        /* USERS */

        const usersSnapshot =
          await getDocs(
            collection(
              db,
              "users"
            )
          );


        usersSnapshot.forEach(
          (item) => {

            const data =
              item.data();


            const name =
              data.username ||
              data.displayName ||
              "";


            if (
              name
                .toLowerCase()
                .includes(search)
            ) {

              results.push({
                type: "user",
                name,
                url:
                  `/profile#${data.id || item.id}`
              });

            }

          }
        );


        /* GAMES */

        const gamesSnapshot =
          await getDocs(
            collection(
              db,
              "games"
            )
          );


        gamesSnapshot.forEach(
          (item) => {

            const data =
              item.data();


            const name =
              data.name ||
              data.title ||
              "";


            if (
              name
                .toLowerCase()
                .includes(search)
            ) {

              results.push({
                type: "game",
                name,
                url:
                  `/game/${item.id}`
              });

            }

          }
        );


        searchResults.innerHTML =
          "";


        if (!results.length) {

          searchResults.innerHTML =
            `<div>Aucun résultat trouvé</div>`;

          return;

        }


        results
          .slice(0, 20)
          .forEach(
            (result) => {

              const element =
                document.createElement(
                  "a"
                );


              element.href =
                result.url;


              element.className =
                "search-result";


              element.textContent =
                result.name;


              searchResults.appendChild(
                element
              );

            }
          );


      } catch (error) {

        console.error(
          "Search error:",
          error
        );


        searchResults.innerHTML =
          "<div>Search error.</div>";

      }

    }
  );


  /* =========================================================
     AUTH
  ========================================================= */

  onAuthStateChanged(
    auth,
    async (user) => {

      currentUser =
        user;


      await renderMenu(
        user
      );


      if (!user) {

        window.location.href =
          "/login";

        return;

      }


      await loadContacts(
        user.uid
      );


      await loadCollection(
        user.uid,
        "recentlyPlayed",
        "recentlyPlayed",
        "No recently played games"
      );


      await loadCollection(
        user.uid,
        "favorites",
        "favorites",
        "No favorites"
      );


      await loadCollection(
        user.uid,
        "recentlyObtained",
        "recentlyObtained",
        "Nothing recently obtained"
      );


      await loadCollection(
        user.uid,
        "tribes",

      );


      await loadPopular(
        "games",
        "popularGames",

      );


      await loadPopular(
        "publicUsers",
        "popularContacts",

      );


      await loadPopular(

  );


  /* =========================================================
     SERVICE WORKER
  ========================================================= */

  if (
    "serviceWorker" in navigator
  ) {

    navigator.serviceWorker
      .register(
        "/service-worker.js"
      )
      .catch(
        (error) => {

          console.error(
            "Service worker error:",
            error
          );

        }
      );

  }

</script>
